name: Deploy Dashboard to GitHub Pages

on:
  # Deploy immediately only when the DASHBOARD CODE changes. The blocklists/iocs
  # data pushes happen many times a day (hourly sync + scan bundles); deploying
  # Pages on each one exhausted GitHub Pages' ~10-deployments/hour limit →
  # "Deployment failed, try again later" (2026-07-03). The dashboard fetches its
  # DB from api.aptwatch.org at runtime, so a data push needs no redeploy; the
  # downloadable blocklists/iocs copied into web/ are refreshed once a day below.
  push:
    branches: [main]
    paths:
      - 'web/**'
  schedule:
    - cron: '0 6 * * *'   # daily refresh of the downloadable blocklists/iocs on Pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Allow only one concurrent Pages deployment; queue newer runs behind the one
  # in progress. Do NOT cancel in-progress runs — cancelling a Pages deployment
  # mid-flight leaves the Pages API in a bad state and makes the next run fail
  # with "Deployment failed, try again later." (GitHub's official Pages workflow
  # uses cancel-in-progress: false for exactly this reason). Flipped 2026-07-03
  # after clustered publish/sync pushes triggered that error.
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Prepare Pages content
        run: |
          # CNAME for custom domain
          echo "aptwatch.org" > web/CNAME

          # Copy logo assets into web/
          cp aptwatch-logo.svg web/ 2>/dev/null || true
          cp aptwatch-logo.png web/ 2>/dev/null || true

          # Copy blocklists for direct download
          mkdir -p web/blocklists
          cp blocklists/* web/blocklists/ 2>/dev/null || true

          # Copy IOC files
          mkdir -p web/iocs
          cp iocs/*.txt web/iocs/ 2>/dev/null || true
          # Copy Suricata rules
          mkdir -p web/iocs/suricata
          cp iocs/suricata/*.rules web/iocs/suricata/ 2>/dev/null || true

          # Web database is intentionally NOT in this repo (decoupled 2026-06-20 to stop the
          # ~43 MB binary bloating .git). The dashboard fetches it from api.aptwatch.org. Its
          # absence here is expected and not an error.
          if [ -f web/apt_intel_web.db ]; then
            echo "Web database present in repo: $(du -h web/apt_intel_web.db | cut -f1) (legacy copy)"
          else
            echo "Web database served off-repo from api.aptwatch.org (decoupled 2026-06-20)."
          fi

          # feeds.html is maintained manually in web/feeds.html (Phase 3 unified design).
          # No auto-generation here — the committed file is what gets deployed.

          echo "Pages content:"
          find web/ -type f | head -30

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'web/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
