  API spx.pamconj[.]com and the ARToken panel dashboard-bl.pamconj[.]com, plus the
  Cloudflare-Workers lure host clear90489058903-document.workers[.]dev. Additional
  operator UUID 84eb384d-cd3e-4c90-a283-c960ce557913 and XOR payload key (16-byte)
  are not storable IOC types. NOT included as IOCs (discipline / anti-mislabelling):
