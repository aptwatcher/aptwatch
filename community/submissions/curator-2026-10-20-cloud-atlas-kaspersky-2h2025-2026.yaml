# domains used in MS Office documents" are a mixed list: 15 kept at the heuristic
# compromised_legitimate verdict (clear small-business / regional naming), kommando.live kept at
# the heuristic malicious verdict. Shared-platform rule: hostingersite.com apex NOT listed — only
