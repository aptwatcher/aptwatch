source: https://securelist.com/cloud-atlas-2026/119895/
source_name: "Kaspersky Securelist — Cloud Atlas activity in the second half of 2025 and early 2026 (2026-05-22)"

apt_groups:
  - Cloud Atlas
  - Inception
  - Clean Ursa
  - Oxygen

description: >
  Kaspersky GReAT report (2026-05-22) on Cloud Atlas (aka Inception, Clean
  Ursa, Oxygen; Russian-speaking espionage group known since 2014) activity in
  2H2025 and early 2026 against government organizations and commercial
  companies in Russia and Belarus. Initial access by phishing ZIP archives
  containing LNK shortcuts that fetch PowerShell from external hosts (plus the
  long-running CVE-2018-0802 Equation Editor documents); fixed.ps1 loader
  installs the VBCloud backdoor/stealer (video.vbs + RC4-encrypted video.mds)
  and the PowerShower reconnaissance/lateral-movement backdoor
  (googleearth.ps1; Kerberoasting; SAM/SECURITY theft via VSS with a
  fodhelper.exe UAC bypass); post-exploitation uses patched termsrv.dll
  multi-session RDP, a custom portable OpenSSH for reverse SSH tunnels,
  RevSocks and Tor as backup control channels. IOC set: 7 reverse-SSH/SOCKS
  C2 domains and 3 PowerShell staging domains (attacker infrastructure per
  Kaspersky; listed as malicious), 19 PowerShell-staging IPv4, and 16
  document-hosting domains triaged as hijacked legitimate sites
  (compromised_domains) except kommando.live. Cross-campaign note:
  194.102.104.207 sits inside the DB's "AVA HOST 194.102.104/24 Hosting Pool
  (ALEXHOST-adjacent)" cluster — shared bulletproof hosting, not an operator
  link. MITRE: T1566.001, T1204.002, T1059.001, T1203 (CVE-2018-0802),
  T1547.001, T1548.002, T1003.002, T1558.003, T1021.001, T1572, T1090.

