author: aptwatch-curator

source: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-204a
source_name: Joint CSA AA26-204A — Russian State-Supported Actors Target Zimbra Collaboration Suite (Void Blizzard / Laundry Bear) (2026-07-23)

apt_groups:
  - Void Blizzard / Laundry Bear
  - Void Blizzard
  - Laundry Bear
  - CL-STA-1114
  - TA488
  - UNK_PitStop

description: >
  Six attacker-registered Zimbra-infrastructure impersonation domains plus the
  exploited CVE, attributed to the Russian state espionage actor Void Blizzard
  (aka Laundry Bear, CL-STA-1114, TA488, UNK_PitStop) by joint Cybersecurity
  Advisory AA26-204A (2026-07-23, CISA + partners). The actor exploits Zimbra
  Collaboration Suite Classic-UI XSS CVE-2025-66376 (insufficient sanitization of
  CSS @import directives) as a zero-click, view-based exploit: JavaScript hidden
  in an SVG element (Base64 + XOR + variable CSS to evade signatures) runs when a
  victim merely previews a crafted HTML email. The payload ("Ulej") scrapes ~90
  days of mailbox data via Zimbra SOAP requests, enumerates the Global Address
  List, harvests credentials/2FA scratch codes, enables IMAP
  (zimbraPrefImapEnabled) and mints a "ZimbraWeb" application passcode to bypass
  MFA, then exfiltrates over DNS (A-record encoded) and HTTPS (Let's Encrypt) to
  actor infrastructure running the "Flowerbed" collection framework. The actor
  also runs AiTM phishing kits impersonating Zimbra login portals. Ingested IOCs:
  6 impersonation domains (mailnalysis.com, emailanalytics.com.ua, zimbrastat.com,
  zimbra-metadata.com, istc-cloud.com, zmailanalytics.com) and CVE-2025-66376.
  ATTRIBUTION OVERLAP: mailnalysis.com, zimbrastat.com, zimbra-metadata.com and
  istc-cloud.com are already in apt-intel auto-attributed to Pawn Storm (APT28)
  at 0.5; CISA attributes them to Void Blizzard — flagged for review, not proof
  of shared operator. NEW campaign proposal (no existing Void Blizzard campaign).
  SCOPE: Flowerbed/Ulej are tooling names not IOCs; DNS/HTTPS exfil and
  Mullvad-fronted rotating VPS infra were not enumerated as concrete IPs (none
  fabricated). Discovery vector / sister coverage: BleepingComputer
  (https://www.bleepingcomputer.com/news/security/russian-hackers-exploit-zimbra-zero-click-flaw-for-email-theft/,
  2026-07-23, source of the reproduced IOC list), GBHackers
  (https://gbhackers.com/russian-laundry-bear-hackers-exploit-zimbra/, 2026-07-24),
  Security Affairs
  (https://securityaffairs.com/195901/apt/us-agencies-warn-of-laundry-bear-campaign-targeting-unpatched-zimbra-servers.html,
  2026-07-24), Microsoft Void Blizzard profile
  (https://www.microsoft.com/en-us/security/blog/2025/05/27/new-russia-affiliated-actor-void-blizzard-targets-critical-sectors-for-espionage/).

domains:
  - mailnalysis.com
  - emailanalytics.com.ua
  - zimbrastat.com
  - zimbra-metadata.com
  - istc-cloud.com
  - zmailanalytics.com

cves:
  - CVE-2025-66376
