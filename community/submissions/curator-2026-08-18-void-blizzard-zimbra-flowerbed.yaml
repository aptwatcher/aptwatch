description: >
  Backfill of CISA AA26-204A (2026-07-22, TLP:CLEAR; joint with NSA, FBI and
  9 allied agencies; full CSA PDF at
  https://media.defense.gov/2026/Jul/22/2003965244/-1/-1/0/CSA_RUSSIA_PHISHING_TARGET_ZIMBRA.PDF).
  Void Blizzard / Laundry Bear exploits CVE-2025-66376, a zero-click XSS in
  Zimbra Collaboration Suite Classic UI, via the "Ulej" capability embedded in
  phishing emails: on message open it exfiltrates the GAL, the last 90 days of
  mail, credentials and 2FA tokens, and mints a rogue "ZimbraWeb" application
  passcode for MFA-bypass persistence. Exfiltration over DNS A-record queries
  (small data) and HTTPS archives (bulk) to the actor's "Flowerbed" collection
  framework. Domains listed here are the attacker-registered Flowerbed servers
  (Zimbra-themed lookalikes, malicious); each carries its report-stated
  hosting IP. compromised_domains are legitimate Ukrainian orgs
  (isofts.kiev.ua, navs.edu.ua) whose mailboxes were abused as phishing
  senders — per the CSA's "presumably compromised" language; do not blocklist.
  Emails are attacker procurement + distribution accounts; their provider
  apexes (proton.me, pinmx.net, buildandconsulting.com) are deliberately NOT
  listed as domain IOCs (shared/unverified mail platforms). CVE-2025-66376
  already in DB unattributed — this report adds attribution. Discovery vector:
  BleepingComputer coverage (2026-07-23,
  https://www.bleepingcomputer.com/news/security/russian-hackers-exploit-zimbra-zero-click-flaw-for-email-theft/).

