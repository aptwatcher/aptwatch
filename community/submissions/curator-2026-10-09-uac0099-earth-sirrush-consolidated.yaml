# Curator submission — UAC-0099 / Earth Sirrush consolidated infrastructure
#
# Primary: TrendAI Research technical brief "Earth Sirrush: A Russia-Aligned
# Intrusion Set With 4 Years of Evolving Espionage Tooling" (blog 2026-10-05,
# surfaced via The Hacker News 2026-10-08; full IOC list published at
# cdn.sanity.io .../earth-sirrush-ioc-list.txt, accessed 2026-10-09).
# Sister primary (same 24h window): ESET WeLiveSecurity "MATCHBOIL: New
# tricks, same old evil intentions" (2026-10-08, Fernando Tavella) — all 4
# ESET network domains and both ESET IPs are contained in the TrendAI set;
# ESET adds SHA-1 file hashes and first-seen dates (hashes logged in digest
# only; flat-IOC schema has no hash table).
#
# Attribution: apt_groups[0] matches existing campaign_name exactly
# (campaign id 103). New aliases Earth Sirrush / SHADOW-EARTH-065 / ASHVEIN /
# TelemetryBrowser / CINDERBLOT verified collision-free in campaigns.aliases.
#
# Triage (reports/triage/trendai-earth-sirrush-2026-10-09.csv): the offline
# heuristic defaulted 18/25 domains to compromised_legitimate. Curator
# override to malicious applied to the C&C / hosting / phishing domains on
# report-stated evidence: ESET MITRE mapping T1583.001 "UAC-0099 registers
# domains that are used for MATCHBOIL C&C communication"; TrendAI: confirmed
# C&C domains procured through a single registrar (Regery.com), Cloudflare
# fronting, backend IPs clustered in AS399629 (BL Networks).
# cyberflysystems.com + order.cyberflysystems.com are an attacker-built fake
# UAV-parts company site (TrendAI Fig. 1) -> malicious. veetransfer.com is a
# WeTransfer-lookalike delivery domain -> malicious (override documented).
# Kept conservative (compromised_domains): cyberathleticshealth.com (payload
# hosting, possible hijacked legitimate site), easysend.co (possible
# legitimate file-sharing service abused for delivery — verify before any
# blocklisting).
# Shared-platform exclusion: ukr.net apex NOT listed (legitimate Ukrainian
# mail platform); only the attacker-specific sender accounts are ingested.
#
# Duplicates expected at import (context/linkage keeps, not errors):
# virtualtelemetryassistant.com + 5 IPs (156.38.245.115, 179.48.251.182,
# 217.12.218.107, 45.148.121.6, 147.78.46.40) already in DB — re-listed
# because this report adds Earth Sirrush cross-campaign linkage.
# No CIDRs claimed by either report — none fabricated. AS399629 (BL Networks)
# concentration is context only.

