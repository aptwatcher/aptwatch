  - SHADOW-EARTH-065
  - ASHVEIN
  - TelemetryBrowser
  - CINDERBLOT

description: >
  Consolidated UAC-0099 (TrendAI: Earth Sirrush, prev. SHADOW-EARTH-065)
  infrastructure covering 2022-2026 operations against Ukrainian government,
  defense, border guard, logistics, transport, manufacturing and energy
  targets. New tooling documented this window: ASHVEIN (internally
  "TelemetryBrowser"), a .NET infostealer/RAT with DPAPI credential theft,
  GDI screenshots, PowerShell remote shell, WMI fingerprinting, tasking
  hidden in invisible HTML elements and a GitHub dead-drop fallback; plus the
  evolution of the MATCHBOIL C# downloader (ESET, 2026-10-08): .NET Reactor
  obfuscation, sandbox checks via EventID 6013 uptime (with Russian-language
  regex), two-minute C&C polling timer, MATCHBOIL.V2 DLL variant. Delivery
  via spear-phishing (ukr.net sender accounts impersonating police/courts/
  border service), VHD containers, DLL sideloading (FORGECLAMP), PNG
  steganography, fake UAV-parts storefront (order.cyberflysystems.com), and
  a malicious Notepad++ plugin chain (LUNCHPOKE/BURNYBEAR). C&C domains
  registered via Regery.com, Cloudflare-fronted, backends in AS399629
  (BL Networks); VPS via BitLaunch; Let's Encrypt TLS, certs not reused.
  ESET assesses UAC-0099 can act as initial access broker for Sandworm
  (APT44). Historical CVE-2023-38831 (WinRAR) exploitation retained for
  linkage. Discovery vector: The Hacker News (2026-10-08). SHA-256/SHA-1
  file hashes logged in the run digest.

