description: >
  APT28 (GRU Unit 26165 / Forest Blizzard) PixyNetLoader campaign. ExaTrack
  tracked ~90 samples (23 versions, 4 sub-families, 2024-04 to 2026-04). Chain:
  malicious DOC/XLS exploiting CVE-2026-21509 (Feb 2026) -> SimpleDropper ->
  PixyNetLoader DLL (COM persistence) + companion PNG -> Covenant Grunt
  extracted from PNG pixel LSBs (steganography), using the legitimate 'filen'
  cloud service as C2. Family C (from 2026-03-13) introduced AES/PBKDF2 PNG
  steganography. Sister coverage: Sekoia "Operation Phantom Net Voxel",
  Zscaler "Operation Neusploit", CERT-UA advisory 6287250 (Feb 2026).
  Only CVE-2026-21509 is ingestable here; the ~90 SHA256 sample hashes,
  PNG paths, COM CLSIDs and DLL paths are listed in the daily digest for a
  future hash-table addendum.
  ATTRIBUTION NOTE: apt_groups[0] set to 'APT28' (per CLAUDE.md coverage list).
  Confirm the exact campaign_name in the DB (APT28 vs Forest Blizzard) before
  import to avoid creating a duplicate campaign.

cves:
