author: aptwatch-curator
source: https://blog.exatrack.com/Tracking_APT28_PixyNetLoader/
source_name: ExaTrack - Tracking APT28 PixyNetLoader (2024-2026)

apt_groups:
  - APT28
  - Forest Blizzard
  - Fancy Bear
