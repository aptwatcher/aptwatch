description: >
  Google Threat Intelligence Group (GTIG) reports on COLDRIVER (Star Blizzard),
  a Russian FSB-linked state-sponsored threat actor, delivering LOSTKEYS malware
  to steal documents from Western advisors, journalists, NGOs, and
  Ukraine-linked individuals. GTIG attributes the activity to FSB Centre 18
  with high confidence, consistent with the joint CISA AA23-341A / NCSC-UK
  advisory dated December 2023 that assesses Star Blizzard is "almost certainly
  subordinate to the Russian Federal Security Service (FSB) Centre 18." The
  infection chain begins with a ClickFix-style fake-CAPTCHA page
  (T1059.001, T1204.001), which coerces the victim into executing a PowerShell
  command that downloads and runs a VBS script (T1059.003), ultimately
  retrieving and decoding the LOSTKEYS backdoor. Targeted victimology spans
  Western advisors, journalists, non-governmental organizations, and
  individuals with ties to Ukraine. Infrastructure roles: 165.227.148.68 (C2
  server), first seen in May 2025 activity; 80.66.88.67 (C2 server, December 2023
  activity). Two domains published in the same GTIG IOC table are already in
  the APT Watch database and are therefore excluded from the lists here:
  cloudmediaportal.com (C2) and njala.dev (C2, December 2023 activity) — refresh
  their last_seen timestamps on import. SHA-256 file indicators published by
  GTIG, no hash field in this schema, recorded here for the curator, flagged for
  EDR custom-indicator blocking: stage 1 fake-CAPTCHA page, stage 2 loader,
  stage 3 decoder, decoder script, encoded LOSTKEYS, decoded LOSTKEYS, two
  December 2023 Maltego-themed PE binaries, and a December 2023 LOSTKEYS sample
  (9 hashes total). The GTIG post also carries a YARA rule named
  LOSTKEYS__Strings for detecting the backdoor; the rule body is not included
  here. Companion sources: CISA AA23-341A
  (https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-341a) and
  Microsoft Threat Intelligence, "Star Blizzard increases sophistication and
  evasion in ongoing attacks" (December 2023). Flag originated from the manual
  curation run of 2026-10-14, APT Watch watchlist match, category:
  Russian-state-sponsored espionage.
  
