description: >
  Group-IB Threat Intelligence and NyxLab (joint investigation, 2026-10-21;
  discovery vector The Hacker News 2026-10-23) expose the tooling and operational
  data of "k0t" (aliases CryptoFeel, Member19, QazWsxShop; first seen 2025-10-22),
  an initial-access operator running a large-scale, exposure-led campaign against
  internet-facing network edge devices. Reconnaissance is bulk enumeration via
  FOFA / ZoomEye / Censys (GlobalProtect portals first, then FortiWeb / FortiGate /
  OPNsense), filtered by product and geography (US/CA, then EU, then APAC).
  Initial access: a custom "FortiGate Security Scanner" (fort.py / fortnew.py,
  SCRIPT_DEV "BH", ver 2025-12-08) exploits CVE-2025-64446 (FortiWeb relative path
  traversal) by hitting /api/v2.0/cmdb/system/admin%3f/../../../../../cgi-bin/fwbcgi
  with a forged CGIINFO header impersonating prof_admin to create a random
  8-character local administrator with trusted-host 0.0.0.0/0, and falls back to
  REST-API brute force against FortiGate with lockout-aware ("code 2", 60 s)
  retry logic; with --parse-configs it downloads the appliance configuration and
  decrypts stored secrets with the default FortiOS AES key (CVE-2019-6693) to
  recover LDAP/AD-bound, admin and local-user credentials. A second tool
  (exploit_2026_0257.py, "CVE-2026-0257 PAN-OS GlobalProtect Scanner + VPN
  Connect") exploits the PAN-OS GlobalProtect authentication bypass. Foothold is
  via OpenConnect VPN into the victim; post-exploitation uses NetExec, SoftPerfect,
  Impacket, noPac, Kerbrute, PetitPotam and Mimikatz, with persistence through
  MeshAgent (central MeshCentral servers mesh.buttruyen.com / 62.60.131.43 and
  meshcentral.girydsfsggvb.com / 62.60.135.64; agent payloads from
  agent.afahimsa.top and 193.149.187.81:1287), Atera, Teramind, AnyDesk and
  AdaptixC2 (team server 64.94.85.14:4321/endpoint plus beacon host
  168.100.11.99, both BitLaunch AS399629; agents staged as the fake installer
  clear-thinking_61.92.4_INSTALL.exe on 162.33.178.213:8888 and sthyjk.com:8443,
  the same host that alknene.shop resolves to; listener URIs /update,
  /api/v1/check, /uri.php). Development / tool-staging servers 162.33.179.249,
  193.24.123.162, 193.149.176.50; Nezha dashboard C2 radesashar.com; potential
  scanning infrastructure 193.169.194.21. Exfiltration via Rclone to Wasabi S3
  and MEGA. More than 70,000 exposed credentials (network devices, LDAP dumps)
  were recovered; victims are global (APAC 37.6%, LATAM 31.9%, Europe 15.8%,
  MENA 12.7%), with many FortiGate compromises dated February-June 2026 —
  overlapping the FortiBleed window, yet with "negligible overlap" in compromised
  data versus the FortiBleed set (Group-IB's read: a separate dataset, operator
  subset or related access operation within the broader FortiBleed-related
  activity). Many victims were later listed on the Qilin and The Gentlemen data
  leak sites; the vendors assess an IAB/affiliate role but call any direct
  affiliation unconfirmed, and make no origin claim — hence the Unattributed
  sentinel (cross-reference DB id 111 FortiBleed Credential Harvesting (2026-06)
  and the 2026-10-24 Phantom AI Ransomware Affiliate (INC / The Gentlemen) row;
  do not attribute until a vendor ties the clusters). Sister coverage: The Hacker
  News 2026-10-23 (hackers-breach-enterprise-firewalls-and.html); no sister vendor
  published finer IOC granularity. Hashes (MD5 / SHA-1 / SHA-256, digest-only):
