# Curator YAML — "Stray Cat, Open Doors": k0t edge-device access operation (Group-IB + NyxLab, 2026-10-21)
# Written 2026-10-25 (daily hunt). Primary: Group-IB Threat Intelligence / NyxLab joint blog, published 2026-10-21.
# Discovery vector: The Hacker News news-sitemap entry "Hackers Breach Enterprise Firewalls and VPNs, Exposing Over
# 70,000 Credentials" (2026-10-23) — parsed by rss_discovery.py but NOT matched (no actor alias in title; news-sitemap
# has no summary); found on manual review of the parsed entries. Filter backfilled ("the gentlemen", "k0t").
# ATTRIBUTION: filed under the Unattributed sentinel. k0t (aliases CryptoFeel, Member19, QazWsxShop) is a cybercriminal
# initial-access operator; Group-IB/NyxLab state the relationship to Qilin / The Gentlemen is UNCONFIRMED (victim-overlap
# only) and found "negligible overlap" with the FortiBleed credential set (DB campaign id 111 "FortiBleed Credential
# Harvesting (2026-06)"), calling this "a separate dataset, operator subset, or related access operation within the
# broader FortiBleed-related activity". Neither vendor claims Russian origin. Per the IAB/MaaS discipline the IOCs are
# captured without attribution; re-attribute if the promised in-depth Group-IB report, or another vendor, ties k0t to
# FortiBleed (id 111), to the 2026-10-24 "Phantom AI Ransomware Affiliate (INC / The Gentlemen)" row, or to Qilin.
# Triage (reports/triage/groupib-nyxlab-straycat-k0t-2026-10-25.csv): heuristic defaulted mesh.buttruyen.com,
# sthyjk.com and radesashar.com to compromised_legitimate; OVERRIDDEN to malicious on report + WHOIS evidence —
# mesh.buttruyen.com is the MeshCentral C2 host (apex Namecheap, created 2025-08-29); sthyjk.com (Namecheap,
# created 2026-02-23) resolves to the AdaptixC2 staging host 162.33.178.213 and served the fake installer;
# radesashar.com (Namecheap privacy, created 2025-12-19) is the Nezha dashboard C2. All domains were registered via
# Namecheap per the report; C2 hosting on BitLaunch (AS399629).
# Context-anchor exceptions (lapsed apexes, 2026-10-20 rule): buttruyen.com (expired 2026-08-29, "REACTIVATION PERIOD",
# NXDOMAIN) and girydsfsggvb.com (no WHOIS record, NXDOMAIN) are NOT listed — a future innocent registrant would inherit
# the blocklisting; the attributed child hosts mesh.buttruyen.com / meshcentral.girydsfsggvb.com ARE listed (report
# attributes them as C2; DB lifecycle/decay handles the NXDOMAIN state). afahimsa.top IS listed (registered, Namecheap
# 2025-12-02, failed-WHOIS-verification NS, live). alknene.shop listed per the report (resolves to 162.33.178.213).
# URL notes: report prints URLs with schemes (hxxp/hxxps) — refanged only. The MeshAgent URL contains the literal
# meshid token as printed. The AdaptixC2 team-server URL is https://64.94.85.14:4321/endpoint (default port 4321,
# self-signed "Internet Widgits Pty Ltd" cert; operator-IP-restricted so absent from scan data).
# 193.169.194.21 is labelled "potential scanning infrastructure" by the vendor — weakest IOC in the set; kept because the
# vendor lists it in the IOC table, flagged here for the curator. Not ingested: Namecheap parking IP 198.54.117.242
# (current resolution of afahimsa.top — shared platform), victim credentials/domains (never ingested), legitimate RMM
# brands (MeshCentral, Atera, Teramind, AnyDesk), Wasabi/MEGA exfil clouds (shared platforms), FOFA/ZoomEye/Censys.
# CVE-2019-6693 (default FortiOS AES key used to decrypt harvested configs) is a weakness, not an access vector — noted
# in the description only. Hashes (digest-only; no hash table in the flat-IOC schema): 7 x (MD5 / SHA-1 / SHA-256) sets.
