description: >
  Symantec and Carbon Black Threat Hunter Team (2026-10-01; discovery vector
  BleepingComputer 2026-10-02) document Warlock ransomware intrusions over
  August-September 2026 by the China-nexus group Symantec tracks as Longlegs
  (aka Storm-2603; previously tied to CL-CRI-1040, CamoFei, ChamelGang) against
  at least four organizations in Portuguese- and Spanish-speaking countries
  across Europe, Africa and Latin America: a water utility, a telecommunications
  provider, a regional government body and a university. Initial access via
  on-premises Microsoft SharePoint exploitation (ToolShell chain CVE-2025-49704,
  CVE-2025-49706, CVE-2025-53770, CVE-2025-53771 plus newer SharePoint flaws per
  CISA's July 2026 advisory): a multi-version webshell dropped into the
  SharePoint LAYOUTS directory harvests ASP.NET machine keys to forge signed
  __VIEWSTATE payloads for RCE in the application pool (T1190, T1505.003).
  Detailed July 2026 intrusion against a critical-infrastructure operator:
  recon (net user /domain, whoami, nltest /domain_trusts), DLL side-loading
  pairs (ssvagent.exe/logger.exe + gsdll64.dll.tmp/doexeloc.dll.tmp;
  doexe.exe + doexeloc.dll, T1574.002), Burp-Collaborator-style per-target
  canary beacons to oastify.com subdomains (shared platform, excluded),
  follow-on MSI payloads fetched via msiexec from catbox.moe and Wasabi S3
  (URLs below, T1218.007), masqueraded admin account SPSEPRDSetup added to
  local Administrators on multiple hosts, covert remote access via Visual
  Studio Code Insiders tunnel installed as a service (code-insiders.exe tunnel
  service install, T1219), the NetExec framework, nxc.exe, for AD enumeration / credential
  spraying / remote execution, then an AV/EDR killer (a.exe) pushed to 40+
  hosts in ~2 hours via net use + copy from an internal share - in other recent
  attacks using the signed vulnerable K7RKScan driver, CVE-2025-1055 (BYOVD,
  T1562.001) - and finally Warlock binaries run.exe / rune.exe staged in the
  domain SYSVOL scripts share and delivered to 33+ hosts by ordinary DFSR
  SYSVOL replication (dfsrs.exe parent), ransom note "how to restore your
  files.txt" (T1486). Attribution note: Microsoft attributes ToolShell-era
  activity to Storm-2603 alongside Linen/Violet Typhoon; Symantec attributes
  Warlock development to Longlegs = Storm-2603 - consistent, no divergence.
  China-nexus, tracked by this project as in-scope ransomware operation.
