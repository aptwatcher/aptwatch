# (aliases Water Manaul, Storm-2603). Symantec's name "Longlegs" and prior
# clusters CL-CRI-1040 / CamoFei / ChamelGang are recorded here but NOT added as
# apt_groups entries to avoid alias collisions - flag for manual alias review.
# Shared-platform rule: litter.catbox.moe (public file-sharing) and
# s3.wasabisys.com / oastify.com (Burp Collaborator) apexes are deliberately
# excluded from domains; only the attacker-specific bucket host
# xn8xyt-drop.s3.wasabisys.com and the path-precise delivery URLs are listed.
# URL schemes are as printed by Symantec (msiexec https:// commands).
# CVE-2025-53770 is already in the DB (context anchor, duplicate expected).
