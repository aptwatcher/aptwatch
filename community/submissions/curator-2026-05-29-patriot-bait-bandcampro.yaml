description: >
  TrendAI Research published May 2026 a five-year retrospective on a solo
  Russian-speaking threat actor (tracked as 'bandcampro' after his Telegram
  handle) who operated a MAGA-themed Telegram channel (@americanpatriotus,
  ~17,000 subscribers) since 2021 and pivoted to AI-automated content,
  cryptocurrency fraud, and credential theft starting September 2025. The
  actor used a jailbroken/abliterated Google Gemini 2.5 Flash model (via
  rotating 73 likely-stolen Gemini API keys) as an operational co-pilot to
  generate Q-style posts, deploy infrastructure, debug pipelines, model
  victim password mutations, and run a QAnon-themed AI chatbot
  (@QFS_Terminal_Bot, previously @PatriotTruthAI_bot). Trend Micro's
  attribution is anchored on (a) Russian-speaker linguistic evidence in
  the actor's prompts to Gemini (the actor relied on the LLM to translate
  Q-jargon into idiomatic American English to avoid Russian phrasing
  giveaways), (b) commercial-RAT abuse pattern matching Russian-speaking
  ecosystem TTPs (specifically GoToResolve repackaging, same technique
  documented in LockBit and Akira intrusions), and (c) operator-Telegram
  handle @bandcampro (user ID 6329112928) cross-referenced to Russian-
  forum activity per Trend Micro analysis. Trend Micro classifies this as
  an information operation in form but fraud-motivated in substance.

  Scope note for APT Watch: This curator submission is filed under the
  project's "ransomware/crime crews adjacent" scope branch (added 2026-05-26
  to incorporate Russian-speaking MaaS-platform operators and similar
  Russian-ecosystem cybercrime actors with material public reporting).
  bandcampro is NOT a MaaS-platform operator; he is a solo crime actor.
  The decision to ingest rests on (1) Trend Micro PRIMARY plus sister-
  source corroboration from Security Boulevard, Cybersecurity News, HEAL
  Security, Cryptika, gblock.app, Let's Data Science, teamwin.in - all
  dated 2026-05-22 to 2026-05-26 and citing the same Trend Micro primary,
  (2) Per-infrastructure malicious signal documented in the Trend Micro
  IOC list: bank-impersonation phishing apexes (dzbank[.]capital
  impersonating DZ Bank AG, bpfi[.]digital impersonating the Banking &
  Payments Federation Ireland with documented credential-harvesting
  portal subdomains), cryptocurrency-exchange impersonation fraud apex
  (induspayments[.]com / indusx[.]tech impersonating INDUS.exchange),
  GCP-customer attacker-controlled VPS (213.165.51[.]115 primary VPS
  running QBOT, 34.34.57[.]141 SOCKS5 ghost proxy, 34.34.81[.]129
  Windows RDP C2, 35.192.41[.]201 Mailpit temp-mail server), and
  StellarMonSetup.exe (SHA256
  981036cec38c6fd9796fc64a102100b97983f56b3482cc3e1f1610e14a1fae58 -
  logged in description only, schema has no hash table) which is a
  trojanized GoToResolve installer distributed via Telegram as a fake
  "freedom-first self-custody wallet" called StellarMonster offering up
  to 1,000 XLM bonus. (3') Russian-speaking ecosystem confirmed by
  Trend Micro plus the documented use of LockBit/Akira-style commercial-
  RAT abuse. Three-pillar bar is borderline cleared on the project's
  Spirit of the Law rather than Letter of the Law - flagged in the
  digest as a borderline scope case for manual review at the curator's
  discretion.

  Operational results documented in the Trend Micro primary: 29 WordPress
  administrator accounts compromised (across weapons retailers, legal
  offices, medical practices, and small commercial sites) via AI-assisted
  brute-force on Gemini-modelled password mutations, at least one company
  fully infiltrated via a StellarMonSetup.exe install on an employee
  workstation, and at least one victim's cryptocurrency wallet emptied
  after subscribers typed seed phrases into the trojanized "import your
  wallet" screen. The campaign demonstrates - per Trend Micro's framing -
  that AI scales solo cybercrime operations but does not necessarily
  guarantee large-scale success.

  GCP attacker-VM note: 34.34.57[.]141, 34.34.81[.]129, and 35.192.41[.]201
  are Google Cloud Platform customer-VM addresses (europe-west4-a region
  per Trend Micro). These IPs have high lifecycle churn (a destroyed VM
  releases its public IP back to the GCP pool for reassignment to a new
  unrelated GCP customer). They are listed here for forensic-trail value;
  blocklist consumers should age these aggressively (project loader will
  decay-multiplier them per the lifecycle pipeline). 213.165.51[.]115 is
  a regular VPS (likely Hetzner per Trend Micro context) with longer
  expected lifecycle.

  Telegram artifacts logged in description only (curator schema has no
  Telegram-handle field): @americanpatriotus (channel ID 1482211747, primary
  IO broadcast channel), @QFS_Terminal_Bot (QAnon AI chatbot), @PatriotTruthAI_bot
  (earlier bot name), @patriotstats_bot (admin control bot for content machine),
  @bandcampro (user ID 6329112928, threat actor admin), @Whiplash347 (popular
  crypto fraud channel cited in the primary). Operator email organizer for
  ancillary infrastructure noted in Trend Micro primary as a Mailpit catch-all
  service at 35.192.41[.]201 and via catchall1.tralalarkefe[.]com subdomain
  (listed in domains below).

  Per the project's delta-vs-context discipline: all four IPs are
  attacker-controlled per primary. All thirteen domains are attacker-
  registered impersonation or operational infrastructure (NOT compromised
  legitimate sites - DZ Bank's real domain is dzbank.com, BPFI's real
  domain is bpfi.ie, and INDUS.exchange's real apex is induspayments.com's
  legitimate fork; bandcampro's induspayments[.]com is the offline fraud
  fork). Therefore all domains go under domains: (loader maps to
  domain_type=malicious). No legitimate apex is being burned - bandcampro
  registered fresh apexes in his preferred TLDs (.capital, .digital,
  .tech) to bypass typical bank-anti-phishing brand-monitoring on the
  legitimate gTLDs.

  Note on prior DB state: a query against the project's local DB cache
  surfaced www.bandcam.site at domain_type=malicious with no actor
  attribution. That entry is NOT in Trend Micro's published IOC list and
  may be a stale collector artifact unrelated to bandcampro - flagged in
  the digest for manual triage rather than auto-attributed here.

  Discovery vector for this curator YAML: the daily APT Watch threat
  hunt scheduled task (apt-threat-hunting, 2026-05-29), via The Register
  RSS surfacing the Trend Micro primary report through Security
  Boulevard and Cybersecurity News re-coverage on 2026-05-22.

