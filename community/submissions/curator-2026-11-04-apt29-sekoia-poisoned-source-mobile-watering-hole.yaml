description: >
  Large-scale watering-hole campaign uncovered by Sekoia TDR in mid-October 2026 and attributed with
  moderate-to-high confidence to APT29 (SVR; Midnight Blizzard / Cozy Bear / The Dukes). Proposed as a
  sub-campaign of "APT29 / Cozy Bear" (parent_campaign_id 7). Three infection vectors deliver the same
  injected JavaScript: (1) direct template/library injection on compromised legitimate sites in the US,
  Ukraine, Czech Republic and Bulgaria (a Ukrainian gas producer, a US chemical-industry trade
  association, a Bulgarian military-related site, a Czech far-right party); (2) Adversary-in-the-Middle
  reverse-proxy lookalikes america250.holiday (clone of america250.org, the US 250th-anniversary site)
  and theowo.club (clone of Raffles London at The OWO, next to the UK MoD / Downing Street) that patch
  HTML on the fly; (3) a one-week supply-chain compromise (2026-08-27 to 09-03) of the Ukrainian
  web-analytics tracker a.plerdy.com, whose main.js is loaded by thousands of mostly Ukrainian sites
  including army, special-forces and UAV/ballistics vendors. The loader fetches the
  "UltimateFingerprinter" profiling script (394 fields / 61 checks) from static.flux-telemetry.com or,
  via the edge-ord.clouds-stacks.com load balancer, from ads-it-assets.com / cdn.adv-static.com /
  wpvortex-mod.com / assets-int.com; the delivery host then serves a platform-specific n-day chain
  with no user interaction and no persistence. Class A (iOS 16.7): DarkSword CVE-2025-43529 +
  CVE-2024-27834 PAC bypass, Safari cookie theft. Class B (iOS 18.5): CVE-2025-43529, CVE-2026-20700,
  CVE-2025-14174, CVE-2025-43510, CVE-2025-43520 - full device exfiltration (WhatsApp/Telegram DBs,
  Keychain, location, Health, photos, iCloud Drive). Class C (Chrome for Android 139-145 except 143):
  CVE-2026-3910 + CVE-2025-27038, then the native "AndroSnitch" harvester for Chrome cookies, login
  data, history and WifiConfigStore.xml Wi-Fi passwords. All classes exfiltrate by HTTPS POST to
  ad.starx-net.com:8881/telemetry/v12. DarkSword is a suspected commercial-surveillance-vendor iOS
  kit (Google tracks its watering-hole distributor as UNC6353); Google TAG confirmed to Sekoia the
  framework matches APT29's 2024 Mongolian-government watering holes. Sister coverage:
  BleepingComputer 2026-11-04 (discovery vector, no additional IOCs); cside 2026-03 and Lookout
  2026-03 DarkSword kit analyses (older, no overlapping infrastructure). Ownership triage with
  curator overrides documented in the YAML header; plerdy.com / a.plerdy.com filed as
  compromised_legitimate. MITRE: T1189 Drive-by Compromise, T1195.002 Supply Chain Compromise,
  T1557 Adversary-in-the-Middle, T1203 Exploitation for Client Execution, T1539 Steal Web Session
  Cookie, T1555 Credentials from Password Stores, T1041 Exfiltration Over C2 Channel.

