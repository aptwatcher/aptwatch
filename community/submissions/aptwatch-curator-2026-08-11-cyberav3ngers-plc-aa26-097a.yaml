author: APTWatch Curator

source: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a
source_name: Joint CSA AA26-097A - Iranian-Affiliated Cyber Actors Exploit PLCs (July 22, 2026 update)

apt_groups:
  - CyberAv3ngers

description: >
  IP indicators from joint Cybersecurity Advisory AA26-097A (FBI/CISA/NSA/EPA/
  DOE/CNMF/Treasury, originally published 2026-04-07, updated 2026-07-22).
  Iranian-affiliated APT actors (industry tracking: CyberAv3ngers, Shahid Kaveh
  Group, Storm-0784, BAUXITE, Hydro Kitten, UNC5691) target internet-exposed
  PLCs (Rockwell CompactLogix/Micro850, Schneider BMX P34/Modicon M340,
  Siemens S7-1200) across US Water and Wastewater, Energy, and Government
  sectors. TTPs: access via legitimate vendor engineering software from leased
  hosting infrastructure (T0883), OT ports 44818/2222/102/502 and modems on 22
  (T0885), Dropbear SSH persistence (T1219), project file exfiltration (T1041),
  ladder logic and HMI/SCADA data manipulation including disabled shutdown and
  alarm logic (T1565). Context: FBI/EPA PSA of 2026-07-30 reports related
  MicroLogix 1100/1400 incidents in at least seven states since 2026-07-27.
  Actor-association windows per IP: 185.82.73.162-.171 (Jan 2025 - Mar 2026),
  135.136.1.133 (Mar 2026), 185.82.73.175 (Sep 2025 - Feb 2026),
  141.11.164.153 (Jan - Jul 2026), 175.110.121.39/.41/.42/.107 (Feb - Mar
  2026), 192.142.54.79 and 84.200.205.165 (May - Jun 2026), 185.225.17.225
  (Jun - Jul 2026), 79.133.46.209 and 88.80.150.199/.200/.202 (Jul 2026).
  CISA recommends vetting these IPs and querying historical logs before
  blocking. No file hashes published in this advisory.

