description: >
  Four attacker-registered Microsoft-365-impersonation domains, three attacker
  IPs and one shared registrant email tied to a hospitality-sector Wi-Fi DNS
  poisoning campaign documented by ReliaQuest Threat Research (2026-07-23).
  Threat actors compromised captive-portal Wi-Fi gateways at hotels and
  conference centers (US cities + India + Saudi Arabia; ongoing since >= June
  2026) and used gateway-level DNS response forgery to silently redirect every
  connecting guest to attacker-controlled Microsoft-365 credential-harvesting /
  AiTM pages — no phishing email or endpoint compromise required. Secondary
  activity: WPAD/PAC abuse (~1/3 of cases) and abuse of Microsoft's device-code
  authentication flow (directly observed on ms365-live.com; operator cloaking
  panel observed on ms365-device.com 2026-07-23) to obtain MFA-satisfied OAuth
  tokens. ATTRIBUTION IS LOW-TO-MEDIUM CONFIDENCE: ReliaQuest assesses TTP
  overlap with the APT28 (Fancy Bear / Forest Blizzard, GRU) "FrostArmada"
  SOHO-router DNS-hijack campaign but explicitly does NOT directly attribute
  this to APT28 — attacker infrastructure and domain registrations do NOT match
  prior APT28 infra, and it is "not currently assessed to be FrostArmada
  itself." apt_groups[0] maps to the closest existing tracked cluster (DB
  campaign #99 "Storm-2754 / FrostArmada (APT28 SOHO DNS hijack)") purely to
  keep the IOCs discoverable under the right operator lineage; on import decide
  whether to split into a distinct hospitality-captive-portal child campaign.
  Discovery vector / sister coverage: BleepingComputer "Hackers hijack hotel
  Wi-Fi DNS to steal Microsoft 365 accounts"
  (https://www.bleepingcomputer.com/news/security/hackers-hijack-hotel-wi-fi-dns-to-steal-microsoft-365-accounts/,
  2026-07-24); Security Affairs
  (https://securityaffairs.com/196017/security/hackers-hijack-hotel-wi-fi-to-steal-microsoft-365-credentials.html,
  2026-07-26). All 8 IOCs NEW to apt-intel (local cache + live API both 0
  matches).

