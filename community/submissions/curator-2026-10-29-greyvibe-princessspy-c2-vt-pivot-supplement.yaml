author: APTWatch Curator
source: https://www.virustotal.com/gui/file/464cac4a93c43a36c83499efe349a0971372bd9a0d90ef5786943277cc864bb3/relations
source_name: "VirusTotal pivot on ESET APT Activity Report Q2–Q3 2026 PrincessSpy domains (2026-10-29) + urlscan.io"

apt_groups:
  - GREYVIBE

description: >
  Supplement to the 2026-10-29 GREYVIBE / PhantomCaptcha PrincessSpy YAML. Pivoting
  the four ESET-published ab3army lookalike domains through VirusTotal surfaced two
  PrincessSpy Android samples (ESET Android/Spy.PrincessSpy.A) tied to them, and the
  sandbox run of 464cac4a…64bb3 ("ab3test.apk", distributed from ab3army.info /
  ab3army.com) exfiltrates victim images and documents by HTTP POST to
  http://103.112.68.246:5000/upload. The server is a dedicated Debian VPS running a
  Python Uvicorn service on TCP/5000 (plus SSH) in the Retzor, Inc. block
  103.112.68.0/23 (AS215305 Mastersoft S.R.L., registered 2026-04-14, admin contact
  in Moscow via the Russian hoster DataCheap) — the same Uvicorn-on-a-nonstandard-
  port C2 pattern Team Cymru fingerprinted for GREYVIBE's LegionRelay C2s. The APK
  download URL http://ab3army.com/wp-content/uploads/ab3test.apk is corroborated by
  two public urlscan.io tasks (2026-10-18) and by the VT sample name. Discovery
  vector: manual VT/urlscan enrichment of the ESET primary; no vendor has yet
  published the C2. IOC set: 1 C2/exfil IPv4, 1 path-precise exfil URL, 1 APK
  download URL, 1 context-anchor apex (ab3army.com, already in the primary YAML).
  MITRE: T1437.001 (Application Layer Protocol: Web), T1646 (Exfiltration Over C2
  Channel), T1533, T1430, T1583.004 (Acquire Infrastructure: Server).

