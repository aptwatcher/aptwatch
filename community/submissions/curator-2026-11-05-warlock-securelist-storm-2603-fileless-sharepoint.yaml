author: aptwatch_curator
source: https://securelist.com/storm-2603-fileless-toolshell-attack/121467/
source_name: "Kaspersky Securelist — The SOC Files 5: Ghost in the pipeline, or a fileless SharePoint breach by Storm-2603 (2026-11-05)"

apt_groups:
  - Warlock Ransomware Infrastructure

description: >
  Kaspersky GERT/SOC retrospective (Securelist, 2026-11-05) of a December 2025 intrusion attributed
  with moderate confidence to Storm-2603 (Warlock; aka Water Manaul, GOLD SALEM, Symantec Longlegs).
  Dec 20: ToolShell (CVE-2025-53770) vulnerability fingerprinting from ONYPHE scanner infrastructure,
  followed 12 minutes later by recon from Pfcloud UG bulletproof hosting; Dec 21-23 deliberate
  silence; Dec 24 (Christmas Eve) full RCE chain through the IIS worker process from Safing Privacy
  Network relay 45.91.94.204. The webshell ("vskp2") was never written to disk: it registered a
  custom ASP.NET VirtualPathProvider inside w3wp.exe (fileless runtime implant, T1505.003 /
  T1190), filtered attacker requests via GetCacheKey(), and offered command execution, token
  impersonation, a minimal hand-built MSRPC client (Rpcrt4 stub spoofing) for coercion, and TCP
  pivoting through the SharePoint host. Post-exploitation: msiexec install of a vulnerable
  Velociraptor 0.73.4.0 MSI (CVE-2025-6264) from an attacker Supabase bucket with C2 at
  auth.qgtxtebl.workers.dev (same Velociraptor abuse Talos tied to Storm-2603 in Oct 2025);
  redundant tunnels via Zoho Assist unattended agent (catbox.moe MSI), VS Code / VS Code Insiders
  CLI tunnels, Cloudflare Tunnel and a lightweight reverse proxy (T1219, T1572); C2 on
  bulletproof-hosted 91.224.92.121 and 204.76.203.219, relayed through a Fastly edge (excluded
  here as shared CDN); BYOVD EDR-killing with rsndispot.sys plus the Warlock AV-killer DLL
  (T1562.001, T1574.002); Warlock ransomware launch blocked by Kaspersky Proactive Defense
  (T1486). Detection guidance: Microsoft.GeneratedCode / App_Web_toolpane.aspx* loader events,
  ObjectDataProvider / ExpandedWrapper / LosFormatter strings, and IIS-Configuration ETW events
  25/47 present without 17/18/19/21 for the same virtual path (VPP-backed path with no on-disk
  file). The two SPN relay IPs are anonymization infrastructure (shared), kept because the vendor
  lists them as IOCs. Shared-platform apexes supabase.co, workers.dev and catbox.moe are
  deliberately excluded; only attacker-specific hosts and path-precise URLs are listed. MD5 hashes
  recorded in the YAML header. No sister-vendor IOC enrichment found within the window (OTX pulse
  for this report only mirrors the Securelist table).

ipv4:
  - 91.224.92.121
  - 204.76.203.219
  - 45.91.94.204
  - 49.51.132.100

domains:
  - vdfccjpnedujhrzscjtq.supabase.co
  - auth.qgtxtebl.workers.dev

urls:
