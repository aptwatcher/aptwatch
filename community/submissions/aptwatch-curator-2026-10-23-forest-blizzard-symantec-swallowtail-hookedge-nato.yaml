  VBA, seen under GUID filenames cf25f91c-..., 01d6a811-..., 4ef62d6a-... which match Recorded
  Future webhook UUIDs — same generic launcher reused across the campaign; OTX 5 pulses tagged
  apt28/hookedge/swallowtail; APTWatch hash lookup 0 results, query_id qry_01M5MFYYHCHQ4PHHS4J1WG17AS).
  ld.exe reflective loader — f1cc91e7427a22027f65d31bbee19c54b602d08d7d93e4745b9cea59fa8132ff
  (APTWatch 0 results). Microsoft Defender detections named in the related Defender TA report:
  Trojan:Win32/Sulunch, Trojan:Win32/Ravartar, TrojanDownloader:O97M/DownloadExec.

  Deduplication / refresh notes: APTWatch batch lookup qry_01M5MFZ7ADDYM6K7WA2XGJE669 (2026-10-23)
  shows that 185.82.218.119 and all five Symantec webhook.site URLs are ALREADY attributed in the
  APTWatch database to actor "APT28 HOOKEDGE / Operation MacroMaze" with first_seen 2026-10-20
  (confidence high, evidence osint_attribution), although they are not yet present in the
  repository iocs/ipv4.txt and iocs/urls.txt snapshot of 2026-10-19 — they are therefore kept in
  the lists below so the repository catches up, and the maintainer should merge rather than
  double-insert. The 30 webhook.site URLs from the Recorded Future appendix and the 10 from Lab52
  are likewise already in the database under the same actor (first_seen 2026-08-31, batch
  qry_01M5MG0EVCGHBZQFSVWS957BDG) and are intentionally omitted here; refresh their last_seen to
  2026-08-27 (Recorded Future publication). Curator suggestions: (1) link or merge the
  "APT28 HOOKEDGE / Operation MacroMaze" campaign actor with the canonical Forest Blizzard / APT28
  actor so alias lookups resolve; (2) add "Swallowtail" to the Forest Blizzard alias list;
  (3) extend last_seen of 185.82.218.119 to 2026-07-31 (last operator tasking) with lifecycle
  active given the 2026-09-24 launcher sighting.

