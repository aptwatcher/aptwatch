  Intelligence Feed pull of 2026-10-30 (location eq 'Ukraine'); UAC-0099 / Earth Sirrush is absent from the APT Watch
  watchlist and only present in the online database as the ad-hoc actor "UAC-0099 MATCHBOIL Family (Gamaredon-coop)";
  proposed: promote to a curated actor with aliases Earth Sirrush, SHADOW-EARTH-065, UAC-0099, category russia_aligned.
