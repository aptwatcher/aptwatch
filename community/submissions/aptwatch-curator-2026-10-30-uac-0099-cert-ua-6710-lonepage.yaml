description: >
  UAC-0099 (CERT-UA designation; Trend Threat Intelligence Feed intrusion-set "Earth Sirrush", previously
  SHADOW-EARTH-065) cyber-espionage against Ukrainian state organizations and media representatives, 2022 to June 2023,
  documented by CERT-UA in advisory CERT-UA#6710 (published 2023-06-26) and mirrored in the Trend feed as
  "UAC-0099: cyberespionage against state organizations and media representatives of Ukraine (CERT-UA#6710)" (labels
  location:Ukraine, industry:Defence, Government/Public Services, Transportation; campaign "Earth Sirrush: A Russia-Aligned
  Intrusion Set With 4 Years of Evolving Espionage Tooling"). Attribution: CERT-UA UAC-0099; Trend assesses with high
  confidence that the 2022-2026 campaigns belong to one Russia-aligned intrusion set (Earth Sirrush), and ESET has
  separately assessed that UAC-0099 may run initial-access operations for Sandworm (APT44). Victimology: dozens of
  computers in Ukrainian state bodies and media outlets, remote access held for months. TTPs in prose: spear-phishing
  with "summons" (Povistka) lures delivered as LNK/HTA inside archives (T1566.001, T1204.002); PowerShell one-liners
  writing base64 payloads to disk and registering VBS beacons through schtasks (T1059.001, T1053.005); LonePage VBS
  beacons polling the C2 on high non-standard ports for upgrade.txt tasking and uploading results (T1071.001, T1041);
  ThumbChop, ClogFlag (keylogger), SeaGlow (reverse SSH, "-s 62.210.204.94") and OverJam (Go reverse proxy) tooling
  (T1056.001, T1572); internal port scanning with Test-NetConnection over 192.168.88.0/24 (T1046); .ssh and ProgramData
  ssh directories hidden with attrib (T1564.001). Infrastructure roles: 217.12.218.107 (ports 25928/30139, LonePage
  tasking and upload), 156.38.245.115 (ports 80/38104), 45.148.121.6 (port 32341, slideshow.bat/.php), 62.210.204.94
  (SeaGlow SSH endpoint) and 179.48.251.182 - all five IPs are already in the database and are excluded from the
  lists (refresh last_seen to 2023-06-26); the seven URLs below are the exact tasking and payload paths from the
  advisory and were absent from the database. SHA-256 file indicators published by CERT-UA, no hash field in this
  schema, recorded here for the curator: 8f2a5eeac887a4a9acb30b25c9d2bf4405c6d0c0207ebd7886e95988c93a8a5a (wininit.exe
