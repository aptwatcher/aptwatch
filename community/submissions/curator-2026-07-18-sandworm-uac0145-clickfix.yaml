# =============================================================
#  Curator submission — Sandworm / UAC-0145 ClickFix + typosquat C2
#  Author: aptwatch-curator  |  Date: 2026-07-18
# =============================================================
#  AUDIT-TRAIL / CAMPAIGN-SOURCE RECORD.
#
#  Trigger: CERT-UA advisory #6318437 (2026-07-16), "Primary
#  compromise vectors used by UAC-0145 as of July 2026", surfaced
#  via SOC Prime sister analysis (2026-07-16 14:05 UTC) during the
#  RSS/search leg. CERT-UA maps UAC-0145 to Sandworm / APT44.
#
#  Attribution / campaign mapping (curator): UAC-0145 == Sandworm
#  (GRU Unit 74455 / APT44 / Seashell Blizzard). apt_groups[0] is
#  set to the EXACT existing DB campaign_name "Sandworm" (campaigns
#  id 6, aliases incl. APT44, Seashell Blizzard, Voodoo Bear,
#  Telebots, UAC-0002) so resolve_campaign() matches — no duplicate
#  campaign creation. UAC-0145 is the CERT-UA designation for this
#  cluster and is carried as an alias in apt_groups[] below.
#
#  Ingested IOCs = 3 attacker-registered typosquat/fake-update
#  domains named as C2 / ClickFix delivery infrastructure:
#    * office366.com     — Microsoft/Office365 typosquat (ClickFix
#                          C2, named in SOC Prime simulation).
#    * offlce366.com     — Office365 typosquat, l-for-i homoglyph
#                          (SOC Prime detection-rule title).
#    * 365softupdate.com — fake "Microsoft 365 update" domain
#                          (SOC Prime detection-rule title).
#  All three are NEW to apt-intel (local RO DB: 0 matches; live
#  Intel API batch_lookup: 0 matches) — genuine delta, plus fresh
#  Sandworm/UAC-0145 attribution + ClickFix campaign linkage.
#
#  SCOPE / EXCLUSION DECISIONS:
#    * ClickFix delivery ran through 10+ COMPROMISED legitimate
#      sites (per CERT-UA / The Record). CERT-UA did NOT publicly
#      enumerate those hosts, so none are recorded here rather than
#      fabricated — nothing goes under compromised_domains:.
#    * cloaking.house — legitimate 3rd-party cloaking SaaS abused
#      by the actor. Shared-platform apex: deliberately EXCLUDED
#      (blocklisting would burn a whole service). Noted in prose.
#    * SMARTAXE resolves C2 via Ethereum smart contracts (dynamic
#      domain resolution) — no static apex to ingest.
#    * Malware families GHETTOVIBE (VBS persistence) and SCOUTCURL
#      (PowerShell recon/exfil) carry hashes, but the flat-IOC
#      schema has no hash table — recorded in the digest only.
#    * Lateral movement over OpenSSH/TOR on ports 445/3389/22 and
#      rsync/Dropbox-API exfil are TTPs, not IOCs.
#  Ownership triage: manual (report attribution language) — all 3
#  domains attacker-registered typosquats -> domain_type=malicious.
#  Verdict CSV: reports/triage/certua-uac0145-2026-07-18.csv.

author: aptwatch-curator

source: https://cert.gov.ua/article/6318437
source_name: CERT-UA #6318437 — Primary compromise vectors used by UAC-0145 (Sandworm) as of July 2026 (2026-07-16)

apt_groups:
  - Sandworm
  - APT44
  - Seashell Blizzard
  - UAC-0145

description: >
  Three attacker-registered typosquat / fake-update domains attributed to
  Sandworm (GRU / APT44 / Seashell Blizzard, tracked by CERT-UA as UAC-0145)
  per CERT-UA advisory #6318437 (2026-07-16). The advisory documents a shift
  from torrent-delivered trojanized software toward direct social engineering
  (Signal lures) and a ClickFix-style fake-CAPTCHA vector that tricks users
  into pasting malicious PowerShell. Custom malware GHETTOVIBE (VBS Startup
  persistence) and SCOUTCURL (PowerShell system/browser recon + exfil) are
  deployed alongside legitimate OpenSSH and TOR for port-forwarding/lateral
  movement (ports 445/3389/22), with exfiltration over rsync / Dropbox API.
  Web-redirection abused the legitimate Cloaking.House service and the SMARTAXE
  implant, which uses Ethereum smart contracts for dynamic C2 domain resolution.
  Discovery vector / sister coverage: SOC Prime "UAC-0145 Uses Torrents, Signal,
  and ClickFix for Access" (https://socprime.com/active-threats/primary-compromise-vectors-used-by-uac-0145-as-of-july-2026/,
  2026-07-16); The Record "Sandworm hackers have a CAPTCHA trick for Ukrainians"
  (https://therecord.media/ukraine-sandworm-hacks-captcha-powershell). SCOPE:
  only the 3 attacker-owned domains are ingested (office366.com, offlce366.com,
  365softupdate.com), all NEW to the DB. The 10+ ClickFix-hijacked legitimate
  sites are not publicly enumerated by CERT-UA (none recorded, not fabricated);
  cloaking.house is a shared-platform SaaS deliberately NOT blocklisted; SMARTAXE
  smart-contract-resolved C2 has no static apex; GHETTOVIBE/SCOUTCURL hashes are
  recorded in the digest only (no hash table in the flat-IOC schema).

domains:
  - office366.com
  - offlce366.com
  - 365softupdate.com
