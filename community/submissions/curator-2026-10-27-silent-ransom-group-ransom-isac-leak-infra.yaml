# Curator YAML — Silent Ransom Group (Luna Moth / UNC3753): operational infrastructure from the "Luna Moth Files" leak
# (Ransom-ISAC Research Team, "Silent Ransom Group - Leak Analysis", published 2026-10-26, Appendix A IOC registry).
# Written 2026-10-27 (daily hunt). Discovery vector: WebSearch ransomware leg (ransom-isac.org); The Record / BleepingComputer
# / THN RSS entries of the 48 h window did not carry the story. Sister coverage of the SAME leak: Check Point blog 2026-10-09
# ("How Luna Moth Runs Data Extortion Like a Business"), Infosecurity Magazine 2026-10-12, Reuters/Chainalysis 2026-10-07 —
# none of them published network IOCs; Ransom-ISAC is the sole source of the host/domain/email registry (finer granularity).
# SUPPLEMENT to curator-2026-05-28-silent-ransom-group-fbi-flash.yaml (imported; DB campaign id 95 "Silent Ransom Group",
# aliases Luna Moth / Chatty Spider / UNC3753). apt_groups[0] matches that campaign_name exactly. New alias proposal for the
# row (NOT added here, curator-level change): "Sleepless Threat" — the group's September-2026 rebrand per the leaked chats.
# PROVENANCE CAVEAT: the IOCs come from a leaked chat export (5,692 Rocket.Chat messages, Aug 2025 – Sep 2026) whose
# authenticity nobody has formally verified (Check Point, Reuters). Ransom-ISAC states every indicator was "verified against
# the source data" and the registrant/WHOIS evidence gathered for this YAML (below) is consistent with the chat timeline.
# Keep the FBI FLASH (2026-05-26) as the attribution anchor; this file adds infrastructure only.
# DEDUP: live Intel API degraded at run time (IP lookups HTTP 500; domain lookup returned 0 for business-data-leaks.com
# although the mirror holds it at curator 1.0) → dedup done against the local mirror (snapshot 2026-10-05, STALE). All
# values below are absent from the mirror and from the git history of community/submissions/.
