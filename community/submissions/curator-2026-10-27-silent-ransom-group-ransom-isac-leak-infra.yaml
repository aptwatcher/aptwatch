description: >
  Ransom-ISAC (research team incl. Jon DiMaggio, Valéry Rieß-Marchive; published
  2026-10-26) analysed four operational files leaked on 2026-10-03 from the
  Russian-speaking extortion crew Silent Ransom Group (SRG / Luna Moth / Chatty
  Spider / UNC3753; DB campaign id 95, FBI FLASH 2026-05-26 anchor): a Rocket.Chat
  export of 5,692 messages across 36 rooms from two self-hosted servers
  (aim6umein3kee.com, Aug 2025 – Sep 2026; slplsskdj2836v2jjsx.com, Sep 2026
  "Sleepless Threat" rebrand), a vishing call script, a fake-employee resume and a
  naval-base target list. Seven human operators ran six activity lines: law-firm
  data extortion (27 paid victims logged), vishing for initial access via a
  self-hosted 3CX PBX (87.251.67.222 / .223), AnyDesk / Zoho Assist deployment,
  purchased VPN credentials, physical infiltration with field agents posing as IT
  or HVAC contractors (cover domain newyorkhvacinc.com), fake remote IT-helpdesk
  hires at defense contractors (DPRK-IT-worker playbook), and HUMINT targeting of
  submarine personnel. Exfiltration to four consumer Google Drive accounts (all
  with recovery addresses on the attacker domain myrecovery.casa) and Yandex Disk;
  negotiation over SimpleX and ProtonMail; disinformation via the fake breach-news
  site sdfmskfd.com; pretext identities on sokolovsky-law.com (fake law firm),
  ominetdata.com (clone of evaboot.com), develevenor.com and
  thesiliconemasters.com. Work servers: 45.32.232.133 ("SLEEPLESS RDP WORK",
  port 2895), 199.217.98.21 and 216.203.20.157 (leased). Sister coverage of the
  same leak without network IOCs: Check Point 2026-10-09
  (blog.checkpoint.com/security/how-luna-moth-runs-data-extortion-like-a-business/),
  Infosecurity Magazine 2026-10-12, Reuters / Chainalysis 2026-10-07. Leak
  authenticity is unverified by third parties; registration data gathered for
  this file (Namecheap / WebNic creation dates aligned with the chat timeline)
  is consistent with it. ATT&CK per the vendor: T1598, T1593, T1585, T1583,
  T1566.004, T1078, T1219, T1005, T1567.002, T1657, T1591.004, T1588.002, T1200,
  T1597. Not ingested: .onion leak site, Telegram/SimpleX handles, 52 BTC wallets,
  victim emails, redacted impersonation domains, funconnect.com (RDAP contradicts
  the report), unregistered ThreatActorsNeverSleep.com, Sedo-parked sleepless.co.
  Hashes (digest-only): chat_export_full.json.gz
