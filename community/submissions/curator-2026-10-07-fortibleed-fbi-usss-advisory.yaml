# Curator submission — FortiBleed joint FBI/USSS advisory (JCSA-20261006-01)
#
# FBI + US Secret Service joint cybersecurity advisory published 2026-10-06
# (TLP:CLEAR) on the ongoing FortiBleed credential-compromise campaign against
# internet-facing FortiGate firewalls / SSL VPN gateways (86,644+ compromised
# devices across 194 countries per SOCRadar). Victims report lockouts: actors
# create rogue admin accounts, delete legitimate ones (T1531), and sell access
# as IABs to INC/Lynx and Payload ransomware affiliates.
#
# Consolidation: advisory IOCs (C2 / proxy / relay / Hashtopolis + Table 1
# brute-force/authenticated IPs) merged with the CloudSEK open-directory
# analysis IPs that the advisory itself cites — 6 CloudSEK IPs were never
# ingested when campaign 111 was created (sister-vendor sweep gap, closed here).
#
# Deliberate exclusions:
#   - 104.28.155.27 (advisory Table 1): Cloudflare anycast range — shared-
#     platform exclusion; blocklisting would affect legitimate Cloudflare
#     WARP/proxy traffic. Logged in digest only.
#   - 85.11.187.8 (Hashtopolis host): already in DB at curator 1.0 under this
#     campaign, stand-alone, no new attribution — pure-duplicate skip.
#
# Rogue account names (adminin, fortiAdmin, forticloud-sync, fgtsecure, pakedge,
# districtadmin, gttadmin, itadmin, adminsslvpn, IT_Manager, my_admin,
# support_fortinet, fgtsec, forti_support2, forticloud-tech, roadmin,
# Technical_support, system_config...) have no field in the flat-IOC schema —
# logged in the digest for hunt reference.
#
# No CIDRs claimed by the advisory — none fabricated (context-anchor rule).

author: aptwatch-curator
source: https://www.ic3.gov/CSA/2026/261006.pdf
source_name: FBI/USSS Joint Cybersecurity Advisory JCSA-20261006-01 — FortiBleed Operations Continue Targeting Exposed Systems

apt_groups:
  - FortiBleed Credential Harvesting (2026-06)

description: >
  October 6, 2026 FBI/USSS joint advisory on the ongoing FortiBleed campaign:
  credential stuffing and password spraying against internet-facing FortiGate
  SSL VPN portals using prior leak dumps and infostealer logs, offline hash
  cracking on a rented ~36-GPU Hashtopolis cluster, creation of rogue admin
  accounts for persistence, deletion of legitimate accounts causing victim
  lockouts, AD enumeration, and sale of access to ransomware affiliates
  (currently INC/Lynx and Payload). IOCs consolidated from the advisory
  (45.154.12.132 C2; 154.202.59.169 and 103.27.186.156 proxy nodes;
  45.155.250.158 beacon relay; 193.8.187.x facilitation; Table 1 brute-force /
  successfully-authenticating IPs observed 2026-06-18 to 2026-07-23) and from
  the CloudSEK open-directory analysis cited by the advisory (6 additional
  backend/infrastructure IPs never previously ingested). Discovery vector:
  The Register (2026-10-07). Sister sources: SOCRadar (scale verification),
  CloudSEK (backend analysis). Cloudflare IP 104.28.155.27 and already-ingested
  85.11.187.8 deliberately excluded.

