author: aptwatch-curator

source: https://www.recordedfuture.com/blog/critical-fortibleed-campaign
source_name: Recorded Future Insikt Group — FortiBleed Campaign (2026-06-19)

# PROPOSED NEW campaign — no existing campaign_name matches.
# Loader resolve_campaign() will CREATE this campaign on import.
# Rich campaign metadata (first_seen, actor_type, ttps,
# attribution_sources) is supplied by deploy/fortibleed-2026-06-19/.
# Confirm campaign creation / canonical naming at import time.
apt_groups:
  - FortiBleed Credential Harvesting (2026-06)

description: >
  Attacker operational infrastructure for the FortiBleed FortiGate
  credential-harvesting campaign — a Russian-speaking eCrime / initial-access-
  broker operation (credential reuse + credential stuffing at scale), active
  since at least MARCH 2026 per GreyNoise first-seen (June 2026 = public
  disclosure, not start). Recorded Future Insikt Group identified 85.11.187.8
  (AS211486, 85.11.187.0/24) as a staging / cracking / exfiltration host: HTTP
  on port 9999 on 2026-06-07, then SSH, VNC, RDP and capture activity
  2026-06-14 to 2026-06-15. The host exposed a no-auth Open Directory (poor
  opsec) which is how SOCRadar/researchers discovered the operation. On-host
  artifacts: Fortinet credential sniffer log (fg_capture.log); Hashcat /
  Hashtopolis cracking orchestration with Telegram-coordinated tasking
  (bot.py, hashpanel.log, setup_hashcat.sh, setup_hashtopolis.sh) on a 45-GPU
  cluster; an "AI pentesting platform"; Active Directory / LDAP enumeration
  (ad_enum.py, ad_full_audit.py); password-spraying (spray_*.sh/.py,
  spray_results.txt); SMB/DFS staged exfiltration (backup_dfs.py,
  backup_dfs2.py, spider.py, smb_test.py); log-clearing markers. MO (SOCRadar):
  credential reuse from prior Fortinet breach dumps + infostealer logs, tested
  at scale; compromised devices reused as passive listening posts to harvest
  more SSL-VPN auth hashes (self-reinforcing). Scope is broader than Fortinet —
  FortiWeb and MSSQL (2.1B attempts vs 163,650 hosts) also targeted; scanner
  covers ports 443/4443/8443/10443. The verified-credentials DB is structured
  by country/sector/revenue/headcount — consistent with IAB inventory prepared
  for resale (not yet seen for sale as of disclosure). Independently
  corroborated as a FortiBleed source IP by PwnDefend
  (https://www.pwndefend.com/2026/06/18/fortibleed/ , 2026-06-18; Russian-
  language script comments, AS211486 multi-year cybercrime history, confirmation
  via Defused honeypots + GreyNoise). Campaign disclosed by V. Diachenko
  2026-06-13 (discovery vector); SOCRadar coined "FortiBleed" and found the
  operational server; victim-data validated by Kevin Beaumont / DoublePulsar
  (https://doublepulsar.com/fortibleed-75k-fortinet-firewalls-have-admin-passwords-cracked-60299faa65f8)
  and Hudson Rock (https://www.hudsonrock.com/fortinet); CISA hardening alert
  2026-06-18
  (https://www.cisa.gov/news-events/alerts/2026/06/18/cisa-urges-hardening-fortinet-devices-after-reports-credential-exposure).
  Espionage overlap (NATO-weighted victimology incl. a Turkish NATO defence
  contractor with classified-doc exfil) is a HYPOTHESIS, not an attribution.
  CVE-2026-24858 (FortiCloud SSO SAML auth bypass, CVSS 9.8) is under
  investigation as a possible contributory vector but is NOT the at-scale
  mechanism (credential reuse, not 0-day) — recorded here in prose, NOT as a
  cves: IOC. SCOPE: only host 85.11.187.8 ingested; 85.11.187.0/24 deliberately
  NOT added to cidrs (multi-tenant). ~73,932 victim URLs / 21,632 domains
  EXCLUDED as victim data. PROPOSED NEW campaign — confirm campaign_name on
  import; rich metadata via deploy/fortibleed-2026-06-19/.

ipv4:
