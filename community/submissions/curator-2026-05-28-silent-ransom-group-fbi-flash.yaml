author: aptwatch-curator-bot
source: https://www.ic3.gov/CSA/2026/260526.pdf
source_name: FBI FLASH-20260526-01 - Silent Ransom Group (Luna Moth / Chatty Spider / UNC3753) Impersonating IT Personnel through Social Engineering (TLP:CLEAR, 2026-05-26)

apt_groups:
  - Silent Ransom Group
  - Luna Moth
  - Chatty Spider
  - UNC3753

description: >
  FBI Cyber Division FLASH alert FLASH-20260526-01 published 2026-05-26
  (TLP:CLEAR), coordinated with DHS/CISA, naming the Silent Ransom Group
  (SRG) - also tracked as Luna Moth, Chatty Spider, and UNC3753 - as the
  operator behind a sustained callback-phishing and impersonation campaign
  against US-based law firms since Spring 2023, with material escalation
  observed Spring 2026. The 2026 escalation introduces a physical-access
  leg in which SRG operatives travel to victim premises and pose as on-site
  IT support to insert a USB or external drive into employee workstations
  after a callback phishing pretext fails to deliver remote-desktop access.
  Sister-source corroboration: BleepingComputer, CyberScoop, Help Net
  Security, HIPAA Journal, Hackread, TechTimes (all dated 2026-05-26 or
  2026-05-27 and citing the same FBI primary).

  Attribution per multi-vendor consensus places SRG as a Russian-speaking
  crew that emerged after the Conti dissolution in 2022 (Conti is already
  tracked in this project under id 16, Wizard Spider / Ryuk successor /
  GOLD ULRICK / DEV-0193 / Storm-0193). The FBI primary text does not name
  a country of origin directly; the Russian-speaking ecosystem lineage is
  documented in Mandiant UNC3753 reporting and Palo Alto Unit 42 / TrendMicro
  Luna Moth profiles published 2023-2025, which the FBI FLASH implicitly
  builds on by listing the aliases (Luna Moth, Chatty Spider, UNC3753)
  established by those prior vendor reports. Per the project's three-pillar
  attribution discipline for ransomware/crime crews - (1) vendor+ OSINT
  corroboration: PRIMARY (FBI) plus six sister sources, (2) per-infrastructure
  malicious signal: explicit per-FBI naming of the operator-controlled DLS
  business-data-leaks[.]com, (3) Russian-speaking ecosystem confirmed via
  Conti-spinoff lineage documented across Mandiant / Unit 42 / Trend - the
  attribution bar is cleared. confidence noted "moderate-to-high" in
  vendor parlance; this curator YAML uses the project default curator-1.0
  score with the description capturing the Russian-speaking ecosystem
  caveat rather than a state-actor attribution.

  Operational pattern documented in the FBI primary: (a) callback-phishing
  email with invoice / billing / subscription / IT lure prompting the
  victim to call a threat-actor-controlled number, (b) on the call the
  actor impersonates internal IT and walks the victim through installing
  one of a list of legitimate remote-access tools (Zoho Assist, Quick
  Assist, AnyDesk, RustDesk, Syncro, Splashtop, Atera) - these are NOT
  ingested as IOCs since they are legitimate dual-use tools and the FBI
  text explicitly warns "Use of these tools should not be attributed as
  malicious without analytical evidence to support they are used at the
  direction of, or controlled by, SRG actors," (c) if remote access fails,
  an in-person operative arrives to insert removable media, (d) data
  exfil via WinSCP, hidden/renamed Rclone, or to Google Drive / Microsoft
  OneDrive, (e) extortion via email and follow-on calls to employees and
  clients of the victim, (f) public-shaming via DLS at the apex domain
  below. SRG does NOT deploy ransomware encryption - the operation is
  pure data-theft-and-extortion.

  MITRE ATT&CK candidates per the FBI table (logged in prose since the
  curator schema has no structured TTP field): T1566 Phishing (callback
  variant), T1598.004 Voice Phishing / Reverse Social Engineering, T1219
  Remote Access Software, T1078 Valid Accounts, T1560 Archive Collected
  Data, T1530 Data from Cloud Storage, T1567 Exfiltration Over Web
  Service, T1052.001 Exfiltration to Removable Media, T1657 Financial
  Theft / Extortion.

  IOC universe ingested here is limited to the single attacker-owned
  network artefact named in the FBI primary: business-data-leaks[.]com,
  the SRG public-facing data-leak site where victim data is posted to
  pressure ransom negotiations. The site is attacker-registered and
  operated, not a hijacked legitimate business - it goes under domains:
  (the loader will tag it domain_type=malicious). No IPv4, IPv6, URL
  paths, email addresses, CVEs, CIDR ranges, or sample hashes are listed
  in the body of the public FLASH text reviewed. The FBI is actively
  soliciting victims for additional artefacts (ransom-note copies, actor
  phone numbers/email accounts, cryptocurrency wallet addresses) that
  may surface in follow-on advisories; a sequel curator YAML should be
  filed if and when such material becomes publicly disclosed. Geographic
  targeting per the primary is overwhelmingly United States law firms
  with sector spillover into insurance, finance, and healthcare.
  Discovery vector for this curator YAML was the daily APT Watch threat
  hunt (scheduled-task apt-threat-hunting, 2026-05-28), via The Register
  RSS surfacing CyberScoop, BleepingComputer, and Help Net Security
  reports on 2026-05-27 that pointed at the FBI FLASH PDF as primary.

domains:
  - business-data-leaks.com
