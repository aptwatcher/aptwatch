description: >
  Command-and-control and social-engineering-lure infrastructure for Woodgnat
  (aka KongTuke), a financially-motivated INITIAL-ACCESS BROKER active since at
  least May 2024. Symantec/Carbon Black (primary, 2026-06-24) documents a new
  stealthy in-memory backdoor — Backdoor.Mistic (tracked by Zscaler as
  MLTBackdoor) — used in intrusions since April 2026 and deployed in one case
  alongside the group's Python-based ModeloRAT. Mistic side-loads via the
  legitimate MpExtMs.exe and a malicious EndpointDlp.dll (a Microsoft endpoint-
  security-tooling name), runs payloads in memory with no disk write, and has a
  self-delete kill switch for long-term low-visibility access. Woodgnat operates
  a traffic-distribution system on compromised WordPress sites delivering an
  evolving lure series (ClickFix 2025 -> FileFix mid-2025 -> CrashFix early
  2026), plus help-desk / Microsoft Teams "paste-and-run" pretexts rotating
  across multiple M365 tenants (ReliaQuest); victims are tricked into a single
  PowerShell command that unpacks a portable WinPython environment and launches
  ModeloRAT (RC4 C2, multi-path failover per Rapid7; weekly-rotating DGA C2 for
  non-domain-joined hosts). It sells durable enterprise access to ransomware
  affiliates: Symantec links Woodgnat / ModeloRAT to Qilin, Interlock, Rhysida,
  Akira, 8Base and Black Basta (Akira in-scope directly; Black Basta is
  Conti-lineage). IMPORTANT: Woodgnat is assessed as eCrime, NOT state-
  sponsored, and its geography is unclear — ingested here as a ransomware-
  adjacent crime op feeding in-scope crews, NOT as a Russian APT. Discovery
  vector: The Register (2026-06-25). Corroboration: Zscaler MLTBackdoor analysis
  (https://www.zscaler.com/blogs/security-research/technical-analysis-mltbackdoor),
  ReliaQuest help-desk-lure spotlight
  (https://reliaquest.com/blog/threat-spotlight-help-desk-lures-drop-kongtukes-evolved-modelorat/),
  Rapid7 ModeloRAT analysis
  (https://www.rapid7.com/blog/post/tr-it-support-dissecting-modelorat-campaign-microsoft-teams-compromise/).
  All 26 domains + 4 IPs + 1 payload URL were net-new vs the local apt-intel DB
  cache (0 matches). SHA256 file hashes recorded in the daily digest only
  (no hash table in the flat-IOC schema). PROPOSED NEW campaign — confirm
  campaign_name and scope fit on import.

