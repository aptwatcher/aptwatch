  Infrastructure pivots documented by GTIG: the OWA-themed domains
  owa-ms365.com, m365-owa.com and ms365-device.com were registered between
  July 16 and July 23, 2026 using chikolimdrid@gmail.com, an address
  previously used to register ms365-live.com, which resolved to
  104.194.159.150 - the same IP that my-invite.org resolved to, the domain
  used in the April 2026 GLOBSEC device code operation. Those OWA domains
  are linked to the hospitality captive portal campaign (CaptiveCrunch)
  reported by Reliaquest on July 23, 2026 and by Microsoft on July 31, 2026
  under the Midnight Blizzard name. The address keyereaonkendrick4@gmail.com
  registered statistic-ms.live and was reused in the late May 2026 MaaS
  operation; bounce@chamber-ua.org distributed ENGINELIGHT in May 2026.
  Companion sources: GTIG "What's in an ASP?" of June 18, 2025 (first
  UNC6293 publication, campaigns 1 and 2, residential proxy
  91.190.191.117); Citizen Lab report 188 "Same Sea, New Phish" of June 18,
  2025 (Keir Giles case, DigitalOcean IP 178.62.47.109 tied to a suspicious
  sign-in attempt on June 4, 2025); Volexity of December 4, 2025 on UTA0355
  (fake event websites for the Belgrade Security Conference and the Brussels
  Indo-Pacific Dialogue, Microsoft OAuth and device code workflows, targets
  guided over WhatsApp and Signal), explicitly cited by GTIG as illustrating
  UNC6293 lure themes - the UTA0355 domains are included below and UTA0355
  is carried in apt_groups so the Volexity attribution stays transparent;
  Microsoft "CaptiveCrunch" of July 31, 2026; Reliaquest of July 23, 2026.
  Originally flagged by the analyse-veille-securite-rss skill v0.3 from a
  The Register article of August 21, 2026 (run 2026-08-21, brief
  veille-securite-rss-20260821-0944.md); enriched on August 25, 2026 by
  tracing back to the GTIG primary report and its companion reports.

