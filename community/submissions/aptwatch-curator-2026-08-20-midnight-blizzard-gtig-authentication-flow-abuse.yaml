description: >
  Google Threat Intelligence Group (GTIG) primary report of August 20, 2026
  documents three distinct suspected Russian espionage clusters abusing
  legitimate authentication flows to compromise accounts: UNC6293, UNC7005
  (aka STORM-2945) and UNC5976. GTIG assesses with moderate confidence that
  UNC6293 and UNC7005 are initial access subclusters of ICE RELIC (Google's
  new designation for APT29 / Cozy Bear, attributed to Russia's SVR), and
  assesses UNC5976 as distinct, possibly aligned with a different Russian
  intelligence service. Russian nexus assessed with high confidence for all
  three. Targeting: academia, aerospace and defense, governments and think
  tanks across Europe, plus academia and think tanks in the United States.
  UNC5976 focuses on the military, the defense industrial base and NGOs,
  geographically on Ukraine and Armenia. Campaign volume is low, often fewer
  than five targets at a time for UNC6293.
  TTPs and candidate MITRE ATT&CK techniques in prose: Google app-specific
  password (ASP) phishing that bypasses 2FA, with the actor impersonating US
  Department of State officials and instructing the target through a lure PDF
  to name the app password "ms.state.gov" (T1566.001, T1078, T1556.006);
  OAuth phishing where the target is asked to hand back the full URL or the
  "verification code" after a legitimate login at an external provider
  (T1550.001, T1528); Microsoft device code phishing and WhatsApp device
  linking, the phishing page generating a genuine QR and linking code bound
  to the attacker's device (T1621); unverified testing-mode Google Cloud
  projects used to harvest tokens; registration of an extra device in Entra
  ID carrying the same name as a legitimate victim device, for persistence
  (T1098.005); JavaScript fingerprinting and headless-browser detection
  (navigator.webdriver, missing navigator.languages) for analysis evasion
  (T1497); audio and video capture of the target through getUserMedia after
  WhatsApp linking, uploaded to /api/code/<session>/recording; commercial
  residential proxies for post-compromise activity, whereas UNC5976 uses
  dedicated infrastructure instead. Recurring lure themes: diplomatic event
  invitations, conferences (GLOBSEC, embassy invite), an epicurean wine
  selection inherited from earlier ICE RELIC operations, and since
  July-August 2026 impersonation of the Finnish Operations Center (FOC, NATO
  defense sector).
  Malware families observed, either purchased as MaaS or LLM-generated:
  VIDAR (obfuscated Go infostealer, C2 107.189.18.7), ATOMIC / AtomicStealer
  (macOS), ENGINELIGHT (Go, C2 statistic-ms.live), CHERRYPIE / ChocoShell
  (PowerShell infostealer, artifacts suggesting LLM generation), HEADRUSH
  (malicious Excel plugin leading to an HTA downloader, UNC5976).
  The curator schema has no hash table, so the following SHA-256 values are
  listed here for EDR blocking (Defender custom indicators) instead - VIDAR
  1d9299799a7b8da67c44ebec064d64542c27645f8e84de4a22ca3f6cbc843e3c;
