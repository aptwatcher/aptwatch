description: >
  Delta URL backfill for the Zscaler ThreatLabz "Operation Neusploit" report
  (published 2026-02-02). The primary network IOCs from this report - the
  attacker-owned apex domains freefoodaid.com and wellnesscaremed.com plus
  CVE-2026-21509 - were already ingested at curator score 1.0 under the
  existing Pawn Storm campaign (campaigns.id=19). However, the three
  full URL strings hosting the staged payloads were never captured in the
  urls table. This curator YAML adds those three URLs so that URL-level
  blocklists (e.g. proxy/web-filter rules) get the path-precise IOCs and
  not only the apex-domain coverage.

  Operation Neusploit context: in January 2026, Zscaler observed APT28
  weaponizing CVE-2026-21509 (Microsoft Office RTF) within three days of
  Microsoft's out-of-band patch (2026-01-26 patch, in-the-wild exploitation
  observed 2026-01-29). Targeting was Central and Eastern Europe - Ukraine,
  Slovakia, Romania - with social-engineering lures in localized languages
  (Romanian, Slovak, Ukrainian) plus English. Server-side geographic
  filtering and User-Agent matching gated the malicious DLL delivery to
  the intended victim population only. Two attack-chain variants were
  documented:

  Variant 1 dropped MiniDoor, a 64-bit C++ DLL deploying a malicious
  Outlook VBA project (VbaProject.OTM) that monitored MAPILogonComplete
  and Application_NewMailEx to forward inbox/junk/drafts/RSS messages to
  attacker-controlled addresses (ahmeclaw2002@outlook.com,
  ahmeclaw@proton.me - already ingested per the older Pawn Storm campaign
  enrichment). MiniDoor is a stripped variant of NotDoor (Lab52, September
  2025).

  Variant 2 dropped PixyNetLoader, which extracted shellcode via PNG
  steganography (SplashScreen.png) into a malicious EhStoreShell.dll DLL
  proxy, established COM hijacking persistence via CLSID
  {D9144DCD-E998-4ECA-AB6A-DCD83CCBA16D}, and ultimately loaded a
  Covenant Grunt implant abusing the Filen cloud API as a C2Bridge
  (folder UUID fe644d8c-2601-46ea-bf7d-3db110aa08d4). ESET's "Sednit
  reloaded" report (WeLiveSecurity, 2026-03-10) independently confirmed
  the Covenant-via-Filen-and-Icedrive tradecraft as a hallmark of Sednit's
  reactivated advanced development team, alongside BeardShell which uses
  Icedrive.

  IOCs included here are restricted to the three URL strings that were
  not captured in the earlier ingest of this campaign. The two apex
  domains and CVE-2026-21509 are already in the DB at curator score 1.0
  under campaigns.id=19 (Pawn Storm) and are intentionally NOT repeated
  here. Hashes from the Zscaler IOC table (SHA-256, SHA-1, MD5 for the
  RTF lures, the MiniDoor / PixyNetLoader / EhStoreShell.dll droppers,
  SplashScreen.png, office.xml, and the Covenant Grunt implant) are NOT
  ingested because the flat-IOC schema has no hash table - they are
  recorded in the 2026-05-22 daily threat-hunt digest for audit only.

  MITRE ATT&CK techniques implied by the Zscaler narrative (in prose since
  the curator schema has no structured TTP table): T1566.001 (Phishing:
  Spearphishing Attachment), T1203 (Exploitation for Client Execution),
  T1546.015 (COM Hijacking), T1137.006 (Office Application Startup:
  Add-ins), T1027.003 (Obfuscated Files or Information: Steganography),
  T1497.003 (Time Based Sandbox Evasion), T1102.002 (Web Service:
  Bidirectional Communication via Filen API), T1114 (Email Collection
  via Outlook VBA forwarding).

  Discovery vector for this delta backfill was the STTR daily APT Watch
  threat-hunt job for 2026-05-22, during which a vendor-blog sweep for
  "APT28 CVE-2026-21509" surfaced the Zscaler primary plus the ESET
  sister-source. The 24-hour scope window (2026-05-21 to 2026-05-22)
  itself yielded no fresh in-scope vendor or CERT reporting; this YAML
  is a back-catalogue enrichment, not a 24-hour scoop.
  
