description: >
  Four attacker-registered Microsoft-365-impersonation domains, six attacker IPs
  and three ChocoShell command-and-control URLs tied to CaptiveCrunch, a global
  hospitality captive-portal hijacking campaign that Microsoft Threat Intelligence
  (2026-07-31) attributes to Storm-2945, an operational sub-cluster of Midnight
  Blizzard (APT29 / Cozy Bear, Russia SVR). Since early May 2026 the operators
  have manipulated DNS and HTTP traffic on captive-portal Wi-Fi networks at
  hotels, conference centers and shared venues worldwide to redirect connecting
  guests toward (a) Microsoft-365 AiTM credential-harvesting pages, (b) Microsoft
  device-code-flow phishing (since 2026-07-16, MFA-satisfied token theft), and
  (c) ClickFix fake browser/OS-update lures that deliver malware. Two new Windows
  malware families are documented: CornFlake, a Go-based RAT (svchost32.exe /
  service "Cloud Sync Service"; keylog, clipboard, screenshot, mic/webcam, browser
  cred+cookie theft incl. Chrome App-Bound Encryption bypass, USB monitoring,
  remote shell; ECDH P-256 encrypted JSON C2; localhost HTTP API /upload /reload
  /status), and ChocoShell, an in-memory PowerShell stealer that lifts M365/Entra
  ID access+refresh+WAM tokens from .tbres Token Broker cache files and Wi-Fi
  creds (netsh wlan show profile key=clear), with three UAC-bypass techniques and
  Chrome DevTools remote-debugging cookie theft. Operators manage the campaign via
  FruitStone, an unprotected web C2 panel masquerading as an "Acuity Systems, Inc.
  CloudSync Console." Microsoft assesses AI tooling was likely used to author both
  implants (extensive code comments). ATTRIBUTION NOTE: this SUPERSEDES the earlier
  ReliaQuest coverage of the same infrastructure (2026-07-23,
  https://reliaquest.com/blog/threat-spotlight-dns-poisoning-tactics-expand-to-hospitality/),
  which asserted only APT28/FrostArmada TTP overlap and explicitly declined direct
  attribution; the pending local 2026-07-31 curator YAML placed the shared IOCs
  under the APT28 lineage on that basis and should be reconciled to APT29.
  apt_groups[0] maps to existing DB campaign #7 "APT29 / Cozy Bear"; consider
  splitting a dedicated Storm-2945 / CaptiveCrunch child campaign on import.
  Discovery vectors / sister coverage: BleepingComputer "Hotel Wi-Fi attacks use
  custom malware to breach Microsoft 365 accounts"
  (https://www.bleepingcomputer.com/news/security/hotel-wi-fi-attacks-use-custom-malware-to-breach-microsoft-365-accounts/,
  2026-08-03); The Hacker News "Hijacked Hotel Wi-Fi Pushes Fake Updates to
  Deliver Surveillance Malware" (https://thehackernews.com/2026/08/hijacked-hotel-wi-fi-pushes-fake.html,
  2026-08-01); Security Affairs
  (https://securityaffairs.com/196441/apt/russian-hackers-hijack-hotel-wi-fi-to-steal-microsoft-365-tokens.html,
  2026-08-01). CornFlake SHA-256 918fa52ae45ed60ba7cc8bdc99c3cbe9ab92e0375ec31fc05d0d4513be11c593
  and ChocoShell SHA-256 be99857449d2856dd5a84e21c8a3d5e0e01456adb44062ddec5a6b4970d8d42c
  are recorded in the digest (no hash table in the flat-IOC schema).

