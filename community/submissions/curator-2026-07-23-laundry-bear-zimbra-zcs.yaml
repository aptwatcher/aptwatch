source_name: "Joint CSA U/OO/6045678-26 - Russian State-Supported Cyber Actors Conduct Phishing Campaign Targeting Users of Zimbra Collaboration Suite (LAUNDRY BEAR)"

apt_groups:
  - LAUNDRY BEAR
  - Void Blizzard

description: >
  Joint advisory (NSA, FBI, MIVD, AIVD, CISA and co-sealing agencies, July 2026, TLP:CLEAR,
  ref. PP-26-2936) on an espionage campaign attributed to the Russian APT group LAUNDRY BEAR
  (aka Void Blizzard, CL-STA-1114, TA488). Since July 2025, the group has targeted Zimbra
  Collaboration Suite (ZCS) webmail servers using a custom capability named "Ulej" that
  exploits CVE-2025-66376 (XSS, CWE-79, improper neutralization of CSS @import directives).
  View-based exploit: merely viewing a booby-trapped email in a vulnerable ZCS client
  triggers a JavaScript payload (hidden in the onload attribute of an SVG element, double
  Base64 + XOR encoding). The script exfiltrates the last 90 days of emails, the Global
  Address List (GAL), the password (via autocomplete), 2FA / scratch codes, and creates an
  Application Passcode named "ZimbraWeb" for persistence (enables IMAP via ModifyPrefsRequest).
  Exfiltration goes to the "Flowerbed" infrastructure (Docker containers: Catcher, Certbot,
  Nginx, Gardener) over DNS (Base32) and HTTPS.
  MITRE ATT&CK: T1566, T1203, T1027.017, T1027.013, T1027.010, T1119, T1114, T1114.002,
  T1087, T1098, T1556.006, T1550.004, T1185, T1560, T1074.002, T1048, T1048.002, T1048.003,
  T1583, T1583.003, T1587, T1587.001, T1587.004, T1588.002, T1588.007, T1608, T1078, T1199.
  ZCS patch available (versions 10.1.13 and 10.0.18). Fix released November 2025;
  CVE published to NVD on 5 January 2026.
