  1517b3caa495f6c4e832df9c75fc94667e3c233773f7fa4e056d5e30e5ead760.
  SHA-256 of the pixel.gif served by Catcher:
  ef1955ae757c8b966c83248350331bd3a30f658ced11f387f8ebf05ab3368629.
  SHA-1 of the Flowerbed Let's Encrypt (X.509) certificates:
  2e4f314bc9943cab5005d6fde0b271c74d47bc9d, 50a87d926621dd06389ba50d86e0ff574ed713a8,
  c5a72420e7bb308d078e62128430897f82194c95, 8959c4d29e29f02ea94ea8bb21c8df2594c5549d,
  62eb76432597694edb01c1fe57aab0cfe03a7178, cddf5c3be1e07f28140aed165b929bf2d614922a,
  18b3ad442ce73cc8656d51d75bbd7c855f2cb7e8, 1b25041ececf2457eef0270fc1d785cec8ec9ded,
  e4fe6466a4f9a4249fe330651e914e45bbdca44a, b6b77c9a455225d525834a403ca9ef5481ed0447.
  Suspicious ZCS SOAP/log signals (mailbox.log): bursts of SearchGalRequest,
  CreateAppSpecificPasswordRequest (app "ZimbraWeb"), GetScratchCodesRequest;
  localStorage key zd_comp_YYYY-MM-DD. VPN favored by the actor: Mullvad.
  Advisory caveat: indicators are intended for historic attribution; verify current
  activity before blocking.

