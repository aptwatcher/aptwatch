description: >
  UAC-0200 (CERT-UA designation; Trend Threat Intelligence Feed intrusion-set "Water Pinading"; watchlist entry
  UAC-0200 with DarkCrystal RAT / DCRAT / DarkTortilla aliases) cyber-espionage campaign against employees of
  Ukrainian defence-industrial enterprises and individual members of the Defence Forces of Ukraine, March 2025,
  documented by CERT-UA in advisory CERT-UA#14045 (published 2025-03-18) and mirrored in the Trend feed as
  "Dark Crystal RAT Targets Ukrainian Defense via Signal Messenger" (report published 2025-03-21, labels
  location:Ukraine). Attribution: CERT-UA tracks the cluster as UAC-0200, active since at least summer 2024
  (see CERT-UA#9918, June 2024); Trend names it Water Pinading; Russia-aligned per watchlist category. Victimology:
  defence-industrial complex companies and service members, approached over Signal, sometimes from already
  compromised Signal accounts of contacts. TTPs in prose: archives sent through Signal (T1566.003) containing a decoy
  PDF ("meeting minutes", orders) and an executable packed with the .NET crypter DarkTortilla (T1027.002), which
  decrypts and injects DCRat (T1055); DCRat provides command execution, information theft and remote control
  (T1059, T1005, T1219); second-stage loader fetched from imgurl.ir, a legitimate Iranian image host used as a
  dead drop (T1102). Infrastructure roles, first seen per CERT-UA 2025-03: 45.130.214.237, 62.60.235.190,
  87.249.50.64 and 217.25.91.61 are DCRat C2 servers reached over HTTP with long randomized PHP paths (listed as URLs
  below); 83.147.253.138 serves hostdata.txt (C2 configuration). Legitimate platform URL recorded here only and not
  submitted: hxxps://imgurl[.]ir/download.php?file=q68235_labodtarinog.txt. SHA-256 file indicators published by
  CERT-UA, no hash field in this schema, recorded here for the curator: ccfc8e6c0ffddd29786a7a15e8da549cdf2a062002de336c6d0480893d3c5a1b
  (Zvit 10.03.25.rar), dc15fe10ff5e7ede1b5e69c6f09e9a7cc0857bab9829f5537b3d0d073a81a53f (Nakaz 17.02.2025.pdf decoy),
  0403fabcc93887f2aa44194c5e6a68f71647ca18ad4b0f9033b0e704d27ab578 (Pochatkovyi material.exe), 586c6e65fcf391d6ee8d1270aa3cb902e79372b73f3a9be340785cd8620197a1,
