  cefa8cb6c1e7641ed22c250de4c9f7663c66e7fd18f93b69e1ff45401af855f7 (narada.rar), 25a6a3a84fd0c070fbf3dfc9da4a3e2e1186d9165ec59c3aae2a82a6506d62d3 (PDF-Office2025version46-v.exe),
  1ea7ecce3b51f8c0f5329bc79cf7c035e47c962ca0241d040548f2fd55e3f1c8, 788fd5a229d4776cca93f8628102cbaed704675eebe7cc8c92d1a731532dea3a, ce41636e0733724c6531a9738b035e9743aee8c39fc7358410000a9706b14231,
  eebc24a4f94b02f1fde7674887f20fe6029dc525ed9ad2256d3f79ab6579483a (Razporyadzhennya.zip), 21b37fa1eca20402431ca88dd77db2ddd258b4bb69ea7a74dfeae54aeb7d7e14 (DecodPDF.exe),
  81889343fd40c56f5d5440518b7969cde1f33d0eb263f3bed206bbe4a09e5619, a8f5537a63fee5da18f64a0fe6108916a740fdda3ba961d425ec5a8a9419e409 (DecofPDF.exe),
  d37f3441d3c74b2d36e38299f1c6df94063d40adfc551dc3ef34aa1efd493ff6 (q68235_labodtarinog.txt), e6a7bdbbf05a76a68e1d5e1de15c63eeea1607245b5604ee5ac835aefec57d6d (q68235_labodtarinog.dll).
  Companion sources: The Hacker News 2025-03-20 "CERT-UA Warns: Dark Crystal RAT Targets Ukrainian Defense via
  Malicious Signal Messages". APT Watch batch lookup query_ids qry_01M66X1J5VA8210TABQ6FF3P3K, qry_01M66X1JZSMM6EE4QP5V2FEBQ6, qry_01M66X1KSJYSE7G29H4TR4HP60, qry_01M66X1MC2KW8Y6PQTZQ6JWHAM: the five IPs were unknown to the database on
  2026-10-30. Flag originated from the Trend Threat Intelligence Feed pull of 2026-10-30 (location eq 'Ukraine'),
  UAC-0200 watchlist match, category russia_aligned; proposed watchlist alias to add: Water Pinading.
