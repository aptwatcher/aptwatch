# Gunra ransomware (Conti-derived RaaS, alias "Golden Community") —
# joint #StopRansomware advisory AA26-222A (FBI/CISA/DC3/NSA/USSS/KNPA),
# published 2026-08-10. Backfill: never ingested by prior runs (no
# gunra YAML in git history; 0/24 IOCs matched on live-API batch
# lookup 2026-09-05; local DB cache dated 2026-08-24 also has no
# Gunra campaign).
#
# NEW CAMPAIGN: apt_groups[0] deliberately introduces
# "Gunra Ransomware RaaS" — no existing campaign_name covers this
# actor (checked campaigns table + live API 2026-09-05). In-scope
# rationale: double-extortion RaaS derived from leaked Conti source,
# Russian-speaking-forum affiliate program; adjacent to tracked Conti
# lineage. Suggested relationship on import: lineage link to existing
# "Conti" campaign.
#
# Alias discipline: "Conti" is deliberately OMITTED from apt_groups —
# it is an existing distinct campaign_name and adding it as an alias
# would create a collision. Only "Golden Community" (Gunra's own
# rebrand, per FBI) is listed as alias.
#
# Exclusions per project policy:
# - 3 .onion DLS addresses excluded (never tracked).
# - 4 SHA256 hashes (main.exe x2, cryptor.exe, msmp.exe) and 4 qTox
#   IDs logged in the digest only — flat-IOC schema has no hash/ID table.
# - "forticloud-sync" malicious Fortinet username: digest only.
# - No CIDRs listed: advisory claims none.
#
# Domain triage: datapub.news = attacker-operated clearnet mirror of
# the Gunra Tor DLS (June-July 2025) per the advisory's own text ->
# verdict malicious (report-stated attacker operation; manual triage,
# CSV at APT_Analytics/reports/triage/cisa-aa26-222a-2026-09-05.csv).
# Email providers proton.me / gmail.com are shared platforms — only
# the account-specific addresses are ingested, never the apexes.
#
# IP note: Table 2 IPs are attacker infrastructure ("associated with
# Gunra ransomware infrastructure since early 2025"), NOT victim
# telemetry. First/last-seen ranges Jul 2025 - Dec 2025 per advisory;
# historical in nature per CISA disclaimer (vet before blocking).

author: APTWatch Curator
source: "https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-222a"
source_name: "CISA/FBI joint advisory AA26-222A: #StopRansomware Gunra Ransomware"

apt_groups:
  - Gunra Ransomware RaaS
  - Golden Community

description: >
  Gunra is a double-extortion ransomware-as-a-service derived from the
  leaked Conti source code, first observed April 2025, expanded to a
  structured RaaS affiliate program (rebranded "Golden Community") in
  early 2026. Joint advisory AA26-222A (FBI, CISA, DC3, NSA, USSS and
  Republic of Korea NPA, 2026-08-10) documents initial access via
  Fortinet FortiOS/FortiProxy auth-bypass exploitation (CVE-2024-55591,
  CVE-2025-24472; persistent super-admin account "forticloud-sync"
  with hard-coded password), SSL-VPN credential sniffing and session
  hijacking, VDI portal MFA bypass via modified OTP validation, Impacket
  lateral movement (psexec/smbclient/secretsdump), OneDrive/SharePoint
  exfiltration via custom main.exe and Mega, and ChaCha20+RSA-4096
  encryption (.ENCRT extension, R3ADM3.txt ransom note). IPs below are
  Gunra attacker infrastructure (Jul-Dec 2025 sightings); datapub.news
  was the actor-operated clearnet DLS mirror; emails are ransom
  negotiation accounts. Three .onion DLS addresses excluded per project
  policy; 4 SHA256 and 4 qTox IDs logged in digest only. Victims span
  healthcare, finance, manufacturing, transport, government, utilities
  across the Americas, Europe, MEA and APAC. Sister coverage (THN
  2026-08-11, Rewterz, SafeBreach, Infosecurity) is derivative of the
  advisory and adds no net-new IOCs. MITRE: T1190, T1133, T1078.001/.002,
  T1098, T1556.006, T1003.003, T1550.002/.003, T1021.001/.002, T1040,
  T1539, T1555, T1047, T1490, T1486, T1567, T1530, T1622.

