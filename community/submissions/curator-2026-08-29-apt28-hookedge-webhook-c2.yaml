source_name: "Recorded Future Insikt Group: BlueDelta Targets Defense and Diplomacy with HOOKEDGE (CTA-RU-2026-0827)"

apt_groups:
  - APT28 HOOKEDGE / Operation MacroMaze
  - BlueDelta
  - HOOKEDGE
  - Operation MacroMaze

description: >
  HOOKEDGE is a lightweight Windows batch-script backdoor deployed by
  BlueDelta (GRU; overlaps APT28 / Fancy Bear / Forest Blizzard) in
  initial-access campaigns from late September 2025 through July 2026
  against government, diplomatic and defense-manufacturing targets in
  Romania, Spain and Turkiye. Delivery is via macro-enabled Word
  documents (diplomatic lures, incl. a spoofed Spanish Ministry of the
  Presidency agenda tied to Spain-Moldova meetings ahead of Moldova's
  September 2025 elections; later generic enable-content lures). The
  macro drops six GUID-named files to %userprofile% and persists via a
  scheduled task (30/20/61-minute intervals across variants).
  HOOKEDGE is assessed a direct evolutionary successor to HEADLACE:
  same batch-script core, hidden/headless msedge.exe used as HTTP
  client, and exclusive reliance on webhook.site free-tier endpoints
  for C2, payload staging, document/mail-open canaries and HTML
  form-POST exfiltration. Second-stage HOOKEDGE payloads with 5-minute
  beaconing were deployed to high-value victims on dedicated webhook
  endpoints. The 30 URLs below are the attacker-provisioned
  webhook.site endpoints (canary, staging/tasking and exfiltration);
  the webhook.site apex is deliberately excluded (shared platform).
  Sister analysis: Lab52 "Operation MacroMaze"
  (https://lab52.io/blog/operation-macromaze-new-apt28-campaign-using-basic-tooling-and-legit-infrastructure/),
  discovery vector: The Hacker News 2026-08-28. MITRE: T1583.006,
  T1059.003/.005, T1204.002, T1053.005, T1070.004, T1071.001, T1105,
  T1041, T1567.004.

