description: >
  Void Blizzard (Microsoft name; also LAUNDRY BEAR per Dutch AIVD/MIVD, tracked by CERT-UA as UAC-0190)
  spear-phishing campaign against the Defence Forces of Ukraine (SOU), October 2025 to January 2026, documented by
  CERT-UA in advisory CERT-UA#19092 (published 2026-01-12) and mirrored in the Trend Threat Intelligence Feed as
  "Void Blizzard: Advanced Python-Based Campaign" (report--028119cb-3420-428f-917b-5db52cc7aa07, labels
  location:Ukraine, industry:Defence). CERT-UA attributes the activity to UAC-0190 with medium confidence; the Trend
  feed names Void Blizzard without an intrusion-set object. Victimology: individual service members and units of the
  Ukrainian Defence Forces, plus Polish and Moldovan logistics contacts referenced in the lures (Suceava, Chisinau,
  Lodz warehouse lists). Delivery is social engineering over Signal and WhatsApp (T1566.003), impersonating charity
  foundations ("Hart Hulp UA", "Solidarity Help", "Saint Daniel", "Razem UA", "Frontline Help") whose look-alike websites
  host RAR/ZIP archives or direct downloads of PyInstaller-packed executables with double extensions (.pdf.exe,
  .docx.pif, .rtf.pif) (T1204.002, T1036.007). The executables unpack a Python backdoor CERT-UA calls PLUGGYAPE and
  PLUGGYAPE.V2 (T1059.006), which fetches tasking over MQTT (tcp/1883 and tcp/8765) from the C2 servers listed below
  (T1071, T1571) and retrieves follow-on code from paste services (pastebin, ghostbin.axel.org, rentry.co) used as
  dead-drop resolvers (T1102.001). Persistence is a Registry Run key named "RealtekDevice" (T1547.001). Loader
  components Diloader and PLUGGYAPE are the malware objects of the Trend report; PDB path MolineRebuild.pdb is a
  build artifact. Infrastructure roles, all first seen per CERT-UA between 2025-10-25 and 2026-01-15:
  193.23.216.39, 108.165.164.155 and 176.9.23.216 are MQTT C2 servers; 144.31.25.203, 144.31.106.23 and
  144.31.25.222 are download/staging hosts (144.31.25.222 served Docs.rar directly over HTTP); 185.107.74.13 (historical),
  83.217.208.184, 144.31.106.31 and 193.23.199.14 are the hosting addresses CERT-UA recorded for the actor-registered
  charity look-alike domains. Domains: saint-daniel.com/.org/.world, hart-hulp-ua.com, harthulp-ua.com,
  solidarity-help.com/.org, razem-ua.com and frontline-help.com are actor-registered phishing/distribution sites; the
  URLs below are the exact payload paths from the advisory. Omitted pending confirmation: dsns.kiev.ua appears in
  the Trend feed indicator list but not in the CERT-UA advisory and overlaps the naming of the State Emergency Service
  of Ukraine, so it is deliberately excluded from the lists. The paste-service and rentry URLs are legitimate shared
  platforms and are recorded here only: hxxps://pastebin[.]com/raw/5qLz9wAK, hxxps://pastebin[.]com/raw/qAKhdTLq,
  hxxps://ghostbin.axel[.]org/paste/xy359/raw, hxxps://rentry.co/MicrosoftAdvertisingEndpoint. SHA-256 file
  indicators published by CERT-UA, no hash field in this schema, recorded here for the curator (flag for EDR custom
  indicators): 6d54a09e689f20ecd051bd06f7fdd4229d5f955261fb113e2a4a7fb791bb0a62 (Drone positions in warehouse 1
