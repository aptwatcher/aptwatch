description: >
  Gamaredon (FSB-linked) layered VBScript "matryoshka" campaign against Ukrainian
  government, military and law-enforcement targets, analysed by Sekoia.io TDR
  (primary report, infection chain observed January 2026). Weaponised RAR archives
  exploit CVE-2025-8088 (WinRAR path traversal) to drop a GammaPhish HTA, which
  fetches GammaLoad VBScript downloaders; payloads include the GammaWorm USB/share
  propagator and the GammaSteel modular stealer (S3/attacker-server exfil), with
  GammaWipe as an optional destructive payload. C2 resolution uses Dead Drop
  Resolvers on legitimate platforms (Telegram t.me/telegram.me, Telegraph
  graph.org/telegra.ph, teletype.in, Cloudflare workers.dev and trycloudflare.com
  tunnels). Confirmed C2 IP 104.194.140.6 (already curator-attributed to Gamaredon
  in DB, observed 2026-06-11; re-listed as report context anchor).
  Triage note: only attacker-specific hosts are listed under domains
  (quitethepastry.ru = operator-controlled apex per Sekoia; the trycloudflare.com
  and workers.dev hosts are attacker-controlled ephemeral subdomains). The shared
  DDR platform apexes (t.me, telegram.me, graph.org, telegra.ph, teletype.in,
  workers.dev, trycloudflare.com) are intentionally NOT listed as domain IOCs to
  avoid blocklisting legitimate global infrastructure; the path-precise URLs are
  captured under urls instead. File hashes (MD5 GammaPhish
  1794369214b7f62e70a0485e61335c61, GammaWorm 8e1624d110c090ff57d4b493a9107c66)
  are recorded in the daily digest only (flat-IOC schema has no hash table).
  Discovery vector: vendor search leg; sister coverage by The Hacker News
  (https://thehackernews.com/2026/06/gamaredon-exploits-winrar-to-deliver.html)
  and SecurityAffairs.

