author: APTWatch Curator
source: https://www.clearskysec.com/doppelganger-russian-influence-campaign-in-israel/
source_name: ClearSky - Doppelganger Russian influence campaign in Israel (October 2026)

apt_groups:
  - Doppelganger
  - Ruza Flood
  - Storm-1099

description: >
  ClearSky documents renewed activity of the Russian influence operation
  Doppelganger (Ruza Flood / Storm-1099; operated per the US DoJ, September
  2024, by Social Design Agency, Structura National Technology and ANO Dialog)
  against Israel between May and October 2026, ahead of the 2026-10-27
  elections. At least 76 fake articles were published on walla.ist, a site
  impersonating the Walla news outlet. Links are spread on X by auto-generated
  accounts and pass through a redirect chain: per-article redirect domain,
  obfuscated JavaScript stage, central "root domain" (tracking / redirect
  server), then the impersonating site, with geofencing to target countries.
  Root domain rotation: sdgqaef.site (2024), pvolp.pro (until 2026-05-21),
  dwerp.pro (2026-05-21 to 2026-06-02), awlessx.pro (from 2026-08-06), then
  bare IP addresses from early October 2026 (89.124.67.27, then 87.199.201.161;
  hosted at VPS provider vdsina.com, whose parent company vdsina.ru is
  Russia-based). The same root domain also serves sites impersonating
  Ukrainian outlets (unian.st, obozrevatel.st) and campaigns in France and
  Germany. 66 redirect domains were documented: random 8-9 character strings
  under .pro (May 2026), then names of small legitimate-looking sites under
  various TLDs (August 2026), then short .ch domains (September-October 2026);
  ClearSky describes them as set up by the operators. The campaign also aims
  at poisoning AI model crawlers. DISARM techniques: T0098 Establish
  Inauthentic News Sites, T0099 Impersonate Existing Entity, T0090 Create
  Inauthentic Accounts, T0049 Flood Information Space, T0130 Conceal
  Infrastructure. Indicators are taken from Appendix A of the full ClearSky
  report (TLP:CLEAR), linked from the blog post. Influence infrastructure, not
  malware delivery.

