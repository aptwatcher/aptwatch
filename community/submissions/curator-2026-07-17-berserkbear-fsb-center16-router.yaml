# =============================================================
#  Curator submission — FSB Center 16 router-hygiene advisory
#  Author: aptwatch-curator  |  Date: 2026-07-17
# =============================================================
#  AUDIT-TRAIL / CAMPAIGN-SOURCE RECORD.
#
#  Trigger: joint Cybersecurity Advisory AA26-194A (2026-07-13),
#  "Improve Router Hygiene to Protect Against Russian State-
#  Sponsored Targeting" — NSA/CISA/FBI/DC3 + partner agencies from
#  12 countries (19 co-signing bodies). Attributes a decade-plus
#  campaign against poorly configured network devices to Russian
#  FSB Center 16.
#
#  Attribution / campaign mapping (curator): the router/SNMP +
#  Cisco Smart Install cluster in AA26-194A maps to the DB campaign
#  "Berserk Bear / Ghost Blizzard" (id 107, Russian state / FSB),
#  whose aliases already include Static Tundra, Dragonfly, Energetic
#  Bear, Crouching Yeti, Ghost Blizzard, TEMP.Isotope — i.e. the
#  Talos "Static Tundra" cluster. This is the FSB *espionage* unit,
#  deliberately kept DISTINCT from Turla/Secret Blizzard (Snake /
#  Kazuar) and from the GRU groups (Sandworm, APT28), per the
#  advisory's own naming and Cisco Talos. apt_groups[0] is set to
#  the EXACT existing campaign_name so resolve_campaign() matches
#  (no duplicate-campaign creation).
#
#  SCOPE DECISION — why only CVEs are ingested:
#  This is a TTP/mitigation advisory, not an IOC-rich technical
#  report. Its network "indicators" are NOT ingestable:
#    * Source IPs are SPOOFED (ATT&CK T1027) and routed through
#      proxies — blocklisting them would burn forged/innocent
#      addresses. Deliberately EXCLUDED.
#    * Config exfil goes to "actor-controlled leased VPS or a
#      COMPROMISED FTP server" — the advisory does NOT publicly
#      enumerate those hosts, so there are no attacker apex/host
#      IOCs to record. Nothing fabricated.
#    * The config-copy OIDs (1.3.6.1.4.1.9.9.96.1.1.* incl.
#      ...1.1.5 destination) and file names "config.bkp" /
#      "output.txt" are DETECTION SIGNATURES, not IOCs, and the
#      flat-IOC schema has no field for them — recorded in prose.
#    * Historical implants (SYNful Knock, Havex/Dragonfly) carry
#      hashes but are years old and out of the 24h window —
#      recorded in prose only; flat-IOC schema has no hash table.
#
#  Ingested IOCs = the two CVEs the advisory ties to this actor:
#    * CVE-2018-0171 — Cisco Smart Install RCE (CVSS 9.8). Not in
#      apt-intel DB (cves table = 0 matches). NOTE shared-use: also
#      leveraged by Salt Typhoon (Chinese, out of scope) per Talos
#      Feb 2025 — attribution here is to Center 16 for THIS
#      campaign, not exclusivity.
#    * CVE-2008-4128 — Cisco IOS HTTP-admin CSRF (EOL devices only,
#      CVSS 4.3). Added to CISA KEV 2026-07-13, the SAME DAY as the
#      advisory (fresh). Not in apt-intel DB.
#  Both are NEW to the DB (delta, not duplicate); the report adds
#  fresh FSB-Center-16 attribution + KEV linkage.

author: aptwatch-curator

source: https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-194a
source_name: Joint CSA AA26-194A — Improve Router Hygiene to Protect Against Russian State-Sponsored Targeting (2026-07-13)

apt_groups:
  - Berserk Bear / Ghost Blizzard

description: >
  CVEs attributed to Russian FSB Center 16 (tracked as Static Tundra /
  Berserk Bear / Energetic Bear / Dragonfly / Crouching Yeti / Ghost Blizzard)
  by joint Cybersecurity Advisory AA26-194A (2026-07-13, NSA/CISA/FBI/DC3 +
  12-country partners). The advisory describes a decade-plus SIGINT/espionage
  campaign compromising poorly configured routers and network devices: the
  actors scan for SNMP agents accepting default/weak community strings, then
  issue SNMP Set-Requests abusing the Cisco CISCO-CONFIG-COPY-MIB
  (1.3.6.1.4.1.9.9.96.1.1.*) to copy running-config off-box via TFTP (files
  "config.bkp" / "output.txt") to actor-controlled leased VPS or compromised
  FTP servers, then reuse harvested credentials/community strings for follow-on
  access (rogue local accounts, Telnet re-entry, weakened TACACS+ logging, GRE
  tunnels). Primary technique is not a zero-day; occasional exploitation of
  CVE-2018-0171 (Cisco Smart Install RCE, CVSS 9.8, TCP/4786) and the
  EOL-only CVE-2008-4128 (Cisco IOS HTTP-admin CSRF) is cited. CVE-2008-4128
  was added to the CISA KEV catalog on 2026-07-13, the same day as the advisory.
  Discovery vector / sister coverage: Picus Security emerging-threat analysis
  (https://www.picussecurity.com/resource/blog/fsb-center-16-how-russian-hackers-exploit-routers-via-snmp-and-cisco-smart-install,
  2026-07-14); Cisco Talos "Static Tundra" (https://blog.talosintelligence.com/static-tundra/);
  advisory PDF https://media.defense.gov/2026/Jul/09/2003959498/-1/-1/0/CSA_IMPROVE_ROUTER_HYGIENE.PDF.
  SCOPE: only the two CVEs are ingested. Source IPs are SPOOFED and routed
  through proxies (deliberately NOT blocklisted); attacker VPS / compromised
  FTP hosts are not publicly enumerated in the advisory (none recorded rather
  than fabricated); config-copy OIDs + file names are detection signatures, not
  IOCs; SYNful Knock / Havex hashes are years-old and out of window (prose only,
  no hash table in schema). CVE-2018-0171 is shared-use — also leveraged by
  Salt Typhoon (Chinese, out of scope) per Talos — attribution here is to
  Center 16 for this campaign, not exclusivity.

cves:
  - CVE-2018-0171
  - CVE-2008-4128
