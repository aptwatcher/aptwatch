author: aptwatch-curator

source: https://cert.gov.ua/article/6318863
source_name: CERT-UA — UAC-0145 (Sandworm) SopraVPN campaign, full IOC table (delta to 2026-08-11 submission)

apt_groups:
  - Sandworm

description: >
  IOC delta for the Sandworm/UAC-0145 (GRU; APT44 / Seashell Blizzard /
  UAC-0002 ecosystem) fake-recruiter "SopraVPN" trojanized-WireGuard campaign
  first recorded in curator-2026-08-11-sandworm-sopravpn-recruiter.yaml.
  Adds the infrastructure from the full CERT-UA IOC table (article/6318863)
  as reproduced by Cyber Security News on 2026-08-12: payload-delivery domain
  douncloud[.]site (Windows scheduled-task next-stage URL under
  /sitedatastorageadvanced/ with ?subid=%UUID%---%MACHINE% templating),
  WireGuard VPN endpoint 139.28.36[.]23 (udp/51820, Linux next-stage pulled
  through the tunnel), attacker-registered lure apexes atlasgroup-ua[.]com
  (fictitious recruiter "Atlas Business Group") and soprasteriabg[.]com
  (typo-twin of soprasteria-bg[.]com), sender mailboxes
  alex.boichenkoit@ukr[.]net and mike.weitzman@soprasteria-bg[.]com, and
  path-precise SourceForge download URLs for the trojanized client.
  soprasteria-bg.com re-listed as context anchor (expected duplicate).
  Real Sopra Steria / SourceForge / ukr.net platforms NOT compromised;
  shared-platform apexes deliberately excluded. SHA-512 hashes and Telegram
  handle recorded in comments/digest only (no hash schema). Discovery
  vector: BleepingComputer + The Hacker News RSS (2026-08-11/12).
  Sister coverage: https://cybersecuritynews.com/sandworm-fake-job-interviews/ ;
  https://thehackernews.com/2026/08/sandworm-linked-uac-0145-uses-fake-job.html ;
  https://www.bleepingcomputer.com/news/security/sandworm-hackers-target-it-pros-with-trojanized-wireguard-vpn-client/

