author: aptwatch-curator

source: https://cert.gov.ua/article/6318863
source_name: "CERT-UA #6318863 — Social engineering by UAC-0145 (Sandworm): compromise during the hiring process (2026-08-08)"

apt_groups:
  - Sandworm
  - APT44
  - Seashell Blizzard
  - UAC-0145
  - UAC-0002

description: >
  One attacker-registered impersonation domain tied to a Sandworm (GRU / APT44 /
  Seashell Blizzard, tracked by CERT-UA as UAC-0145, a sub-cluster of UAC-0002)
  fake-recruitment campaign disclosed in CERT-UA advisory #6318863 (2026-08-08).
  Running since at least May 2026, the operators mine legitimate Ukrainian job
  boards for system administrators and other IT specialists, review CVs, then
  pose as recruiters (in one case impersonating "Atlas Business Group" hiring for
  a project involving Sopra Steria Bulgaria). Contact starts in a job-site chat,
  moves to a Telegram "HR" screening, then an English-language Zoom interview.
  The victim is emailed instructions to connect to a "corporate network" over
  WireGuard for a test assignment; when the supplied config fails, the recruiter
  steers them to download a custom client, "SopraVPN," hosted on SourceForge and
  linked from a fake Sopra Steria site (soprasteria-bg.com). SopraVPN is built
  from legitimate WireGuard open-source code but modified so malicious commands —
  some encrypted and embedded in the VPN .conf files to evade casual inspection —
  execute covertly on Windows and Linux, enabling follow-on payload retrieval.
  The spoofed sender email was crafted to resemble a regional Sopra Steria office.
  This is a DISTINCT vector from the 2026-07 UAC-0145 ClickFix/typosquat activity
  (no IOC overlap). Discovery vector / sister coverage: CERT-UA feed (RSS leg);
  The Record "Russian military hackers pose as recruiters to target Ukrainian IT
  workers" (https://therecord.media/russian-military-hackers-pose-as-recruiters-ukraine-it-workers,
  2026-08-10, Daryna Antoniuk). Enrichment: soprasteria-bg.com registered
  2026-07-16 (Namecheap / Cloudflare NS / Withheld-for-Privacy, Iceland), VT 4/91
  malicious. SCOPE: only the attacker-registered lure apex is ingested;
  sourceforge.net is a shared-platform host deliberately NOT blocklisted; the
  attacker's SourceForge project URL, Telegram handle and spoofed email were not
  publicly disclosed in accessible sources (not fabricated); the full CERT-UA
  #6318863 IOC table should be pulled directly and merged on import if it lists
  additional infrastructure.

domains:
  - soprasteria-bg.com
