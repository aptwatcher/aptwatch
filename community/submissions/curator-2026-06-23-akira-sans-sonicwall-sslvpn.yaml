description: >
  Improper access-control flaw CVE-2024-40766 (CVSS 9.3) in SonicWall SonicOS
  affecting the management interface and SSLVPN service on Gen 5, Gen 6 and Gen 7
  firewalls (Gen 5 <= 5.9.2.14-12o, Gen 6 <= 6.5.4.14-109n, Gen 7 <= 7.0.1-5035).
  Successful exploitation grants unauthorized access to the firewall and, under
  certain conditions, crashes the device. Akira ransomware affiliates (and the Fog
  group, not on APT Watch) have exploited the flaw for initial access via SSLVPN
  accounts since at least September 2024, when Arctic Wolf first reported it.
  Macnica (Dec 2024) confirmed roughly half of organisations on Akira/Fog leak
  sites ran SonicWall and that at least 48,933 devices remained publicly exposed
  and unpatched. A renewed surge against Gen 7 firewalls was reported in
  July-August 2025 by Arctic Wolf, Huntress and Bitdefender, with corroborating
  analyses from Rapid7 (Sep 2025) and Darktrace (Oct 2025); split observed
  roughly 75% Akira / 25% Fog. SonicWall investigated suspected zero-day activity
  and confirmed with high confidence that intrusions still correlated with
  CVE-2024-40766 — the patch fixed the bug but many organisations never reset the
  underlying configuration (local SSLVPN account credentials carried over).
  MITRE ATT&CK candidates: Exploit Public-Facing Application (T1190), Valid
  Accounts (T1078), External Remote Services (T1133). Companion sources: ISC SANS
  diary by Manuel Humberto Santander Pelaez (2026-06-23,
  https://isc.sans.edu/diary/rss/33094), Arctic Wolf, Macnica, Huntress,
  Bitdefender, Rapid7, Darktrace. The ISC SANS diary carried no IOCs, but network
  IOCs were extracted from the Arctic Wolf "Smash and Grab" report
  (https://arcticwolf.com/resources/blog/smash-and-grab-aggressive-akira-campaign-targets-sonicwall-vpns/):
  43 IPv4 addresses populated below (SSLVPN client-login source IPs on commercial
  VPS/hosting ASNs — Clouvider, BlueVPS, DigitalOcean, Hivelocity, QuadraNet,
  ReliableSite, RouterHosting, etc. — plus 170.130.165.42 = C2 [VT 9/91 malicious,
  Eonix AS62904] and 162.210.196.101 / 206.168.190.143 = exfiltration). Note per
  project lifecycle policy: VPS client-login IPs are ephemeral (commercial-VM churn)
  and should decay faster than durable APT infrastructure. Arctic Wolf also published
  BYOVD file hashes not storable in this schema: SHA256
  16f83f056177c4ec24c7e99d01ca9d9d6713bd0497eeedb777a3ffefa99c97f0 (rwdrv.sys /
  churchill_driver.sys), SHA256
  bd1f381e5a3db22e88776b7873d4d2835e9a1ec620571d2b1da0c58f81c84a56 (hlpdrv.sys),
  SHA1 385c235f9f52c68ec4adc7ee07de26b84b108116 (check_hvci_admin.bat). The BYOVD
  loader excludes ru-RU and ru-BY locales, consistent with a Russian-speaking
  ecrime operation. Signalé par le skill analyse-veille-securite-rss (run
  2026-06-24).

