# Midnight Blizzard CaptiveCrunch (Storm-2945) — captive-portal hijack
# campaign against travelers, Microsoft Threat Intelligence 2026-07-31
#
# NEW SUB-CAMPAIGN: Storm-2945 is a Midnight Blizzard (APT29/SVR) sub-cluster
# per Microsoft. Deliberately NOT attached to the existing 'APT29 / Cozy Bear'
# or 'Earth Koshchei' campaigns: 'Midnight Blizzard' is an alias of BOTH
# (ambiguous alias — loader would refuse), and CaptiveCrunch is distinct
# tracked activity. 'Midnight Blizzard' intentionally NOT added as an alias
# here to avoid a three-way alias collision.
#
# Hashes logged in the 2026-08-18 digest only (no hash table in flat schema):
# CornFlake SHA-256 918fa52a..., ChocoShell SHA-256 be998574...

author: APTWatch Curator
source: "https://www.microsoft.com/en-us/security/blog/2026/07/31/captivecrunch-midnight-blizzard-targets-travelers-worldwide-for-malware-delivery-and-credential-theft/"
source_name: "Microsoft Threat Intelligence: CaptiveCrunch — Midnight Blizzard targets travelers worldwide for malware delivery and credential theft"

apt_groups:
