description: >
  Backfill of Microsoft Threat Intelligence's 2026-07-31 CaptiveCrunch report.
  Storm-2945, a sub-cluster of Midnight Blizzard (APT29 / SVR), hijacks hotel
  and conference captive portals since early May 2026, answering OS/browser
  connectivity checks with fake update pages (ClickFix paste-and-run, some
  APK delivery) and, from 2026-07-16, device-code-flow phishing against
  genuine Microsoft sign-in. Implants: CornFlake (Go RAT, service name
  "Cloud Sync Service"), ChocoShell (in-memory PowerShell infostealer, AMSI
  bypass, steals M365 SSO tokens / cookies / Wi-Fi creds), FruitStone C2
  panel. Domains are attacker-registered Microsoft-lookalikes (malicious):
  ms365-device.com and ms365-live.com are device-code-flow redirects;
  m365-owa.com and owa-ms365.com are AitM infrastructure. IPs are AitM
  servers, CaptiveCrunch DNS resolvers and ChocoShell C2 per the report's IOC
  table (107.189.26.194 already in DB unattributed at 0.0 — this report adds
  attribution). No CIDR claimed by the report. Sister coverage: ReliaQuest
  2026-07-23
  (https://reliaquest.com/blog/threat-spotlight-dns-poisoning-tactics-expand-to-hospitality/),
  Zscaler ThreatLabz, Infosecurity Magazine 2026-08-03 (discovery vector).

domains:
