# Consumer router botnet C2 — vendor-curated firewall blocklist
#
# IOCs extracted first-hand from self-blocking OUTPUT firewall rules
# embedded by a consumer router vendor's security daemon in its stock
# firmware (domains decoded from the DNS wire format used in the
# packet-match rules). This is a vendor-curated C2 blocklist that the
# device enforces against itself; the vendor ships it to neutralize
# known router-botnet C2 infrastructure.
#
# Not APT-attributed: campaign below is a tracking bucket for this
# vendor blocklist source, not a threat-actor attribution. Curator
# considers this source authoritative — IOCs must reach the published
# aptw-* blocklists (hence attributed path, not the Unattributed
# sentinel whose domains never reach the >= 0.50 publication bar).

