author: APTWatch Curator
source: https://socradar.io/blog/cyberxero-ai-iab-ukraine-critical-infrastructure/
source_name: "SOCRadar STRU - CyberXero: An AI-Augmented Initial Access Broker Targeting Ukrainian Critical Infrastructure (October 2026)"

apt_groups:
  - CyberXero

description: >
  SOCRadar Threat Research Unit (STRU) report published in early October
  2026 documenting CyberXero, the underground-forum alias (Dread, HackForums,
  Exploit.in) of a Russian-speaking, financially motivated Initial Access
  Broker active since at least July 2026. Attribution to a single operator is
  established by SOCRadar from the operator's own exposed workstation; the
  Russian-speaking assessment rests on Russian-language prompts and session
  logs recovered from that workstation. SOCRadar describes the operation as
  profit-driven and does not assert state sponsorship or state direction, and
  no evidence of an actual access sale was recovered, so this entry is
  submitted as ecrime / initial-access-broker with a Ukraine critical
  infrastructure focus, not as a Russia-nexus state actor. Discovery: an HTTP
  server at 46.21.250.135 (AS204601, Zomro NL) exposed as an open directory
  with no access control, holding the working directory of the operator's
  Linux workstation (more than 90,000 files in roughly 3,000 subdirectories:
  per-target engagement folders, exploitation toolkits, reconnaissance
  output, AI agent configurations, session logs, victim database exports).
  Two parallel pipelines run from the same operator. The opportunistic
  pipeline mass-exploits WordPress, Magento and PrestaShop worldwide for
  access and payment data using an in-house tool named wp2shell (WordPress
  REST API batch endpoint chain CVE-2026-63030 primary and CVE-2026-60137
  secondary), time-based SQL injection with anti-detection against Support
  Board 3.8.7 (CVE-2026-4815, CVSS 8.8), and a Magento CE cluster of roughly
  93 domains tested against CVE-2015-1397; a single automated run scanned
  4,708 targets, confirmed access to 429 WordPress administration panels and
  deployed 32 shells in a 61-second window. The directed pipeline runs
  curated reconnaissance (masscan, nuclei, wpscan; enumeration of 95
  subdomains) and manual exploitation against seven Ukrainian energy and
  utilities entities, including the national transmission system operator
  and the country's largest private energy holding; more than 628,000
  Ukrainian individuals (including Kharkiv residents) have confirmed data in
  the actor's possession, with further confirmed or attempted activity in
  Poland, China and Pakistan. AI augmentation layer: up to 51 specialized
  Claude Code agents on the primary workstation for reconnaissance,
  exploitation and post-exploitation, plus a PentAGI deployment wired into a
  Cobalt Strike 4.9.1 Team Server (unauthorized Pwn3rs Team build) through an
  AI provider API for payload generation and pentest execution; session logs
  show repeated false ownership claims ("my own site") to bypass model
  refusals and session re-opening after refusals, with mixed success. TTPs
  (MITRE ATT&CK candidates): active vulnerability scanning (T1595.002), DNS
  enumeration of victim infrastructure (T1590.002), tool and exploit
  acquisition within 30 days of disclosure (T1588.002, T1588.005), exploit
  public-facing application including WAF bypass (T1190), AI-orchestrated
  software deployment via PentAGI (T1072), web shell persistence with WSO and
  wp2shell registered as an active WordPress plugin (T1505.003), rogue local
  administrator accounts (T1136.001). Infrastructure roles from the SOCRadar
  IOC table: 46.21.250.135 primary workstation and open-directory seed node
  (AS204601, Zomro NL); 42.193.227.214 Cobalt Strike Team Server and PentAGI
  on port 9995 (AS45090, Tencent Cloud) with beacon HTTPS on port 1002, HTTP
  staging on port 8044 and PowerShell IEX stager delivery on port 8033;
  42.193.100.94 Redis exploitation node and PentAGI agents (AS45090, Tencent
  Cloud). Hunting pattern: rogue WordPress administrator usernames matching
  wp2_ followed by eight hexadecimal characters are created by wp2shell, not
  by legitimate users. SHA-256 file indicators published by SOCRadar, no hash
  field in this schema, recorded here for the curator:
  a5ae0aab352871bc0b038b3aa43b03eb223425628c884af7b9fc592cd34eb86c
  (WSO-Shell.php, WSO web shell obfuscated with R00t-Shell.com 2.0.15,
  undetected at analysis time). MS17-010 (EternalBlue) appears in the
  workstation only as a patch-verification check on a Chinese network with
  no confirmed exploitation and is not submitted. The full SOCRadar PDF
  (node-by-node infrastructure walkthrough, Chinese-cluster Cobalt Strike
  operation, PentAGI model configuration, full indicator set) is at
  https://socradar.io/resources/report/cyberxero-threat-research-report/ and
  may contain additional IOCs not reproduced in the blog table. Companion
  coverage: https://securityaffairs.com/200803/cyber-crime/cyberxero-used-51-ai-agents-to-steal-628000-ukrainian-records.html,
  https://gbhackers.com/cyberxero-uses-ai-agent-swarm/,
  https://cyberpress.org/cyberxero-weaponizes-ai-agents/,
  https://research.checkpoint.com/2026/12th-october-threat-intelligence-report/.
  APTWatch batch lookup query_id qry_01M4TZ2PFHVW3WZ1D21W2JRXNB (2026-10-13,
  min_confidence low): all three IPv4 and the SHA-256 returned result_count 0
  with no infrastructure context, and CyberXero is absent from the /actors
  list (ETag sha256-587e053a39031f94, last_updated 2026-08-24), so this is a
  new actor entry. Related Defender TA report: OSINT Profile: CyberXero: An
  AI-Augmented Initial Access Broker Targeting Ukrainian Critical
  Infrastructure, GUID d7d164e1-8820-4120-811a-803d0d3546c2, Tools &
  techniques, published and updated 2026-10-07. Flag originated from the
  analyse-ms-threat-analytics skill run of 2026-10-08 (report classified OUT
  OF SCOPE for STTR, surfaced as an APT Watch watchlist candidate on
  2026-10-13 by the curator on the Russian-speaking IAB criterion, category
  ransomware_crime_ops).

