# Curator submission — APT28 / Forest Blizzard "Operation Neusploit" network infrastructure
# Primary source: Zscaler ThreatLabz, published 2026-02-02 (NOT a last-24h find).
# PROVENANCE / DATING NOTE: this is a deliberate DELTA closing a gap left by the
# 2026-06-11 run. That run produced curator-2026-06-11-apt28-pixynetloader.yaml which
# captured ONLY CVE-2026-21509, listing Zscaler "Operation Neusploit" as sister coverage
# but NOT extracting its network IOCs. The two attacker-registered domains + three dropper
# URLs below were confirmed ABSENT from the DB (intel_batch_lookup 2026-06-12 = 0 matches
# on all five) and are clean, attacker-owned APT28 infrastructure, so they are ingested now.
# This is a backfill delta, not new threat intel from the 2026-06-12 24h window
# (which was dry — see threat-hunt-2026-06-12.md).
# confidence_score intentionally omitted -> loader assigns curator 1.0.

author: aptwatch-curator
source: https://www.zscaler.com/blogs/security-research/apt28-leverages-cve-2026-21509-operation-neusploit
source_name: Zscaler ThreatLabz - APT28 Operation Neusploit (CVE-2026-21509)

apt_groups:
  - APT28
  - Forest Blizzard
  - Fancy Bear
  - Sednit

description: >
  APT28 (GRU Unit 26165 / Forest Blizzard) "Operation Neusploit" network
  infrastructure. Zscaler ThreatLabz (2026-02-02) documented a campaign first
  seen in-the-wild 2026-01-29 (Microsoft patched the underlying flaw
  2026-01-26) targeting Central/Eastern Europe (Ukraine, Slovakia, Romania)
  with weaponized RTF files exploiting CVE-2026-21509. The chain delivers a
  dropper DLL from attacker infrastructure that deploys either MiniDoor (an
  Outlook VBA email stealer, a stripped variant of NotDoor reported by Lab52)
  or PixyNetLoader (-> Covenant Grunt via PNG-LSB steganography, C2 over the
  legitimate Filen API). The threat actor used server-side evasion, returning
  the malicious DLL only to requests from the targeted geography bearing the
  correct User-Agent.
  This YAML captures the two attacker-registered apex domains and the three
  dropper-hosting URLs from Zscaler's IOC table. freefoodaid[.]com and
  wellnesscaremed[.]com are vendor-classified MALICIOUS (attacker-registered
  lure apexes hosting droppers at attacker-controlled paths /documents/ and
  /tables/); despite charity/clinic-sounding names there is no legitimate-business
  signal, so they go under domains:, not compromised_domains:. CVE-2026-21509 is
  re-listed as the exploit context anchor (loader is monotonic; duplicate is safe).
  Sister coverage: ExaTrack "Tracking APT28 PixyNetLoader" (2026-06-01, ingested
  2026-06-11 as the CVE-only package); Trellix "APT28 Stealthy Multi-Stage
  Campaign" (2026-02-04); Sekoia "Operation Phantom Net Voxel" (2025-09);
  CERT-UA / SecurityWeek coverage. The ~30 SHA256/SHA1/MD5 file hashes and host
  artifacts (COM CLSID {D9144DCD-E998-4ECA-AB6A-DCD83CCBA16D}, EhStoreShell.dll,
  SplashScreen.png, office.xml, OneDriveHealth scheduled task) are logged in the
  daily digest only (flat-IOC schema has no hash table).
  ATTRIBUTION NOTE: apt_groups[0] set to 'APT28' to match the 2026-06-11 APT28
  YAML for consistency. The watchlist canonical common_name is 'Forest Blizzard'
  (APT28 is an alias). Confirm the exact campaigns.campaign_name (APT28 vs Forest
  Blizzard) in the DB before import and align BOTH APT28 YAMLs to it -- the loader
  matches apt_groups[0] exactly and a near-miss creates a duplicate campaign.

domains:
  - freefoodaid.com
  - wellnesscaremed.com

urls:
  - https://freefoodaid.com/documents/2_2.d
  - https://freefoodaid.com/tables/tables.d
  - https://freefoodaid.com/documents/2_2.lNk

cves:
  - CVE-2026-21509
