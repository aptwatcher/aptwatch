author: aptwatch-curator

source: https://www.proofpoint.com/us/blog/threat-insight/ta458-roundpress-exploits
source_name: Proofpoint — Operation RoundPress Rolls on with More Half-Click Webmail Zero-Days from TA458 (2026-07-23)

apt_groups:
  - TA458
  - Operation RoundPress
  - SpyPress

description: >
  Six SpyPress command-and-control domains and six webmail-exploitation CVEs
  attributed to TA458, a Russia/GRU-aligned espionage cluster behind Operation
  RoundPress, per Proofpoint Threat Insight (2026-07-23). TA458 uses "half-click"
  cross-site-scripting (XSS) exploits in webmail software — the victim need only
  open a malicious email in their webmail viewer — to deploy SpyPress, an obfuscated
  JavaScript stealer (customized Obfuscator.IO since Feb 2026) that steals
  credentials, contacts and emails. On Roundcube and mDaemon, SpyPress swaps to
  interactive backdoors for long-term access, chaining Roundcube deserialization RCE
  (CVE-2025-49113) to drop PHP webshells and open reverse shells to actor C2.
  Confirmed exploited vulnerabilities: CVE-2025-27915 (Zimbra 0day), CVE-2025-3929
  (mDaemon 0day), CVE-2023-43770 + CVE-2024-42009 (Roundcube n-day), CVE-2026-8496
  (SOGo 0day, patched in SOGo 5.12.8), CVE-2025-49113 (Roundcube deserialization RCE).
  Targeting: Ukrainian government + Eastern European military/government (Albania,
  Greece, Moldova, Türkiye), with outlier chemical/telecom/technology. Proofpoint
  assesses TA458 as DISTINCT from APT28/TA422 (possibly GRU Unit 20728). Companion
  primary: NSA CSA (https://media.defense.gov/2026/Jul/22/2003965244/-1/-1/1/CSA_RUSSIA_PHISHING_TARGET_ZIMBRA.PDF)
  and ESET Operation RoundPress (https://www.welivesecurity.com/en/eset-research/operation-roundpress/).
  NOTE (curator): NEW campaign — do not merge into APT28; 7 exploit-email SHA256
  hashes are in the digest only (no hash table in the flat-IOC schema). DISTINCT from
  the Void Blizzard/Laundry Bear/TA488 Zimbra CVE-2025-66376 cluster (companion YAML).

domains:
  - share-ya.space
  - xwe.us
  - hgmydr.wiki
  - xsza.net
  - zxzaq.com
  - upgybj.store

cves:
  - CVE-2025-27915
  - CVE-2025-3929
  - CVE-2023-43770
  - CVE-2024-42009
  - CVE-2026-8496
  - CVE-2025-49113
