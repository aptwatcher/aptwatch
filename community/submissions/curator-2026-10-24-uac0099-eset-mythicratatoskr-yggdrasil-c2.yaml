# Curator YAML — UAC-0099 / Sandworm collaboration: MythicRatatoskr Yggdrasil-hosted C&C (ESET, 2026-10-21)
# Written 2026-10-24 (daily hunt). Primary: ESET Research WeLiveSecurity, published 2026-10-21/22; ESET IoC repo
# github.com/eset/malware-ioc/tree/master/mythicratatoskr (commit 2026-10-21). Discovery vector: The Hacker News
# news-sitemap (rss_discovery.py hit "Russia-Linked Hackers Used New Mesh Network Backdoor", 2026-10-23).
# apt_groups[0] matches the DB campaign_name EXACTLY (id 103). Sandworm (id 6) is the hand-off / wiper actor and is
# deliberately NOT listed as an alias here (ambiguous-alias trap: "Sandworm" belongs to campaign 6) — see description.
# IPv6 normalization: ESET's IoC table prints the C&C as "b479:2771:8df4:b5eb:d007:63b0[:]2838" (leading hextet
# dropped); the report body and Table 2 give the full Yggdrasil address 201:b479:2771:8df4:b5eb:d007:63b0:2838
# (200::/7 range). The full form is used here. The URL is the embedded default C&C URL from Table 2 (HTTPS :443);
# the reverse-SOCKS endpoint is the same address on :8080 (not a URL — noted only).
# The address is an Yggdrasil mesh overlay address (not internet-routable): it is a host/EDR hunting indicator
# (process connecting via a yggstack user-space stack), not a perimeter-blocklist entry. The 32 public Yggdrasil
# peers embedded in the samples are legitimate volunteer nodes and are NOT ingested (shared-platform rule).
# Hashes (digest-only): 12 SHA-1 (10x MythicRatatoskr WinGo/Agent.ZO, 2x SOCKS5 server WinGo/Agent.AOK /
# WinGo/TrojanProxy.Agent.I) — flat-IOC schema has no hash table.
author: APTWatch Curator
source: https://www.welivesecurity.com/en/eset-research/mythicratatoskr-yggdrasil-enabled-backdoor-deployed-uac0099-sandworm-collaboration/
source_name: "ESET Research — MythicRatatoskr: An Yggdrasil-enabled backdoor deployed in a UAC-0099–Sandworm collaboration (2026-10-21)"

apt_groups:
  - UAC-0099 MATCHBOIL Family (Gamaredon-coop)

description: >
  ESET Research (Anton Cherepanov, Peter Strycek) documents a 2025 intrusion at a
  Ukrainian logistics / grain company: UAC-0099 (TrendAI Earth Sirrush) obtained
  initial access on 2025-07-16 via a spearphishing attachment that deployed the
  MATCHBOIL downloader and MATCHWOK backdoor, then on 2025-07-17 deployed a
  previously undocumented Go backdoor, MythicRatatoskr, attributed to either
  UAC-0099 or Sandworm. Access was handed off to Sandworm (APT44 / Seashell
  Blizzard, DB campaign "Sandworm"), which carried out a data-wiping attack on
  2025-09-17 by pushing SDelete through Active Directory Group Policy. This is
  the first ESET-documented case of a state-aligned actor hosting C&C inside the
  Yggdrasil peer-to-peer mesh network: MythicRatatoskr embeds yggstack (user-space
  Yggdrasil), joins the public mesh through 3 of 32 hardcoded public peers, and
  talks HTTPS/JSON (checkin, tasking, result, getfile) to the C&C at
  201:b479:2771:8df4:b5eb:d007:63b0:2838 on :443, with a reverse SOCKS5 proxy
  (revsocks-derived) to the same address on :8080; some samples add a 10-minute
  start-up delay. A separate Go SOCKS5 server (bindProxy, listening 127.0.0.1:33690)
  was also deployed. Host artifacts: krbtman.exe, ieupdate.exe, updater.exe,
  windowsdefendersvc.exe, OneDriveLiveUpdater.exe, Act64.exe, nbtresolver.exe;
  encrypted config at C:\Windows\Temp\.updatecache, C:\Windows\system32\.updatecache,
  %LocalAppData%/Temp/.crond (Unix-style path suggests a Linux variant exists);
  hardcoded check-in UUID d71f1722-cf0b-4e27-9f8e-c95ec9b24a23. The C&C IPv6 is an
  Yggdrasil overlay address derived from the operator's Ed25519 key, so it is a
  host-telemetry indicator rather than a routable blocklist entry; ESET notes that
  blocking the public Yggdrasil peer addresses is a viable mitigation, but those
  peers are legitimate community nodes and are deliberately excluded here.
  Cross-campaign linkage: confirms the UAC-0099 -> Sandworm initial-access hand-off
  model ESET first described in its APT Activity Report Q2-Q3 2025 (government,
  energy, logistics, grain targets in Ukraine). Sister coverage: The Hacker News
  2026-10-23 (discovery vector). MITRE: T1566.001, T1059.003, T1543.003, T1027.013,
  T1678, T1113, T1005, T1090.001, T1090.003, T1573, T1105, T1071.001, T1132.001,
  T1041, T1485.

ipv6:
  - 201:b479:2771:8df4:b5eb:d007:63b0:2838

urls:
  - https://[201:b479:2771:8df4:b5eb:d007:63b0:2838]
