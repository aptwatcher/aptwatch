author: aptwatch-curator

source: https://cert.gov.ua/article/6318634
source_name: CERT-UA #6318634 — Fake Notepad++ plugin delivers MATCHBOIL.V2 (UAC-0099), reported 2026-07-23

apt_groups:
  - UAC-0099 MATCHBOIL Family (Gamaredon-coop)
