  - LUNCHPOKE

description: >
  One CVE attributed to the Russia-aligned cluster UAC-0099 by CERT-UA advisory
  #6318634 (reported 2026-07-23/24). UAC-0099 shifted delivery to a trojanized
  Notepad++ plugin: a phishing email with an image attachment opens a
  link-shortener URL that pulls a ZIP from a file-sharing service (e.g.
  EasySend[.]co) containing a VBScript disguised as a PDF (double extension with
  padded spaces, e.g. "Zavodskyi rayon.pdf .vbs"). The VBS shows a decoy PDF and
  silently fetches "Evernote.zip", which bundles a full legitimate Notepad++
  v8.8.3, a malicious NppExport.dll (LUNCHPOKE), a password-protected updater.rar
  and a legitimate winrar.exe. LUNCHPOKE unpacks the RAR to a randomized
  %PUBLIC%\Libraries directory and schedules RemoteLibUpdater.exe (BURNYBEAR) to
  run every three minutes; BURNYBEAR loads InitTest.dll (MATCHBOIL.V2, a C#
  loader for secondary payloads) and, if launched without arguments, runs a
  RAM/CPU exhaustion routine as an anti-analysis/sandbox check. The only
  ingestible flat IOC is CVE-2025-56383 (Notepad++ v8.8.3 DLL-hijack, the exact
  bundled version), cited by CERT-UA though disputed by the Notepad++ team; it is
  NEW to the DB. SCOPE: easysend.co is a legitimate shared file-transfer platform
  abused as a lure host and is deliberately NOT blocklisted; the link shortener
  and C2 address were not enumerated by CERT-UA (none fabricated); malware/file
  artifacts (NppExport.dll/LUNCHPOKE, RemoteLibUpdater.exe/BURNYBEAR,
  InitTest.dll/MATCHBOIL.V2, scheduled-task and drop-dir names) are detection
  signatures recorded in the digest only (no filename/hash table in the flat-IOC
  schema). Discovery vector / sister coverage: The Hacker News
  (https://thehackernews.com/2026/07/fake-notepad-plugin-delivers.html,
  2026-07-24), BleepingComputer
  (https://www.bleepingcomputer.com/news/security/hackers-abuse-notepad-plus-plus-plugins-to-stealthily-install-malware/,
  2026-07-23), Security Affairs
  (https://securityaffairs.com/195923/cyber-warfare-2/uac-0099-is-now-hiding-malware-inside-a-fake-notepad-plugin-to-target-ukrainian-organizations.html,
  2026-07-24). Note: BleepingComputer links UAC-0099 to APT44/Sandworm as an
  initial-access provider; the existing DB campaign labels the coop as Gamaredon
  — nuance flagged in the digest, not resolved here.

cves:
  - CVE-2025-56383
