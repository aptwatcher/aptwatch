# Curator submission — Berserk Bear / Ghost Blizzard — DynoWiper incident network IOCs (CERT-PL)
# Primary source: CERT Polska "Energy Sector Incident Report – 29 December 2025"
# (published 2026-01-30), network-IOC table. Supplemented by ESET WeLiveSecurity
# 2026-01-30 "DynoWiper update: Technical analysis and attribution" for 31.172.71.5
# provenance (first seen 2024-10-27, compromised ProGame progamevl[.]ru server,
# Fornex Hosting).
#
# ATTRIBUTION NOTE — confidence_score 0.70 by curator decision 2026-06-12, NOT
# curator 1.0: CERT-PL's attribution is INCIDENT-LEVEL to a vendor-name cluster
# (Static Tundra / Berserk Bear / Ghost Blizzard / Dragonfly) via intrusion-
# infrastructure overlap, and the DynoWiper malware attribution is CONTESTED
# (ESET: Sandworm, medium confidence). Companion SQL bundle
# deploy/wipers-zov-dynowiper-2026-06-12/ carries the hash set, the
# attribution_sources rows, the recorded dissent, and the
# historical_first_observed UPDATE for 31.172.71.5 (run/re-run it AFTER this
# YAML is ingested so the ipv4_iocs row exists).
#
# apt_groups[0] is the exact campaigns.campaign_name of #107 (verified in DB
# 2026-06-12). 'Static Tundra' and 'Dragonfly' are already aliases of #107;
# listed in apt_groups[1:] only as the vendor names used by the source report.
# No new aliases introduced.

author: aptwatch-curator
source: https://cert.pl/en/posts/2026/01/incident-report-energy-sector-2025/
source_name: CERT Polska - Energy Sector Incident Report - 29 December 2025
confidence_score: 0.70

apt_groups:
  - Berserk Bear / Ghost Blizzard
  - Static Tundra
  - Dragonfly

description: >
  Network infrastructure from the CERT Polska incident report on the 29-30
  December 2025 destructive attack against Polish energy-sector entities
  (DynoWiper A/B, LazyWiper, GPO distribution) — the first publicly described
  destructive operation attributed to the Static Tundra (Cisco) / Berserk Bear
  (CrowdStrike) / Ghost Blizzard (Microsoft) / Dragonfly (Symantec) cluster,
  via intrusion-infrastructure overlap. Roles per the report's network-IOC
  table: 185.200.177.10 — VPN + M365 logins across multiple entities AND
  direct DynoWiper execution, Dec 2025 (COMPROMISED third-party server);
  31.172.71.5 — reverse proxy for exfiltration on ports 50443/8008/44445
  (COMPROMISED server: ProGame progamevl[.]ru, Fornex Hosting, per ESET first
  seen 2024-10-27 — durable date carried in historical_first_observed below
  and set in ipv4_iocs by the companion SQL bundle); 193.200.17.163 — VPN
  logins, multiple entities, Nov 2025 (COMPROMISED server); 185.82.127.20 —
  VPN logins, Nov 2025; 41.111.178.225 — VPN logins, Nov 2025; 72.62.35.76 —
  VPN + O365 logins, Dec 2025 (COMPROMISED server); 89.116.111.143 — VPN
  logins, Dec 2025; 194.61.121.178 — VPN logins, Dec 2025; 159.69.50.242 —
  VPN logins, Nov + Dec 2025. The flat schema has no compromised flag for
  IPs (compromised_domains: covers domains only), so the four COMPROMISED
  third-party servers are flagged here in the description — treat them as
  victim relays, not actor-owned infrastructure, when building blocklists.
  ATTRIBUTION CONTENTION: ESET attributes the DynoWiper malware itself to
  Sandworm (medium confidence); curator arbitration 2026-06-12 keeps the
  incident set on this campaign with the dissent recorded (see
  deploy/wipers-zov-dynowiper-2026-06-12/AUDIT-NOTES.md). The DynoWiper /
  LazyWiper / GPO-script hashes are in the companion SQL bundle (flat-IOC
  schema has no hash table). Excluded by discipline: Rubeus/rsocx public
  tools; esetsmart/esetscanner/esetremover domains (InedibleOchotense /
  Kalambur — different actor, follow-up lead); Sting wiper (no public hash —
  coverage gap).

ipv4:
  - 185.200.177.10
  - 31.172.71.5
  - 193.200.17.163
  - 185.82.127.20
  - 41.111.178.225
  - 72.62.35.76
  - 89.116.111.143
  - 194.61.121.178
  - 159.69.50.242

# Durable first-observation date (CLAUDE.md "Ingest a historical IP" procedure):
# survives a from-scratch rebuild via re-ingest of this YAML. The loader ignores
# this field today; the companion SQL bundle step 04 writes the column.
historical_first_observed:
  31.172.71.5: '2024-10-27'
