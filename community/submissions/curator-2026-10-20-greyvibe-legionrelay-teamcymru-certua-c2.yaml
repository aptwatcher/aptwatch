description: >
  Team Cymru (Will Thomas, 2026-10-14) consolidated the LegionRelay C2 set of
  the Russia-aligned GREYVIBE intrusion set (WithSecure) with CERT-UA's UAC-0247
  advisory (https://cert.gov.ua/article/6288271, March-April 2026 campaign
  against Ukrainian local government and municipal healthcare under a
  humanitarian-aid lure) and pivoted on the shared infrastructure fingerprint
  (AS26383, TCP/8000, "France Education" open-port banner, Uvicorn ASGI server,
  identical LegionRelay C2 login page) to surface five previously unreported C2
  servers. LegionRelay is a PowerShell RAT (REST API C2, likely LLM-assisted
  development) with file enumeration/exfiltration, screenshot capture, browser
  data theft, Telegram/WhatsApp data exfiltration and RDP setup. IOC set: 12
  C2 IPv4 (first/last seen 2026-02-07 to 2026-06-15) — 5 from WithSecure, 2
  additional from CERT-UA, 5 net-new from the Team Cymru pivot; all on port
  8000. Discovery vector: The Hacker News, 2026-10-20. MITRE: T1059.001,
  T1071.001, T1113, T1555.003, T1021.001, T1041.

