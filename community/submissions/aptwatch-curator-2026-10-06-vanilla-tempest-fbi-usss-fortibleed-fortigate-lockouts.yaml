author: APTWatch Curator
source: https://www.ic3.gov/CSA/2026/261006.pdf
source_name: "FBI + USSS joint advisory JCSA-20261006-01 + SOCRadar STRU (Dismantling FortiBleed / FortiBleed Unmasked) + CloudSEK + Arctic Wolf - FortiBleed FortiGate credential-compromise and initial-access operation (INC/Lynx)"

apt_groups:
  - Vanilla Tempest
  - INC Ransom
  - Vice Society
  - Lynx

description: >
  Joint FBI / U.S. Secret Service cybersecurity advisory JCSA-20261006-01
  (TLP:CLEAR, October 6, 2026) on FortiBleed, an active global
  credential-compromise and initial-access-broker operation against
  internet-facing Fortinet FortiGate firewalls and SSL VPN gateways, with
  SOCRadar verifying more than 86,644 compromised devices across 194
  countries. Enriched with the two SOCRadar STRU whitepapers (Vol. I
  "Dismantling FortiBleed", June 2026, and Vol. II "FortiBleed Unmasked - A
  Joint Operation by Lynx and INC Ransomware Groups", July 2026), CloudSEK's
  open-directory analysis, Arctic Wolf Labs' reverse engineering of the
  CyberStrike Harvester, Kevin Beaumont (DoublePulsar, June 19, 2026),
  Recorded Future Insikt (June 24, 2026) and SpyCloud Labs (June 19, 2026).
  No CVE is involved: every primary source (Fortinet PSIRT, FBI/USSS, Trend
  Micro, Bitdefender, SOCRadar) states the chain is credential-based,
  relying on reused or leaked credentials, infostealer logs, SSH brute force
  with FortiGate-specific wordlists, credential stuffing on /logincheck and
  /remote/logincheck, and legacy salted-SHA-256 administrator password
  storage in FortiOS (PBKDF2 only applies after an admin re-authenticates).
  CVE-2026-24858 / CVE-2025-59718 / CVE-2025-59719 are cited by some vendors
  only as prior FortiCloud SSO weaknesses that may have seeded data, not as
  the mechanism, and the FortiGate CVE list found in the actor's CyberStrike
  tasking is a research checklist, so no CVE is submitted. Attribution:
  SOCRadar STRU assesses with high confidence that FortiBleed is operated by
  TOXMAN (aliases TOXFOX, Greenprawn100; Exploit.in profile), an affiliate
  of both the INC Ransom and Lynx ransomware programs, inside a hierarchy of
  more than 20 members (core operators SCROOGE, suspected team lead, MET and
  SHARK; Telegram handles @clarksome and @prosto100; SSH key comment
  cyberstrike@pentestlab on 85.11.187.8). Russian-language tooling
  artifacts and a sniffer that only runs 07:00-18:00 Moscow time support a
  Russian-speaking operator, although CloudSEK notes origin is not fully
  resolved from the open directory alone. The FBI/USSS advisory states that
  initial access brokers using the FortiBleed chain currently supply access
  to INC/Lynx ransomware and Payload ransomware affiliates; SOCRadar tied at
  least 12 confirmed ransomware attacks, 409 confirmed admin accesses and
  354 full intrusion chains to FortiBleed by July 2026, and found a second
  open directory (217.144.189.136:8080) holding INC Ransom binaries for
  Linux, ESXi and Windows with victims overlapping FortiBleed. INC Ransom
  maps to Microsoft's Vanilla Tempest (formerly Vice Society); Lynx and
  Payload are listed for context. Recorded Future assesses the Exploit forum
  seller SantaAd (auction of June 12, 2026, 34,000 lines) as credible and the
  ShinyHunters-branded "shinymontanna" Telegram claims as re-extortion.
  Timeline: Sophos portal enumeration February 28, 2026, RDWeb March 3,
  MSSQL May 12, Citrix May 18, first fg_capture May 19, 2026, Kerberos
  cracking and DFS exfiltration from a NATO-aligned defense contractor June
  15, 2026, scanning observed by victims June 18 to July 23, 2026 (advisory
  Table 1), confirmed ongoing in October 2026 with victims now locked out of
  their own firewalls. Attack chain: internet scanning for exposed FortiGate
  SSL VPN portals (T1595, T1190) by forticheck / fortiprobe-fast / fg_sniffer
  ("FortiGate Sniffer (Go Edition)", "CyberStrike Harvester v1.5");
  credential stuffing and password spraying (T1110.004, T1110.003);
  extraction of the FortiOS user database (T1003) and exfiltration (T1041)
  to a rented GPU cluster (T1583, vast.ai, about 36-45 GPUs) running Hashcat
  orchestrated by Hashtopolis 0.14.3 for offline cracking (T1110.002), with
  live telemetry through a Telegram bot; honeypot filtering and
  revenue-ranked target enrichment; automated FortiGate config export
  seconds after login, creation of new administrator accounts (T1136.001),
  new firewall rules allowing SSH/RDP to NATed hosts, IPsec tunnel logins,
  and deletion or password change of legitimate accounts (T1531); valid
  accounts (T1078) to pivot, Active Directory enumeration (T1087, ad_enum.py
  / ad_full_audit.py / find_uno.py), spraying for privileged accounts
  (spray_da.py), DFS backup exfiltration (backup_dfs.py); packaging of
  working VPN configurations and target lists for sale. SSH abused when the
  port was exposed; beaconing on ports 4332 and 4432 but mostly HTTPS;
  fg_sniffer C2 dashboard on HTTP 8080; Hashtopolis API on 85.11.187.8:8443;
  open directory on 85.11.187.8:9999; mssql_checker metrics API on port 777.
  Infrastructure (SOCRadar Vol. I): four core /24 blocks explicitly owned by
  the actor - 85.11.187.0/24 (AS211486, primary C2 layer anchored by
  aggregator 85.11.187.8, sniffers, scanners, Docker host 85.11.187.12 of
  TOXMAN's AI "PENTEST LAB"), 193.8.187.0/24 (AS206378, pentest-lab host
  193.8.187.2 and credential-validation node 193.8.187.42), 194.113.39.0/24
  (AS206378, sniffer capacity) and 77.91.122.0/24 (AS201814 MEVSPACE,
  scanning and sniffer layer) - submitted as cidrs. Advisory roles:
  45.154.12.132 C2 server; 154.202.59.169 and 103.27.186.156 proxy nodes;
  45.155.250.158 beacon relay; 193.8.187.2, 193.8.187.42 and 85.11.187.8
  facilitate the chain. Vol. II: 149.50.108.150 master node of the
  CyberStrike cluster; 62.60.131.246 and 91.214.78.252 C2 "Fortigate Harvest
  Grid"; 193.221.200.2 and 195.10.205.233 C2; 188.127.246.183 TOXMAN Windows
  workstation and sniffer (Bitvise SSH into 85.11.187.8); 213.171.17.74
  Windows sniffer; operator IPs via RDP 91.148.237.63 (PrivadoVPN exit),
  109.205.211.139 and 213.21.239.65. CloudSEK: 85.11.187.28 credential
  harvesting node, 193.8.187.2 jump box, Hashtopolis workers 185.229.26.83,
  213.169.49.142, 38.117.87.37, 198.53.64.194, 175.155.64.221. Beaumont:
  193.8.186.7, 213.21.239.65, 208.94.246.58, 69.195.129.144 and 80.75.212.113
  seen exporting FortiGate configs at victim organizations. The ipv4 list
  below merges, in confidence order, the FBI/USSS Table 1 brute-force and
  successful-authentication addresses, the SOCRadar Vol. I "Fortigate
  Sniffer" and "Fortigate Sniffer & Scanner" hosts, Vol. II C2 and operator
  addresses, CloudSEK and Beaumont, then the 199 SOCRadar Vol. I "Proxy
  Rotation" traffic-relay nodes, which are abused VPS and residential
  proxies spread over 29 ASNs (SmartApe, Datacamp/CDN77, Private Layer,
  31173, M247, Cable One) with lower blocking value and expected churn.
  Caveats: 104.28.155.27 (advisory Table 1) sits in Cloudflare-announced
  space, likely a WARP egress, and the agencies warn that Table 1 addresses
  may be reassigned to benign services; 96.45.42.173, reported by Beaumont
  exporting configs, belongs to Fortinet's own ASN (FortiSASE egress) and
  is deliberately NOT submitted; eight addresses listed only in the F5 Labs
  weekly bulletin of July 8, 2026 (167.179.76.111, 199.247.7.82,
  38.54.88.203, 38.54.95.226, 38.60.212.97, 45.32.153.218, 45.61.136.7,
  83.138.53.110) could not be traced to a primary source and are NOT
  submitted. Ransomware infrastructure from Vol. II: Lynx management panel
  and INC management panel .onion addresses submitted as domains; operator
  TOX ID (MET) D0C12DAC4797FFBD31A0BB57E227E141A39FA1F5A3A3FD4C3F15C02D7801DC5ED8C1BF08ACFD
  and BTC address 3A2THXCdqeeuBeDZEKTcwqykYABZsVoJxq recorded here only.
  Attacker-created administrator account names listed by the advisory, not
  representable in this schema, recorded for hunting: adminin, fortiAdmin,
  forticloud-sync, admin, fgtsecure, pakedge, forticloud-tech,
  districtadmin, system_config, gttadmin, roadmin, itadmin,
  Technical_support, adminsslvpn, IT_Manager, my_admin, support_fortinet,
  fgtsec, forti_support2. SHA-256 file indicators (no hash field in this
  schema), limited to those verifiable in text form, from Arctic Wolf Labs:
  harvest_orig (CyberStrike Harvester v1.5)
  2758f4d71a2a2dfdefab81737c2d776b2a3dafe5844fdd2157e089a28447ca98,
  bot.py 479ae5fd7274439ddfa27bc03298ebfdfc5ff17f6412acccf74d4dbd90d94218,
  backup_dfs.py 4253dd1a4c0867b0be7732f75b2f630cebfb7fed94270e15fb3b12ae40546d01.
  SOCRadar Vol. I and Vol. II publish about 50 further SHA-256 hashes
  (fg_sniffer builds, forticheck, fortiprobe-fast, mssql_checker,
  forti-panel.exe, the Python tooling, INC Ransom binaries), but their IoC
  tables are embedded as images and could not be transcribed reliably;
  consult the whitepapers directly for EDR blocking.
  Targeting is indiscriminate and worldwide (top countries India, United
  States, Taiwan, Mexico, Turkey; later shift to LatAm/APAC manufacturing
  and technology); the advisory addresses all 16 U.S. critical
  infrastructure sectors including transportation systems and government
  facilities. Mitigations: remove management interfaces from the internet
  or restrict them via trusted hosts and local-in policies, terminate all
  admin and VPN sessions, reset all FortiGate admin and VPN credentials,
  enforce PBKDF2 admin hashing (FortiOS 7.2.11+), review all local accounts
  and REST API keys, enable phishing-resistant MFA. Companion URLs:
  https://socradar.io/wp-content/uploads/2026/06/Dismantling-FortiBleed.pdf,
  https://cdn.socradar.io/wp-content/uploads/2026/07/FortiBleed-Unmasked_-A-Joint-Operation-by-Lynx-and-INC-Ransomware-Groups-.pdf,
  https://www.cloudsek.com/blog/inside-the-fortibleed-open-directory-a-technical-analysis-of-what-the-attacker-left-behind,
  https://arcticwolf.com/resources/blog/inside-fortibleed-reverse-engineering-the-cyberstrike-harvester-behind-a-global-fortigate-credential-factory/,
  https://doublepulsar.com/an-update-on-fortibleed-whats-happening-with-victim-orgs-c0671a50e7f4,
  https://www.recordedfuture.com/blog/critical-fortibleed-campaign,
  https://spycloud.com/blog/what-spycloud-found-inside-the-fortibleed-threat-actor-infrastructure/,
  https://socradar.io/blog/fortibleed-fortinet-firewalls-compromised/.
  Submitted by the STTR analyse-veille-securite-rss skill, run 2026-10-07
  (brief veille-securite-rss-20261007-0946.md), enriched manually the same
  day; 85.11.187.8 is already present in the APTWatch database and is
  expected to be skipped as a duplicate.

