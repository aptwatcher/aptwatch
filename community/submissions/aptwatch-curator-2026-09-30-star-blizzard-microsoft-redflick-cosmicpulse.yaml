  - COLDRIVER
  - SEABORGIUM
  - Callisto

description: >
  Microsoft Threat Intelligence (September 29, 2026) documents the 2026 evolution
  of Star Blizzard (COLDRIVER / SEABORGIUM / Callisto / BlueCharlie), attributed by
  CISA AA23-341A to FSB Centre 18. Since January 2026 the actor moved from targeted
  spear phishing to large-scale initial-contact phishing (tens to hundreds of
  messages per campaign, at least 13 distinct campaigns January-August 2026,
  100+ organizations affected, primarily US and UK), likely via a mass-mailing
  platform. Targets: Ukrainian individuals and institutions (Ukr.net users
  impersonating tax-audit / fine notices, Kyiv hotels), international NGOs, think
  tanks, governments, diplomatic and multilateral organizations, and financial
  institutions supporting Ukraine; lures impersonate IISS, CES, Atlantic Council,
  Chatham House London Conference 2026, USUBC, "Future of Peace Operations Forum",
  "Future of Liberty Forum", a "MAMA Summit" and a "Payment Advice Note" (T1566.001
  spearphishing attachment, T1566.002 link; T1585.002 email accounts). Since March
  2026 the actor sends phishing from accounts created on compromised cPanel and
  WordPress websites (same account name across multiple domains; Microsoft assesses
  compromise with high confidence), replacing its previous use of Proton and
  Microsoft consumer accounts, which are still used in Evilginx AitM operations
  (T1584.001 compromise infrastructure domains). Follow-up emails carry a
  password-protected RAR/ZIP with the password embedded in an image. RedFlick is
  the new delivery technique: an MSI installer creates scheduled tasks that deploy
  the CosmicPulse downloader (a Control Panel applet DLL, publicly known as
  NOROBOT / BAITSWITCH) which in turn installs the CosmicPulse Python backdoor
  (YESROBOT), replacing the earlier ClickFix chains and requiring a single user
  interaction. Three delivery variants: (1) January 2026 - VHDX inside a ZIP,
  containing an LNK disguised as PDF, hidden BAT and decoy PDF; conhost.exe spawns
  cmd.exe, BAT invokes ssh.exe with PermitLocalCommand=yes / LocalCommand=cmd.exe
  to msiexec a remote MSI (T1204.002, T1059.003, T1218.007 msiexec, T1027.009
  embedded payloads); (2) April 2026 - MSI installs three scheduled tasks
  masquerading as "Internet Quality Test Connection" (beacons UTF-16/Base64
  hostname+username and runs a remote DLL via Shell32 Control_RunDLL over a WebDAV
  UNC path), "Network Configuration Manager" (net.exe helper priming the WebDAV
  redirector) and "System Health Monitor" (control.exe fetches the CPL downloader
  from hard-coded C2 103.245.213[.]217 per Microsoft figure caption - this IP is
  NOT in the published IOC table and is therefore omitted from the lists below
  pending confirmation) (T1053.005 scheduled task, T1218.002 control panel,
  T1036.004 masquerade task, T1071.001, T1132.001); overlaps with DSLUA June 2026
  URC-invitation spear-phishing report; (3) July 2026 - RAR nested in ZIP exposing
  an LNK; conhost.exe + curl download a PDF, PowerShell searches magic header "cAB",
  extracts 208 bytes of Base64 and runs a conhost command that installs another MSI
  creating two more scheduled tasks (T1105 ingress tool transfer, T1027.003
  steganography-style concealment, T1059.001). CosmicPulse downloader writes an
  AES key to HKCU\Software\Classes\.mollis, drops two ZIPs (embedded Python 3.8
  x64 + bootstrapper, and AES-ECB-encrypted payload) (T1547 / T1112 candidates).
  Mid-August 2026 campaign used steganography to conceal identifiers and unique ZIP
  per target. Proofpoint reported in March 2026 iOS targeting with the DarkSword
  backdoor via an Atlantic Council lure. Defender AV signatures:
  Trojan:Script/RedFlick, Backdoor:Script/CosmicPulse, Backdoor:Python/CosmicPulse.
  Related Defender TA reports: Actor profile Star Blizzard
  (54028a36-8ff2-4936-b664-9437c4eaa160), Tool profile CosmicPulse
  (b9171f4c-0749-45f4-9234-6727ed5927a4, updated 2026-09-29), Activity profile
  RedFlick (aaa2300a-b004-4171-892b-1a986354437a). SHA-256 file indicators
  published by Microsoft (no hash field in this schema, recorded here for the
  curator): 9707a8694e954e9ee13e839d6e5905ce626c0837c7c90da6d1025bfbe152866b
  (Documents.zip, January, Ukraine);
  1f2096ff906915fbf80778f0636446206197351f7e271af97936eeb6f32c179d
  (Documents.vhdx, contained in the previous ZIP);
  699e92a9e0edf7835879d5697bc67138c0b137117f459caf1a44df357407cad9
  (Chatham_London_Conference_2026_Invitation.rar, June, password LiveCrown8142);
  24b6e36a09eb2acfc2a95478ca685acb7593b1689be6a4a639fe0d222393cfa7
  (USUBC_Private_Executive_Roundtable_Webex.rar, July, password LiteRaspberry9415);
  dd98dbc1a55afe6fd0ed2ed53a79c76f6bde15081a0060422185b74eb1799ee4
  (Payment Advice Note.zip, August, password BirdMouseCrab). Infrastructure roles:
  RedFlick MSI / PowerShell installer hosts - etia.ca (Jan), groy.cc and muvb.net
  (Feb), matjk.click and bpdaersa.click (Mar), itechx.tel (Apr - Microsoft prints
  "Itechx[.]tel"; the leading character may be a lowercase L, verify before
  blocking), guach.net (Jun), byveo.org (Jul), cyrna.top (Aug); CosmicPulse
  downloader DLL hosts - 103.245.231.248 (Jan), 2.57.241.246 and 89.125.209.168
  (Feb), 103.245.231.79 (Mar), 45.84.59.66 (Apr), ruten.observer (Jun-Jul),
  secure-dns-hub.com (Jul-current), 103.160.59.97 and qumel.link (Jul), drasw.club
  (Aug); CosmicPulse backdoor download hosts - gliderrompercycl.com,
  divekickspolic.org, stuseamandesilt.org. Companion sources: CISA AA23-341A
  (https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-341a), Google
  TIG COLDCOPY / NOROBOT / YESROBOT report
  (https://cloud.google.com/blog/topics/threat-intelligence/new-malware-russia-coldriver),
  Zscaler BAITSWITCH / SIMPLEFIX
  (https://www.zscaler.com/blogs/security-research/coldriver-updates-arsenal-baitswitch-and-simplefix),
  DSLUA
  (https://dslua.org/publications/spearphishing-via-fake-urc-2026-invitations-targets-ukrainian-csos/),
  SecurityWeek coverage
  (https://www.securityweek.com/russian-apt-star-blizzard-uses-redflick-infection-chain-in-recent-attacks/).
  No email, URL or CVE indicators were published. APTWatch batch lookup
  qry_01M3SF1PTHPQDT7CAECA826M0R (2026-09-30) returned zero prior matches for the
  six IPv4 and two sampled domains - all indicators are new to the database.
  Flag originated from the analyse-ms-threat-analytics skill run of 2026-09-30
  (Microsoft 365 Defender Threat Analytics email notification, Star Blizzard
  watchlist match, category russia_state_apt).

