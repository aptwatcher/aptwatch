description: >
  Nine command-and-control IP addresses and nine attacker-registered Zimbra
  impersonation domains for the Russian cyberespionage cluster CL-STA-1114,
  which Palo Alto Unit 42 (report 2026-07-23) states overlaps the actor tracked
  as Void Blizzard / LAUNDRY BEAR. The actor runs zero-click phishing against
  Zimbra Collaboration Suite webmail, exploiting Classic-UI XSS CVE-2025-66376:
  an HTML attachment / embedded HTML lure hides a Base64-encoded script in an
  invisible SVG element that, on load, injects JavaScript into the victim's
  browser and exfiltrates CSRF tokens, credentials, 2FA scratch codes,
  system/environment details and the last ~90 days of email + search history to
  a hard-coded C2. Unit 42 observed at least 9 C2 IPs and 9 C2 domains over the
  campaign, each server active ~35.4 days on average. This package ENRICHES the
  existing 2026-07-25 curator YAML (CISA AA26-204A, 6 domains + CVE, no IPs):
  all 9 IPs are net-new to the DB, and 3 domains are net-new
  (analyticemailmeter.com, synacorzimbra.nl, zimbrasoft.com.ua). ATTRIBUTION
  OVERLAP: 7 of the 9 domains are already in apt-intel auto-attributed to Pawn
  Storm (APT28) at 0.5; Unit 42 + CISA attribute them to Void Blizzard — flagged
  for review on import, not proof of shared operator. Same-day observation:
  216.252.238.18/.64/.104 fall in 216.252.238.0/24 (no CIDR claimed by the
  report -> none ingested). Corroborating / sister sources: CISA joint advisory
  AA26-204A (https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-204a,
  2026-07-23), Seqrite "Operation GhostMail"
  (https://www.seqrite.com/blog/operation-ghostmail-zimbra-xss-russian-apt-ukraine/),
  AIVD/MIVD Void Blizzard advisory (2025-05-27) and Microsoft Void Blizzard
  profile
  (https://www.microsoft.com/en-us/security/blog/2025/05/27/new-russia-affiliated-actor-void-blizzard-targets-critical-sectors-for-espionage/).

