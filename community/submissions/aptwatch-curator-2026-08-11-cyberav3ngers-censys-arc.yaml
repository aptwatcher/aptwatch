  single multi-homed Windows engineering workstation in AS214036 (ULTAHOST,
  Amsterdam) running the full Rockwell toolchain (Studio 5000, FactoryTalk,
  RSLinx, CodeMeter). The four IPs below share the same host, ASN, certificate
  family, and activity window (2025 through Mar 2026) but are absent from the
  CISA advisory. 185.82.73.169 is currently dark but is the likely twelfth
  interface; Censys recommends treating the whole 185.82.73.160-171 range in
  AS214036 as suspect and querying historical logs for TCP 44818/2222/102/502/22.
  Confidence: vendor OSINT pivot (TLP:CLEAR), not government-confirmed - vet
  before blocking.

