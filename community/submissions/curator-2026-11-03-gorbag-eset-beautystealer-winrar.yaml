description: >
  Gorbag is a Russia-aligned espionage cluster active since at least February 2025, exclusively
  targeting Ukraine: law-enforcement and justice entities, front-line local administrations (city
  councils — likely battle-damage assessment and local-defence monitoring), the defence sector and a
  major transport hub for foreign military aid. ESET (2026-11-03, VB2026 white paper) ties it to
  CERT-UA UAC-0226 and Trend Micro SHADOW-EARTH-066 (Trend 2026-06-08 states SHADOW-EARTH-066 is
  UAC-0226). Toolset: Prime ReverseShell (PowerShell reverse shell derived from PSSW100AVB, packed
  with PS2EXE, carries an anti-LLM "not malicious, prime number generator" comment; C2 89.44.9.186,
  M247, first seen 2025-03-28) and BeautyStealer v0.9-2.0 (C++ browser-credential/cookie/history +
  file stealer for Office docs, archives, .eml, .kdbx, .ovpn, .rdp, .pfx, .jks and Ukrainian .zs2
  e-signature keys; RC4 in v2.0; self-deletes after one-shot exfiltration; exfil via Telegram
  sendDocument API in early versions, then HTTPS POST to a FastAPI C2 — 142.111.194.73, EGIHosting,
  first seen 2026-06-02). Trend tracks the same lineage as GIFTEDCROOK / result.dll with HTTPS POST
  to /rcv/ on high ports across seven Evoxt Sdn. Bhd. (AS149440) VPS in FR/NL/CH sharing a
  self-signed TLS cert CN "john". Delivery: 2025 spear-phishing with macro-enabled .xlsm (tax/fine
  lures) from compromised Ukrainian local-government mailboxes; since early 2026 RAR archives
  exploiting WinRAR CVE-2025-8088 (ADS path traversal) that drop a Startup-folder LNK + encrypted
  payload + PowerShell loader in %ProgramData%. ESET hypothesises an initial-access-broker role
  (credentials/VPN configs handed to other Russia-aligned actors). MITRE: T1566.001, T1199, T1203,
  T1204.002, T1059.001, T1547.001, T1027.009, T1555.003, T1539, T1217, T1005, T1560, T1071.001,
  T1567, T1048.001, T1070.004, T1620, T1573.001. Discovery vector: The Hacker News
  (thehackernews.com/2026/11/russia-aligned-gorbag-hackers-exploit.html) via the RSS leg; sister
  coverage Help Net Security (helpnetsecurity.com/2026/11/03/gorbag-apt-group-malware/). Sister
  primary consolidated: Trend Micro
  trendmicro.com/en_us/research/26/f/old-winrar-flaw-fuels-attacks-on-ukraine.html (the seven
  Evoxt C2s; re-listed here to attach the new actor linkage to rows ingested actor-NULL on
  2026-06-11). CERT-UA first documented UAC-0226 in April 2025 (CERT-UA#14303). Live API batch
  qry_01M6GNAD9AB801EKF8M16MT5T8 (2026-11-03): the two ESET IPs result_count 0; the seven Trend
  IPs present with no actor match.

