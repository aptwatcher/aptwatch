description: >
  Customer-side infrastructure ingest for the ACR / Amatera Stealer
  MaaS family. The chain observed on 2026-05-25 by Brad Duncan (ISC
  SANS) delivers ACR Stealer via fake Claude (Anthropic) impersonation
  pages hosted on sites.google.com, reached via malicious Google Ads.
  The page adapts to OS - it shows macOS instructions when viewed from
  macOS and Windows instructions when viewed from Windows; Brad
  analyzed the Windows chain. The Windows chain pulls a deliberately
  corrupted ZIP from primemetricsa[.]com, follows up with a PowerShell
  stage from a long-subdomain creativecommunityinfo[.]art host, fetches
  a benign-looking JPEG decoy from imgbb (i.ibb.co - legitimate public
  service used as drop, explicitly noted by Brad as not malicious in
  itself), and posts back to a yw.enhanceblabber[.]cc C2.

  Brad Duncan attributes the payload to ACR Stealer via post-infection
  C2 pattern matching against the Malpedia win.acr_stealer family
  entry. The operator of THIS specific campaign is a non-identified
  customer of the ACR / Amatera MaaS - not the platform operator
  directly. SheldIO (the original ACR vendor) is reported by Proofpoint
  2025-06-16 to have sold the ACR source code in mid-2024 and to have
  shut down the ACR Telegram sales channel in December 2024 in tandem
  with the public emergence of the Amatera Stealer panel. The
  post-rebrand Amatera operator identity remains unattributed in public
  vendor reporting as of 2026-05-26.

  Platform / operator profile (per investigation note): SheldIO is
  active on Russian-speaking cybercrime forums since at least 2022;
  prior products include AcridRain Stealer, Roca Loader, and an
  unnamed private infostealer; Telegram channel was conducted in
  Russian. The product line trails back further to GrMsk Stealer per
  Sekoia. Amatera Stealer is a C++ rebrand of ACR with improved AV
  evasion, packing, NTSockets-based C2 (bypasses EDR network hooks),
  AMSI bypass via XOR against the AMSI_RESULT_NOT_DETECTED enum
  string, optional HTTPS C2 path, and second-stage payload support
  (.exe/.cmd/.dll/.ps1). Subscription tiers: 199 USD/month to 1499
  USD/year. Customer base is broad and non-attributed - observed
  delivery vectors include ClearFake web-inject (Proofpoint April-May
  2025), ClickFix fake-CAPTCHA (eSentire EVALUSION November 2025, The
  Hacker News January 2026), and fake AI-tool impersonation pages
  (ISC SANS, this report).

  Russian Market 2025 volumetry (per public Proofpoint figures):
  133,980 new ACR logs in May 2025 (+690 percent month-over-month),
  followed by 115,456 new logs in 1-25 June 2025 - total 238,768 logs
  in an 8-week window. This places ACR/Amatera in the top-tier
  infostealer market share segment (comparable to Lumma pre-takedown,
  Rhadamanthys, Vidar).

  Customer-side infrastructure observed on 2026-05-25 (this YAML):
  fake Claude page apex fairpoint29.com, initial-download host
  primemetricsa.com, PowerShell staging apex creativecommunityinfo.art
  (sub 6ryuefl.*), C2 apex enhanceblabber.cc (sub yw.*). All apex
  domains are included as context-anchors per project delta-vs-context
  discipline so the YAML stays self-sufficient for audit and re-ingest.

  imgbb (i.ibb.co) is intentionally NOT re-asserted in this YAML
  despite being part of the chain - Brad Duncan explicitly notes the
  JPEG drop does not appear malicious, and imgbb is a legitimate
  public image-hosting service. The current DB row for i.ibb.co
  (score 0.0, domain_type=malicious) is a legacy mis-classification
  flagged separately in the investigation note for independent
  correction.

  Three SHA-256 hashes from the ISC SANS diary
  (70b5ecc110e074dbca92932c0e840ea3492ea0a43c3f215b71392c12b02213b2
  for the corrupted ZIP, a14c3ecf5eb3d2543358482e43dc765dbf9ee7a4bec7571f5ecb8829ca719692
  for the PowerShell follow-up, 47fa746422f1bf6b7712dc6803378e6a995488007193a7441d790f70d204728f
  for the benign JPEG decoy) are NOT ingested here - the flat-IOC
  schema has no hash table - they are captured in the 2026-05-26
  daily threat-hunt digest and the SheldIO investigation note for
  audit-trail only.

  MITRE ATT&CK techniques implied (curator schema is prose-only):
  T1583.001 (Acquire Infrastructure: Domains - attacker-registered
  apex names), T1583.008 (Acquire Infrastructure: Malvertising via
  Google Ads), T1189 (Drive-by Compromise), T1566.002 (Phishing:
  Spearphishing Link), T1059.001 (Command and Scripting Interpreter:
  PowerShell), T1027 (Obfuscated Files - corrupted-ZIP container,
  XOR-against-AMSI-enum string deobfuscation), T1140 (Deobfuscate
  Decode Files or Information), T1555.003 (Credentials from Web
  Browsers), T1539 (Steal Web Session Cookie), T1552.001 (Credentials
  In Files), T1102.002 (Web Service: Bidirectional Communication for
  C2), T1041 (Exfiltration Over C2 Channel), T1622 (Debugger Evasion -
  AMSI/WLDP/ETW bypass per Amatera evolution).

  Discovery vector: STTR daily APT Watch threat-hunt job for
  2026-05-26 originally classified the 24h window as dry. The
  operator (dricard) then routed the ISC SANS diary through an
  out-of-band investigation prompt because the SheldIO / ACR /
  Amatera question had been raised by a separate STTR pipeline
  (analyse-veille-securite-rss skill) at MOYENNE pertinence with no
  APT Watch flag set. The investigation note concludes the family
  meets the project's three-pillar attribution discipline (adapted
  for MaaS-operators per the new CLAUDE.md "Scope clarifications
  (2026-05-26)" section) and recommends adding the platform as a
  campaign tracked under the persona-vs-platform discipline
  (campaign_name uses the platform name, not SheldIO).

