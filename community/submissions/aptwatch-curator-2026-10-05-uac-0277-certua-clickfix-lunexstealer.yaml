description: >
  CERT-UA (2026-09-30) documents a September 2026 campaign tracked as new cluster
  UAC-0277: 100+ compromised websites injected with malicious JavaScript serving a
  fake Cloudflare human-verification page (ClickFix technique, T1204) to Windows
  users arriving from search engines (Google, DuckDuckGo, meta.ua, bigmir.net),
  at most twice per 12 hours. The script reads its delivery domain and operating
  mode (0 inactive / 1 passive visitor tracking / 2 fake check page) from a smart
  contract on the Polygon or Ethereum network, allowing centralized reconfiguration
  without re-accessing the compromised sites (dead-drop resolver, T1102.001).
  Victims are induced to run msiexec against remote MSI packages (three variants
  analyzed): (1) direct install of LUNEXSTEALER, a 64-bit Windows infostealer +
  remote-tasking agent (browser passwords/tokens, crypto wallets, system info;
  downloads and runs EXE/MSI/PowerShell/cmd; HTTP C2; persistence via scheduled
  task "psychedelicloveUtils"); (2) a loader that bypasses UAC, adds Microsoft
  Defender exclusions, and deploys the vulnerable AMD driver PDFWKRNL.sys
  exploiting CVE-2023-20598 (BYOVD, T1068 / T1562.001) before fetching
  LUNEXSTEALER; (3) DLL side-loading via legitimate FnHotkeyUtility.exe loading
  malicious spkvol.dll (T1574.002). Depending on C2 configuration LUNEXSTEALER
  installs the malicious Chromium browser extension LUNARAXE (displayed as
  "Microsoft Office Word Editor"): components LUNARAXE.CORE (HTTP/WebSocket C2,
  tab control, screenshots, proxy changes, JS execution, fullscreen iframe
  overlay), LUNARAXE.STEALER (web-form credential capture), LUNARAXE.STRIP
  (CSP removal via request-modification rules), plus NAIVEMESS, a PowerShell
  Native Messaging host "com.lunex.explorer" granting the extension filesystem
  access. Attribution: CERT-UA cluster identifier only; no state attribution
  stated - campaign targets Ukrainian internet users (meta.ua / bigmir.net
  referrals, ukrainerada.top / radaukraine.top lure domains). The 100+
  compromised legitimate websites are intentionally not published by CERT-UA and
  are not ingested. The pp.ua entries are attacker-registered free subdomains;
  the pp.ua platform apex is deliberately excluded (shared-platform rule). File
  hashes (SHA-256, schema has no hash field, recorded for the curator):
