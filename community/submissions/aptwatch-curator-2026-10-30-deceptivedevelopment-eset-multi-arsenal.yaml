description: >
  DeceptiveDevelopment (ESET name; Trend Threat Intelligence Feed intrusion-set "Void Dokkaebi" with aliases
  Contagious Interview, Famous Chollima, UNC5342, CL-STA-0240, DEV#POPPER, Tenacious Pungsan, PurpleBravo, Gwisin Gang,
  WaterPlum, Coral Sleet, Storm-1877 [feed spelling "Strom-1877"]), a North Korea-aligned financially motivated cluster
  documented by ESET Research in the white paper "DeceptiveDevelopment: From primitive crypto theft to sophisticated
  AI-based deception" (WeLiveSecurity, 2025-09-25, authors Peter Kalnai and Matej Havranek) whose IOC list is published
  in the eset/malware-ioc GitHub repository (deceptivedevelopment/README.adoc); mirrored in the Trend feed as
  "Multi-Arsenal from the North: Wallet-Draining DeceptiveDevelopment" (report published 2025-09-29, labels
  location:China, Russian Federation, Poland, Ukraine, France, Albania). Attribution: ESET attributes the cluster to
  North Korea with high confidence (overlaps Famous Chollima / Contagious Interview reporting by CrowdStrike, Unit 42
  and Google); Trend mirrors this as Void Dokkaebi; APT Watch already tracks Lazarus Group (actor_id 33) and this
  cluster is proposed as a separate curated actor or as Lazarus aliases (see handoff 05_actor_alias_updates.json).
  Victimology: freelance and in-house software developers in cryptocurrency and Web3, worldwide, approached through fake
  recruiter personas and "coding interview" projects; the feed labels include Ukraine, Poland and France. TTPs in prose:
  trojanized GitHub/npm projects and fake video-conferencing apps delivered through job interview lures (T1566.003,
  T1204.002); ClickFix-style "fix your camera/driver" prompts (ClickFix-1.bat, mac-v-j1722.fixer, drivfixer.sh)
  (T1204.004); BeaverTail JavaScript stealer and InvisibleFerret Python RAT with browser, payload and AnyDesk modules
  (T1555.003, T1219); WeaselStore Go stealer, AkdoorTea TCP RAT, Tropidoor RAT and TsunamiKit (.NET injector/installer/
  client with Tor proxy, XMRig and NBMiner) (T1090.003, T1496); fake macOS login prompts for credential theft
  (T1056.002). Infrastructure roles with ESET first-seen dates: driverservices.store on 199.188.200.147 (Namecheap,
  2025-08-08) is remote storage for DeceptiveDevelopment payloads; 103.231.75.101 (THE-HOSTING-MNT, 2025-08-10) is the
  AkdoorTea C2; 45.159.248.110 (THE-HOSTING-MNT, 2025-06-29) is a BeaverTail C2; 116.125.126.38 hosts www.royalsevres.com
  (SK Broadband, 2024-06-25), a compromised legitimate site used as remote storage for Tropidoor, filed under
  compromised_domains; n34kr3z26f3jzp4ckmwuv5ipqyatumdxhgjgsmucc65jac56khdy5zqd.onion (2023-10-06) is the TsunamiClient
  Tor C2. Already in the database and excluded from the lists: 45.8.146.93, 86.104.72.247 and 103.35.190.170 (Tropidoor
  C2 servers on STARK INDUSTRIES, 2024-06-24 to 2024-10-31) which fall inside existing APT Watch CIDRs 45.8.146.0/24,
  86.104.72.0/24 and 103.35.190.0/24 - refresh last_seen to 2025-09-29 and consider promoting them to explicit IPv4
  entries with the DPRK attribution. The second ESET IOC set in the same README (DeceptiveDevelopment targets freelance
  developers, 2025-02) lists eight further BeaverTail/InvisibleFerret C2 IPs (95.164.17.24, 185.235.241.208,
  147.124.214.129, 23.106.253.194, 147.124.214.237, 67.203.7.171, 45.61.131.218, 135.125.248.56) not present in the Trend
  feed; they are included below because they come from the same public source and were absent from the database.
  SHA-1 file indicators published by ESET (the feed carries 17 of them), no hash field in this schema, recorded here for
  the curator: e34a43acef5af1e5197d940b94fc37bc4eff0b2a (nvidiadrivers.zip WeaselStore), 3405469811bae511e62cb0a4062aadb523cad263,
