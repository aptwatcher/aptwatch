  cda0f15c9430b6e0ff1acda4d44da065d547af1c, 214f0b10e9474f0f5d320158fb71995af852b216 (nvidiaupdate.exe), 4499c80dda6dbb492f8667d11d3ffbfeec7a3926 (InvisibleFerret),
  b20bfbab8ba732d428afba7a688e6367232b9430, c6888fb1de8423d9aef9ddea6b1c96c939a06cf5 (TsunamiInjector), 4aaf0473599d7e3a503841ed10281fdc186633d2, 251cf5f4a8e73f8c5f91071bb043b4aa7f29d519,
  d469d1baa3417080ded74ccb9cfb5324bdb88209, 0c0f8152f3462b662318566cdd2f62d8e350a15e (Tor proxy), f42cc34c1cfaa826b96291e9af81f1a67620e631 (autopart.zip), 02a2cd54948bc0e2f696de412266dd59d150d8c5,
