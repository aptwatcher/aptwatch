#  NEW CAMPAIGN — no "Kimsuky" campaign or actor row exists (local mirror
#  snapshot of 2026-11-09; live API unreachable on 2026-11-21, so confirm on
#  import). apt_groups[0] "Kimsuky" will CREATE the campaign row.
#  PARTNER-STATE ACTOR (curator rule of 2026-10-30): DPRK cluster in scope
#  because a vendor primary ties it to the Ukrainian target set. Proposed
#  row attributes: origin_country = KP, threat_actor_type analogous to
#  #141 APT42 (state_apt_partner), separate actor row (NOT Lazarus Group,
#  actor_id 33). Never file under a Russian actor.
#
#  apt_groups[1:] are aliases of the WHOLE actor Kimsuky only. Deliberately
#  NOT listed: "TA406" and "Konni" (Proofpoint: TA406 only PARTIALLY
#  overlaps Kimsuky/Konni — not a true alias), "Operation GitPower"
#  (operation name; keep in description).
#
#  Attribution (Genians, section 4): linked to Kimsuky on infrastructure,
#  execution framework, script implementation and exfiltration structure —
#  "help.ini"/"first.ini" code and naming overlap with earlier GitPower and
#  with Hauri's 2026-06-29 Kimsuky report ("tomas23492" infrastructure);
#  shared serveirc.com phishing pattern with attacks on North Korea experts
#  in South Korea; Kakao/Daum operator mail accounts.
#
#  IOC provenance: Genians section 6 IoC list (6 C2 IPs, 57 domains, 37
#  e-mail accounts, 85 MD5) plus URLs from sections 3-3 / 3-3-2. Dedup:
#  local mirror only (STALE, 2026-11-09) — none of the 6 IPs, the sampled
#  hosts or e-mails present; live API not available.
#
#  Ownership triage (reports/triage/genians-gitpower-2026-11-21.csv, raw
#  heuristic output unedited): 5 likely_attacker, 49 needs_review,
#  3 compromised. Curator OVERRIDES to malicious, on the report's own
#  language:
#   - 51 subdomains on AwardSpace free hosting (mygamesonline.org,
#     medianewsonline.com, onlinewebshop.net, mywebcommunity.org,
#     getenjoyment.net, myartsonline.com, mypressonline.com,
#     scienceontheweb.net, sportsontheweb.net, atwebpages.com): Genians —
#     "subdomains provided by AwardSpace, a free web hosting service, as C2
#     infrastructure" → attacker-created accounts, not hijacked sites.
#   - 3 serveirc.com hosts (No-IP dynamic DNS): Genians — phishing
#     infrastructure ("security-zooma" credential page).
#   - 3 dothome.co.kr hosts (free Korean hosting; attacker-themed account
#     names "kovalenko", "argeninese", "bbcnews04"; decoy-PDF staging). The
#     heuristic flags *.co.kr as regional-business; overridden because the
#     account is a free-hosting subdomain created for the lure.
#   - dofamini.com.ua stays in compromised_domains: Genians only calls it a
#     "web server in Ukraine" hosting a decoy PDF, no registration claim →
#     conservative (possibly a hijacked Ukrainian site). No WHOIS check
#     possible this run (enrichment API down).
#  Shared-platform apexes deliberately NOT listed: all AwardSpace apexes
#  above, dothome.co.kr, serveirc.com, raw.githubusercontent.com /
#  github.com (GitLab, Codeberg and Dropbox are also abused, no path given).
#
#  URL scheme normalization: Genians prints URLs scheme-less. https://
#  prepended for raw.githubusercontent.com (HTTPS-only platform); http://
#  for the two decoy-PDF URLs and the login.php loader (report does not
#  state TLS).
#
#  E-mail accounts are operator-controlled freemail/Proton/Kakao/Daum
#  senders, CC addresses and Git commit identities as listed by Genians;
#  none is a victim address. Victim names/organizations are not ingested.
#
#  Hashes: 85 MD5 in Genians section 6 — no hash field in this schema; see
#  the source (not reproduced here).
#
#  Scope note: the Genians IoC list covers the whole GitPower cluster
#  (Ukrainian experts AND South Korean / Japanese lures). It is ingested as
#  one actor-level package; the TCP C2 111.92.246.145:12345 and
#  security-zooma.serveirc.com (85.155.224.59) are the items directly tied
#  to the Ukrainian targets.

