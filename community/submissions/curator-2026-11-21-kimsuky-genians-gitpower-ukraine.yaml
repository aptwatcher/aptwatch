description: >
  NEW CAMPAIGN PROPOSAL — partner-state actor (origin_country KP), in scope under the curator
  rule of 2026-10-30 because the vendor primary ties it to the Ukrainian target set; keep it
  separate from Lazarus Group and from every Russian actor. Genians Security Center (2026-10-12)
  documents Kimsuky's "Operation GitPower" tradecraft being turned on Ukrainian experts in
  diplomacy, security and international policy and on civil-society figures working on post-war
  reconstruction; Genians assesses most attempts were unsuccessful and reads the objective as
  intelligence on the war, North Korean troop losses, prisoner-of-war handling and South
  Korea-Ukraine consultations. Background: Proofpoint "TA406 Pivots to the Front" (2025-05-13)
  reported DPRK spear phishing of Ukrainian government bodies since February 2025 using AwardSpace
  free-hosting subdomains (TA406 partially overlaps Kimsuky/Konni and is not used as an alias
  here). Lures: (1) 2026-08-06 speaker invitation to the 14th Korea Cyber Security Conference
  (KCSCON 2026) from kcscon@proton.me with info.seclab.noreply@gmail.com in copy, reply-baiting
  then an archive with an HTML file and a .pdf.lnk; (2) analytical-collaboration approach to an
  international-policy expert, with a "Log in to Zoom via Gmail" credential page on
  security-zooma.serveirc.com (85.155.224.59, Japan); (3) LNK files posing as a Russia-Ukraine
  peace-architecture report and a social researcher's CV, decoy PDFs staged on
  kovalenko.dothome.co.kr and dofamini.com.ua; (4) a fake Zoom installer. Chain: LNK runs
  PowerShell that pulls "first.ini"/"help.ini" or LICENSE/okay.md from GitHub (also GitLab,
  Codeberg, Dropbox), saves update1.vbs/update2.ps1, registers a scheduled task disguised as
  OneDrive/Edge update, collects system information and exfiltrates to GitHub or to a dedicated
  TCP C2 at 111.92.246.145:12345 (plaintext password, "AUTH OK" handshake); a README.md loader
  beacons to p1o2i3u4y5t6r7e8w9q0.medianewsonline.com/login.php; final payload frequently
  AsyncRAT (T1566.001, T1566.002, T1204.002, T1059.001, T1053.005, T1102, T1567.001, T1583.006,
  T1585.002, T1056.003). The same infrastructure carried Japanese decoys and 62 LNKs posing as
  Korean financial/administrative documents. Domains are attacker-created free-hosting or
  dynamic-DNS subdomains (AwardSpace family, dothome.co.kr, serveirc.com) — the platform apexes
  and raw.githubusercontent.com are deliberately excluded; dofamini.com.ua is filed as
  compromised_legitimate (decoy hosting on a Ukrainian web server, ownership unverified). E-mail
  entries are operator-controlled accounts, not victims. 85 MD5 hashes are in the source. Sister
  coverage: The Record "North Korean hackers target Ukrainian experts for possible intelligence
  on Russia's war" (https://therecord.media/north-korea-hackers-russia-ukraine); The Hacker News
  2026-11-17 (https://thehackernews.com/2026/11/trigram-campaign-impersonates-about-50.html,
  discovery vector); Proofpoint TA406 (https://www.proofpoint.com/us/blog/threat-insight/ta406-pivots-front);
  Hauri 2026-06-29 Kimsuky report. No sister source with finer IOC granularity than Genians was
  found. Dedup was done against the local mirror only (stale, 2026-11-09; live API unreachable on
  2026-11-21).

