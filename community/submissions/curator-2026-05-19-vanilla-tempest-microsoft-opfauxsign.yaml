description: >
  Microsoft Digital Crimes Unit civil complaint filed in the U.S. District
  Court for the Southern District of New York on 2026-05-19 (Microsoft v. Fox
  Tempest et al., John Does 1-4), reported same day by The Register. The court
  filing names two co-defendant clusters - Fox Tempest (John Does 1-2, a/k/a
  SamCodeSign) and Vanilla Tempest (John Does 3-4, a/k/a Vice Society, Vice
  Spider, Rhysida) - and is referenced internally as Operation OpFauxSign.
  Attribution confidence is high - the named defendants are documented across
  Microsoft telemetry plus the seized signspace.cloud panel infrastructure,
  with payment trails (BTC) and Russian-language operator instructions on the
  panel supporting the alias mapping. This curator YAML covers the Vanilla
  Tempest leg (the operator-side acquirers / abusers of the signed payloads)
  since the project tracks them under their ransomware-and-crime-ops identity;
  Fox Tempest is the upstream certificate-generation infrastructure provider
  and is cited here only for context.

  Activity window: May 2025 through filing date 2026-05-19. Scale per the
  complaint: Fox Tempest abused Azure Artifact Signing across 580+ fraudulent
  Microsoft tenants to generate legitimate-looking Microsoft-rooted code-signing
  certificates, then resold each at 5,000 to 9,500 USD payable in BTC through
  the signspace.cloud marketplace. The complaint names Vanilla Tempest
  explicitly as a customer-side defendant (John Does 3-4); additional ransomware
  affiliates (INC Ransom, Qilin, Akira) and infostealer families (Lumma, Vidar)
  are mentioned through sister-vendor coverage (the Microsoft DCU blog by
  Steven Masada and the May 21 2025 Lumma takedown action referenced in the
  filing footnotes), not as defendants in this specific filing. Malware
  payloads explicitly observed signed by the panel in the complaint - Oyster
  (a/k/a Broomstick / CleanupLoader, Windows backdoor used as initial loader)
  and Rhysida ransomware deployed downstream. Distribution chains - malvertising
  plus SEO poisoning, with the malware packaged as fake Microsoft Teams
  installers. Thousands of U.S. machines compromised, including 12+ owned and
  operated by Microsoft (the predicate giving Microsoft standing in SDNY).

  Operational details extracted from the complaint primary text - the Fox
  Tempest defendants ran the signing service through a Telegram group, a
  customer-facing Google Form for purchase intake, and a managed Google Sheet
  (owner email gacermalkin@gmail.com, the same email tied to the signspace.cloud
  registration). Customer onboarding involved provisioning per-customer virtual
  machines on Cloudzy infrastructure - Microsoft identified 149 Cloudzy VMs in
  connection with the operation. Customers connected to the Azure code-signing
  endpoint eus.codesigning.azure.net (East US, legitimate Microsoft service)
  via the "AzurCert" identifier as both the requester and the certificate
  publisher. Operator instructions to customers were originally in Russian
  (the complaint notes translations from Russian throughout the exhibits).

  MITRE ATT&CK candidates implied by the complaint narrative (in prose since the
  curator schema has no structured TTP table): T1588.003 (Obtain Capabilities -
  Code Signing Certificates) as the central tradecraft, T1583.001 (Acquire
  Infrastructure - Domains) for the signspace.cloud marketplace plus the
  delivery domains, T1608.001 (Stage Capabilities - Upload Malware via signed
  binaries), T1204 (User Execution, fake Teams installers), and T1486 (Data
  Encrypted for Impact) for the Rhysida deployments downstream.

  IOCs ingested here are restricted to network artefacts explicitly published
  in the complaint and confirmed by The Register: the signspace.cloud apex
  (the marketplace itself, attacker-registered with GoDaddy as registrar),
  two operator IPv4s hosted by Cloudzy (31.59.58.9 and 38.180.163.50) which
  are the servers behind the signspace.cloud website, plus the operator email
  gacermalkin@gmail.com tied to both the registration and the managed
  Google Sheet customer ledger. No additional URLs, IPv6 addresses, CIDR
  ranges, or sample hashes are listed in the body of the complaint reviewed
  (Exhibits 2 and 4 carry domain-and-VM detail but the cooperating-source
  hashes for Oyster/Rhysida samples are not part of the publicly filed text).
  Targeted enrichment should be added in a follow-up YAML if Microsoft
  publishes a companion blog with a structured IOC sidebar, or if the
  in-progress Cloudzy 149-VM list becomes public via court order or vendor
  disclosure.

  Source-of-record for this submission is the civil complaint PDF on
  noticeofpleadings.net (the official public-notice site referenced by SDNY
  for the case). Sister-source corroboration: The Register article published
  2026-05-19 by Iain Thomson, plus the Microsoft Digital Crimes Unit blog
  authored by Steven Masada (DCU Assistant General Counsel) which accompanies
  the filing. Geographic targeting per the complaint is overwhelmingly United
  States. Discovery vector for this curator YAML was the STTR daily RSS
  veille (skill analyse-veille-securite-rss v0.3, brief dated 2026-05-20),
  which surfaced The Register lead before manual review of the civil complaint
  primary.

