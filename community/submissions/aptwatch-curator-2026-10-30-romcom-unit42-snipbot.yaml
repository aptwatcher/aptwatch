description: >
  RomCom / Void Rabisu (Trend name; Microsoft Storm-0978, watchlist entry Earth Koshchei; Unit 42 Tropical Scorpius)
  "SnipBot" variant, documented by Palo Alto Networks Unit 42 on 2024-09-23 and mirrored in the Trend Threat
  Intelligence Feed as "New RomCom Malware Variant: SnipBot" (report published 2024-10-01, intrusion-set Void Rabisu,
  labels location:Ukraine). Attribution: Unit 42 attributes SnipBot to the RomCom operators (Tropical Scorpius) with high
  confidence based on code lineage from RomCom 3.0/4.0; the actor is Russia-aligned and pivoted from ransomware to
  espionage. Victimology in the Unit 42 cases: IT services, legal and agriculture organizations, with Ukrainian targeting
  reported by CERT-UA (cert.gov.ua/article/6280099, UAV procurement lures against defence enterprises). TTPs in prose:
  spear-phishing emails with links to fake document downloads signed with revoked or stolen code-signing certificates
  (T1566.002, T1553.002); first-stage downloader with window-message-based control-flow obfuscation and API hashing
  (T1027, T1106); COM hijacking to register a DLL as the thumbnail cache library (T1546.015); staged downloads from
  rotating C2/staging domains over HTTPS (T1071.001, T1105); post-exploitation discovery and data collection
  (T1083, T1005). Infrastructure roles with Unit 42 last-resolved IPs: xeontime.com (first C2, 91.92.250.240),
  drvmcprotect.com (second-stage COM DLL keyprov.dll, 91.92.254.54), mcprotect.cloud (185.225.74.94),
  cethernet.com (later C2, 91.92.254.234), sitepanel.top (91.92.254.234), olminx.com (earliest version C2,
  91.92.250.106), ilogicflow.com (23.184.48.90), docstorage.link and drv.docstorage.link (212.46.38.222),
  drv2ms.com (79.141.170.34), fastshare.click and publicshare.link (52.72.49.79, shared AWS address - not submitted),
  dns-msn.com (91.92.242.87, already in database), certifysop.com (23.137.248.220), linedrv.com (38.180.5.251),
  cloudcreative.digital with actor subdomain adobe.cloudcreative.digital (23.137.249.182), fileshare.direct with actor
  subdomain 1drv.fileshare.direct (23.137.249.14); 91.92.250.104 is listed by Unit 42 as an associated IP. All domains
  are actor-registered look-alikes of cloud/storage brands; the Trend feed carries 185.225.74.94 and 212.46.38.222
  as IPv4 indicators (first seen 2024-10-01). Already in the database, excluded from the lists: webtimeapi.com and
  91.92.242.87 (refresh last_seen to 2024-10-01, also present in the Cisco Talos UAT-5647 set of 2024-10-23).
  SHA-256 file indicators published by Unit 42, no hash field in this schema, recorded here for the curator:
  0be3116a3edc063283f3693591c388eec67801cdd140a90c4270679e01677501, 1cb4ff70f69c988196052eaacf438b1d453bbfb08392e1db3df97c82ed35c154,
  2c327087b063e89c376fd84d48af7b855e686936765876da2433485d496cb3a4, 5390ba094cf556f9d7bbb00f90c9ca9e04044847c3293d6e468cb0aaeb688129,
  57e59b156a3ff2a3333075baef684f49c63069d296b3b036ced9ed781fd42312, 5b30a5b71ef795e07c91b7a43b3c1113894a82ddffc212a2fa71eebc078f5118,
  5c71601717bed14da74980ad554ad35d751691b2510653223c699e1f006195b8, 60d96087c35dadca805b9f0ad1e53b414bcd3341d25d36e0190f1b2bbfd66315,
  92c8b63b2dd31cf3ac6512f0da60dabd0ce179023ab68b8838e7dc16ef7e363d, a2f2e88a5e2a3d81f4b130a2f93fb60b3de34550a7332895a084099d99a3d436,
  b9677c50b20a1ed951962edcb593cce5f1ed9c742bc7bff827a6fc420202b045, cfb1e3cc05d575b86db6c85267a52d8f1e6785b106797319a72dd6d19b4dc317,
  e5812860a92edca97a2a04a3151d1247c066ed29ae6bbcf327d713fbad7e79e8, f74ebf0506dc3aebc9ba6ca1e7460d9d84543d7dadb5e9912b86b843e8a5b671 (decoy PDF);
  mutex SnipMutex. Companion sources: CERT-UA article 6280099; Sophos collaboration cited by Unit 42. APT Watch batch
  lookup query_ids qry_01M66X1J5VA8210TABQ6FF3P3K, qry_01M66X1JZSMM6EE4QP5V2FEBQ6, qry_01M66X1KSJYSE7G29H4TR4HP60, qry_01M66X1MC2KW8Y6PQTZQ6JWHAM: the 16 domains and the 2 Trend IPs were unknown to the database on 2026-10-30. Flag originated
  from the Trend Threat Intelligence Feed pull of 2026-10-30 (location eq 'Ukraine'), Earth Koshchei / RomCom watchlist
  match, category russia_aligned; proposed watchlist aliases to add: Void Rabisu, Tropical Scorpius, UNC2596, UAT-5647.
